<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Live Stream Receiver · Starlane</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root { --red: #E50914; --bg: #000; }
  * { box-sizing: border-box; margin: 0; padding: 0; overflow: hidden; }
  body { background: var(--bg); height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  
  /* Video Grid Layouts */
  .video-wrap { position: relative; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; }
  .video-wrap video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; width: 100%; height: 100%; background: #000; }
  .grid-4 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 4px; width: 100%; height: 100%; background: #000; }
  .grid-2 .video-wrap, .grid-4 .video-wrap { width: 100%; height: 100%; object-fit: cover; }

  /* Offline / Standby Screen */
  .offline-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; background: #0a0a0f; }
  .offline-screen svg { width: 80px; height: 98px; opacity: 0.2; margin-bottom: 24px; }
  .offline-screen h2 { font-size: 24px; font-weight: 900; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 2px; }
  .offline-screen p { font-size: 14px; color: rgba(255,255,255,0.2); margin-top: 8px; font-weight: 600; letter-spacing: 1px; }
  
  .cam-label { position: absolute; bottom: 20px; left: 20px; z-index: 20; background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; backdrop-filter: blur(4px); }
  
  /* Watermark */
  .watermark { position: absolute; top: 40px; left: 40px; z-index: 20; display: flex; align-items: center; gap: 12px; opacity: 0.5; pointer-events: none; }
  .watermark svg { width: 40px; height: 50px; }
  .watermark b { font-family: system-ui, sans-serif; font-weight: 900; font-size: 28px; color: #fff; letter-spacing: -1px; }
  .watermark b span { color: var(--red); }

  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- Watermark -->
<div class="watermark">
  <svg viewBox="0 0 60 74"><path d="M10 60 Q 22 32 44 20" stroke="#E50914" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="46" cy="18" r="5" fill="#fff"/></svg>
  <b>STAR<span>LANE</span></b>
</div>

<!-- SINGLE VIEW (Double Buffer) -->
<div id="view-single" class="video-wrap hidden">
  <video id="video-single-a" playsinline autoplay muted preload="auto"></video>
  <video id="video-single-b" playsinline autoplay muted preload="auto" style="display:none;"></video>
  
  <div class="offline-screen" id="offline-single">
    <svg viewBox="0 0 60 74"><path d="M10 60 Q 22 32 44 20" stroke="#E50914" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="46" cy="18" r="5" fill="#fff"/></svg>
    <h2 id="offline-single-text">Waiting for feed...</h2>
    <p id="offline-single-sub">Event stream is offline</p>
  </div>
</div>

<!-- 2-WAY SPLIT -->
<div id="view-2way" class="grid-2 hidden">
  <div class="video-wrap">
    <video id="video-cam1-2" playsinline autoplay muted preload="auto"></video>
    <div class="offline-screen" id="offline-cam1-2"><h2>CAM 1</h2><p>Offline</p></div>
    <div class="cam-label">CAM 1</div>
  </div>
  <div class="video-wrap">
    <video id="video-cam2-2" playsinline autoplay muted preload="auto"></video>
    <div class="offline-screen" id="offline-cam2-2"><h2>CAM 2</h2><p>Offline</p></div>
    <div class="cam-label">CAM 2</div>
  </div>
</div>

<!-- 4-WAY SPLIT -->
<div id="view-4way" class="grid-4 hidden">
  <div class="video-wrap">
    <video id="video-cam1-4" playsinline autoplay muted preload="auto"></video>
    <div class="offline-screen" id="offline-cam1-4"><h2>CAM 1</h2><p>Offline</p></div>
    <div class="cam-label" style="bottom:10px; left:10px; padding:4px 10px; font-size:12px;">CAM 1</div>
  </div>
  <div class="video-wrap">
    <video id="video-cam2-4" playsinline autoplay muted preload="auto"></video>
    <div class="offline-screen" id="offline-cam2-4"><h2>CAM 2</h2><p>Offline</p></div>
    <div class="cam-label" style="bottom:10px; left:10px; padding:4px 10px; font-size:12px;">CAM 2</div>
  </div>
  <div class="video-wrap">
    <video id="video-cam3-4" playsinline autoplay muted preload="auto"></video>
    <div class="offline-screen" id="offline-cam3-4"><h2>CAM 3</h2><p>Offline</p></div>
    <div class="cam-label" style="bottom:10px; left:10px; padding:4px 10px; font-size:12px;">CAM 3</div>
  </div>
  <div class="video-wrap">
    <video id="video-cam4-4" playsinline autoplay muted preload="auto"></video>
    <div class="offline-screen" id="offline-cam4-4"><h2>CAM 4</h2><p>Offline</p></div>
    <div class="cam-label" style="bottom:10px; left:10px; padding:4px 10px; font-size:12px;">CAM 4</div>
  </div>
</div>

<script>
(function(){
  var firebaseConfig = {
    apiKey: "AIzaSyAxki2vcYmVeZav7N1WybofdvN3n6Aa0rk",
    authDomain: "starlane-stream.firebaseapp.com",
    projectId: "starlane-stream",
    storageBucket: "starlane-stream.firebasestorage.app",
    messagingSenderId: "115625325145",
    appId: "1:115625325145:web:b14025df503bbe2b7d7748"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();

  var streamId = new URLSearchParams(window.location.search).get('id');
  if (!streamId) {
    document.body.innerHTML = '<h1 style="color:white; font-family:sans-serif; text-align:center; padding:40px;">Error: No Event ID provided.</h1>';
    return;
  }

  var views = {
    single: document.getElementById('view-single'),
    way2: document.getElementById('view-2way'),
    way4: document.getElementById('view-4way')
  };

  // ── SINGLE VIEW BUFFER LOGIC ──
  var currentActiveCam = null;
  var pendingChunks = [];
  var isQueuePlaying = false;
  var activeVidElement = document.getElementById('video-single-a');
  var inactiveVidElement = document.getElementById('video-single-b');
  var nextTimeout = null;
  var currentHistoryUrls = [];

  function playNextFromQueue() {
    if (pendingChunks.length === 0) {
      isQueuePlaying = false;
      document.getElementById('offline-single').classList.remove('hidden');
      document.getElementById('offline-single-text').textContent = "Buffering next segment...";
      return;
    }

    var url = pendingChunks.shift();
    document.getElementById('offline-single').classList.add('hidden');

    inactiveVidElement.src = url;
    inactiveVidElement.load();
    
    inactiveVidElement.play().then(function() {
      inactiveVidElement.style.display = 'block';
      activeVidElement.style.display = 'none';
      activeVidElement.pause();
      
      var temp = activeVidElement;
      activeVidElement = inactiveVidElement;
      inactiveVidElement = temp;

      activeVidElement.onended = function() {
        clearTimeout(nextTimeout);
        playNextFromQueue();
      };
      
      clearTimeout(nextTimeout);
      nextTimeout = setTimeout(function() {
        playNextFromQueue();
      }, 1950); 

    }).catch(function(err) {
      playNextFromQueue();
    });
  }

  // ── SPLIT VIEW LOGIC (Direct Swap) ──
  function updateCamBox(videoId, offlineId, url, camName) {
    var vid = document.getElementById(videoId);
    var offline = document.getElementById(offlineId);
    
    if (url && url !== 'broadcasting') {
      offline.classList.add('hidden');
      if (vid.src !== url) {
        vid.src = url;
        vid.play().catch(function(){});
      }
    } else {
      offline.classList.remove('hidden');
      vid.src = '';
    }
  }

  // ── FIREBASE LISTENER ──
  db.collection('streams').doc(streamId).onSnapshot(function(doc) {
    if (!doc.exists) return;
    var data = doc.data();
    var cams = data.cams || {};
    var activeCam = data.activeCamera || 'none';
    var camHistory = data.camHistory || {};
    var camNames = data.camNames || { cam1: 'CAM 1', cam2: 'CAM 2', cam3: 'CAM 3', cam4: 'CAM 4' };

    // Hide all views
    Object.values(views).forEach(v => v.classList.add('hidden'));

    // ── SPLIT SCREEN MODES ──
    if (activeCam === 'split4') {
      views.way4.classList.remove('hidden');
      updateCamBox('video-cam1-4', 'offline-cam1-4', cams.cam1, camNames.cam1);
      updateCamBox('video-cam2-4', 'offline-cam2-4', cams.cam2, camNames.cam2);
      updateCamBox('video-cam3-4', 'offline-cam3-4', cams.cam3, camNames.cam3);
      updateCamBox('video-cam4-4', 'offline-cam4-4', cams.cam4, camNames.cam4);
      
      // Clear single view buffers
      isQueuePlaying = false; pendingChunks = []; currentActiveCam = null;
      clearTimeout(nextTimeout);
      return;
    } 
    
    if (activeCam === 'split2') {
      views.way2.classList.remove('hidden');
      updateCamBox('video-cam1-2', 'offline-cam1-2', cams.cam1, camNames.cam1);
      updateCamBox('video-cam2-2', 'offline-cam2-2', cams.cam2, camNames.cam2);
      
      // Clear single view buffers
      isQueuePlaying = false; pendingChunks = []; currentActiveCam = null;
      clearTimeout(nextTimeout);
      return;
    }

    // ── SINGLE VIEW MODE ──
    views.single.classList.remove('hidden');

    // If the director changed the active camera, reset everything
    if (currentActiveCam !== activeCam) {
      currentActiveCam = activeCam;
      pendingChunks = [];
      currentHistoryUrls = [];
      isQueuePlaying = false;
      clearTimeout(nextTimeout);
      activeVidElement.pause(); inactiveVidElement.pause();
      activeVidElement.src = ""; inactiveVidElement.src = "";
      
      document.getElementById('offline-single').classList.remove('hidden');
      document.getElementById('offline-single-text').textContent = "Connecting to " + (camNames[activeCam] || activeCam) + "...";
    }

    // If no camera is active (Director killed it)
    if (activeCam === 'none') {
      document.getElementById('offline-single').classList.remove('hidden');
      document.getElementById('offline-single-text').textContent = "Stream Offline";
      return;
    }

    // Process the chunks
    var history = camHistory[activeCam] || [];
    
    if (!isQueuePlaying) {
      // VENUE BUFFER: Only wait for 3 chunks (6 seconds) instead of 20.
      // This keeps the venue screen as close to live as possible.
      if (history.length >= 3) {
        var startIndex = history.length - 3;
        pendingChunks = history.slice(startIndex).map(function(c) { return c.url; });
        currentHistoryUrls = history.map(function(c) { return c.url; });
        
        isQueuePlaying = true;
        document.getElementById('offline-single').classList.add('hidden');
        playNextFromQueue();
      }
    } else {
      // Append new chunks
      history.forEach(function(chunk) {
        if (!currentHistoryUrls.includes(chunk.url)) {
          currentHistoryUrls.push(chunk.url);
          pendingChunks.push(chunk.url);
        }
      });
      
      if (currentHistoryUrls.length > 50) {
         currentHistoryUrls = currentHistoryUrls.slice(-50);
      }
    }
  });

})();
</script>
</body>
</html>
