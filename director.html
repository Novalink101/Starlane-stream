<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<title>Director Studio · Starlane</title>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root { 
    --red: #E50914; 
    --bg: #ffffff; 
    --surface: #f9fafb; 
    --text: #111827; 
    --text-muted: #6b7280; 
    --border: #e5e7eb;
    --success: #10B981;
    --warning: #F59E0B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background: var(--bg); color: var(--text); 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    display: flex; flex-direction: column; align-items: center; 
    min-height: 100vh; padding: 24px; 
  }
  
  /* Navbar */
  .nav { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
  .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
  .logo svg { width: 28px; height: 34px; }
  .logo b { font-weight: 900; font-size: 20px; color: #111827; }
  .logo b span { color: var(--red); }
  .badge-admin { background: #fee2e2; color: var(--red); font-size: 10px; font-weight: 900; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; margin-left: 8px; }
  .btn-nav { font-weight: 700; font-size: 14px; color: var(--text-muted); text-decoration: none; transition: 0.2s; }
  .btn-nav:hover { color: var(--text); }

  /* Header */
  .header { text-align: center; margin-bottom: 40px; width: 100%; max-width: 900px; }
  .header h1 { font-size: 36px; font-weight: 900; letter-spacing: -1px; margin-bottom: 8px; color: #111827; }
  .header .event-title { font-size: 22px; font-weight: 800; color: var(--red); display: block; margin-top: 12px; }
  .header p { font-size: 15px; color: var(--text-muted); }

  /* Master Controls */
  .master-panel { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; width: 100%; max-width: 900px; margin-bottom: 32px; }
  @media (max-width: 768px) { .master-panel { grid-template-columns: 1fr; } }

  .master-btn { 
    padding: 24px 20px; border-radius: 16px; font-size: 16px; font-weight: 900; 
    border: 2px solid var(--border); background: #fff; color: var(--text); 
    cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 12px; 
  }
  .master-btn svg { width: 28px; height: 28px; }
  
  .master-btn.ads { border-color: var(--warning); color: var(--warning); background: #fffbeb; }
  .master-btn.ads:hover, .master-btn.ads.active { background: var(--warning); color: #fff; box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3); transform: translateY(-2px); }
  
  .master-btn.kill { border-color: var(--red); color: var(--red); background: #fee2e2; }
  .master-btn.kill:hover { background: var(--red); color: #fff; box-shadow: 0 8px 20px rgba(229, 9, 20, 0.3); transform: translateY(-2px); }

  .master-btn.reset { border-color: var(--success); color: var(--success); background: #f0fdf4; }
  .master-btn.reset:hover { background: var(--success); color: #fff; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3); transform: translateY(-2px); }

  /* Status Bar */
  .status-bar { 
    width: 100%; max-width: 900px; background: var(--surface); border: 1px solid var(--border); 
    padding: 16px 24px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; 
  }
  .status-label { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
  .status-val { font-size: 20px; font-weight: 900; color: var(--text); font-family: monospace; }
  .status-val.live { color: var(--red); }
  .status-val.killed { color: #000; background: var(--red); color: #fff; padding: 4px 12px; border-radius: 8px; }

  /* Camera Grid */
  .grid-title { font-size: 14px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; width: 100%; max-width: 900px; margin-bottom: 16px; text-align: left; }
  .camera-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; width: 100%; max-width: 900px; }
  @media (max-width: 600px) { .camera-grid { grid-template-columns: 1fr; } }
  
  .cam-btn { 
    padding: 40px 20px; border-radius: 20px; font-size: 20px; font-weight: 900; 
    border: 2px solid var(--border); background: #fff; color: var(--text); 
    cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 12px; 
  }
  .cam-btn:hover { border-color: var(--red); transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
  .cam-btn.active { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 0 12px 25px rgba(229,9,20,0.3); transform: translateY(-2px); }
  .cam-btn svg { width: 32px; height: 32px; }
  
  .split-btn { grid-column: span 2; }
  @media (max-width: 600px) { .split-btn { grid-column: span 1; } }

  /* Notifications */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: #111827; color: #fff; padding: 12px 24px; border-radius: 12px; font-weight: 700; font-size: 14px; opacity: 0; transition: 0.3s; z-index: 100; pointer-events: none; }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<nav class="nav">
  <a href="admin.html" class="logo">
    <svg viewBox="0 0 60 74"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E50914"/><stop offset="100%" stop-color="#FF5566"/></linearGradient></defs><path d="M10 60 Q 22 32 44 20" stroke="url(#sg)" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="46" cy="18" r="5" fill="#fff"/><circle cx="46" cy="18" r="2.5" fill="#E50914"/></svg>
    <b>STAR<span>LANE</span></b>
    <span class="badge-admin">Director</span>
  </a>
  <a href="admin.html" class="btn-nav">Exit Studio</a>
</nav>

<div class="header">
  <h1>Broadcast Control</h1>
  <p>Take full command of the live feed.</p>
  <span class="event-title" id="event-title">Connecting to event...</span>
</div>

<!-- Master Controls -->
<div class="master-panel">
  <button class="master-btn ads" id="btn-ads">
    <i data-lucide="play-circle"></i>
    Fire Ads
  </button>
  
  <button class="master-btn kill" id="btn-kill">
    <i data-lucide="power"></i>
    Kill Stream
  </button>

  <button class="master-btn reset" id="btn-reset">
    <i data-lucide="rotate-ccw"></i>
    Resume Stream
  </button>
</div>

<!-- Status Bar -->
<div class="status-bar">
  <div>
    <div class="status-label">Broadcast Status</div>
    <div class="status-val" id="status-display">--:--</div>
  </div>
  <div style="text-align: right;">
    <div class="status-label">Active Camera</div>
    <div class="status-val" id="active-cam-display">NONE</div>
  </div>
</div>

<!-- Camera Grid -->
<div class="grid-title">Switch Cameras</div>
<div class="camera-grid" id="controls">
  <button class="cam-btn" data-cam="cam1"><i data-lucide="camera"></i> <span id="label-cam1">CAM 1</span></button>
  <button class="cam-btn" data-cam="cam2"><i data-lucide="camera"></i> <span id="label-cam2">CAM 2</span></button>
  <button class="cam-btn" data-cam="cam3"><i data-lucide="camera"></i> <span id="label-cam3">CAM 3</span></button>
  <button class="cam-btn" data-cam="cam4"><i data-lucide="camera"></i> <span id="label-cam4">CAM 4</span></button>
  <button class="cam-btn split-btn" data-cam="split4"><i data-lucide="layout-grid"></i> SPLIT SCREEN</button>
</div>

<div id="toast" class="toast"></div>

<script>
  var firebaseConfig = { apiKey: "AIzaSyAxki2vcYmVeZav7N1WybofdvN3n6Aa0rk", authDomain: "starlane-stream.firebaseapp.com", projectId: "starlane-stream", storageBucket: "starlane-stream.firebasestorage.app", messagingSenderId: "115625325145", appId: "1:115625325145:web:b14025df503bbe2b7d7748" };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();

  var currentEventId = new URLSearchParams(window.location.search).get('event');
  var eventStartTime = null;
  var isKilled = false;

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 3000);
  }

  if (!currentEventId) {
    document.getElementById('event-title').textContent = "⚠️ No Event ID found";
    document.getElementById('controls').style.display = 'none';
  } else {
    
    // 1. Listen to Event Data in Real-Time
    db.collection('streams').doc(currentEventId).onSnapshot(function(doc) {
      if (!doc.exists) return;
      var data = doc.data();
      
      var activeCam = data.activeCamera || 'none';
      var camNames = data.camNames || { cam1: 'CAM 1', cam2: 'CAM 2', cam3: 'CAM 3', cam4: 'CAM 4' };
      isKilled = !!data.killedAt;

      // Update Titles & Labels
      document.getElementById('event-title').textContent = data.title || 'Untitled Event';
      document.getElementById('label-cam1').textContent = camNames.cam1;
      document.getElementById('label-cam2').textContent = camNames.cam2;
      document.getElementById('label-cam3').textContent = camNames.cam3;
      document.getElementById('label-cam4').textContent = camNames.cam4;
      
      // Update Active Camera Display
      var camDisplay = document.getElementById('active-cam-display');
      if (activeCam === 'none') camDisplay.textContent = 'OFFLINE';
      else if (activeCam === 'split4') camDisplay.textContent = 'SPLIT SCREEN';
      else if (activeCam === 'split2') camDisplay.textContent = 'SPLIT 2-WAY';
      else camDisplay.textContent = camNames[activeCam] || activeCam.toUpperCase();

      // Highlight Active Button
      document.querySelectorAll('.cam-btn').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.cam === activeCam);
      });

      // Highlight Ads Button
      document.getElementById('btn-ads').classList.toggle('active', data.forceAds === true);

      // Update Status Text
      var statusDisplay = document.getElementById('status-display');
      if (isKilled) {
        statusDisplay.textContent = 'KILLED';
        statusDisplay.className = 'status-val killed';
      } else {
        statusDisplay.className = 'status-val live';
        if (data.startDate && data.startTime) {
          eventStartTime = new Date(data.startDate + 'T' + data.startTime).getTime();
        }
      }
      
      if (window.lucide) lucide.createIcons();
    });

    // 2. Live Timer
    setInterval(function() {
      if (isKilled || !eventStartTime) return;
      var display = document.getElementById('status-display');
      var diff = eventStartTime - Date.now();

      if (diff > 0) {
        var mins = Math.floor(diff / 60000);
        var secs = Math.floor((diff % 60000) / 1000);
        display.textContent = "Starts in " + mins + "m " + secs + "s";
        display.style.color = "var(--warning)";
      } else {
        var over = Date.now() - eventStartTime;
        display.textContent = "LIVE: " + Math.floor(over / 60000) + "m " + Math.floor((over % 60000) / 1000) + "s";
        display.style.color = "var(--red)";
      }
    }, 1000);

    // 3. Switch Camera Buttons
    document.querySelectorAll('.cam-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        if (isKilled) return showToast("Stream is killed. Please click Resume first.");
        
        var cam = this.dataset.cam;
        // Clear kill flags when switching cams so the stream resumes
        db.collection('streams').doc(currentEventId).update({ 
          activeCamera: cam, 
          forceAds: false
        }).then(function() {
          showToast("Switched to " + cam.toUpperCase());
        }).catch(function(err) { 
          showToast("Error: " + err.message); 
        });
      });
    });

    // 4. Fire Ads Button
    document.getElementById('btn-ads').addEventListener('click', function() {
      if (isKilled) return showToast("Stream is killed.");
      
      var isFiring = !this.classList.contains('active');
      db.collection('streams').doc(currentEventId).update({ forceAds: isFiring })
        .then(function() { 
          showToast(isFiring ? "Ads fired! Viewers are seeing the ad loop." : "Ads stopped. Returning to live feed."); 
        });
    });

    // 5. Kill Stream Button
    document.getElementById('btn-kill').addEventListener('click', function() {
      var pin = prompt("Enter the Kill PIN to stop the broadcast:");
      if (pin === "2138") {
        db.collection('streams').doc(currentEventId).update({
          killedAt: firebase.firestore.FieldValue.serverTimestamp(),
          forceAds: true
        }).then(function() {
          showToast("STREAM KILLED. Cameras will disconnect.");
        });
      } else if (pin !== null) {
        showToast("Incorrect PIN.");
      }
    });

    // 6. Resume Stream Button
    document.getElementById('btn-reset').addEventListener('click', function() {
      if (!confirm("Resume stream? This clears the Kill Switch and removes ads.")) return;
      
      db.collection('streams').doc(currentEventId).update({
        killedAt: firebase.firestore.FieldValue.delete(),
        forceAds: false
      }).then(function() {
        showToast("Stream reset. Cameras can go live again.");
      });
    });
  }

  if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
