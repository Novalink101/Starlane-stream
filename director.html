<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Director Studio · Starlane</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  body { background: #050508; color: #fff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; text-align: center; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 600px; }
  .btn { padding: 24px; border-radius: 16px; font-size: 20px; font-weight: 900; border: 2px solid #333; background: #111; color: #fff; cursor: pointer; transition: 0.2s; }
  .btn.active { background: #E50914; border-color: #E50914; box-shadow: 0 0 20px rgba(229,9,20,0.5); }
  .btn:hover { border-color: #E50914; }
  h1 { margin-bottom: 24px; }
</style>
</head>
<body>

  <h1>Director Studio</h1>
  
  <div class="grid">
    <button class="btn active" data-cam="cam1">CAM 1</button>
    <button class="btn" data-cam="cam2">CAM 2</button>
    <button class="btn" data-cam="cam3">CAM 3</button>
    <button class="btn" data-cam="split">SPLIT SCREEN</button>
  </div>

<script>
  var firebaseConfig = { /* YOUR FIREBASE CONFIG */ };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();

  var eventId = new URLSearchParams(window.location.search).get('id') || 'YOUR_STREAM_ID_HERE';

  document.querySelectorAll('.btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var cam = this.dataset.cam;
      
      // Update UI
      document.querySelectorAll('.btn').forEach(function(b) { b.classList.remove('active'); });
      this.classList.add('active');

      // Update Database
      db.collection('streams').doc(eventId).update({ activeCamera: cam })
        .then(function() { console.log("Switched to", cam); })
        .catch(function(err) { alert("Error switching: " + err.message); });
    });
  });
</script>
</body>
</html>
