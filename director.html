<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Director Studio · Starlane</title>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root { --red: #E50914; --bg: #050508; --surface: #14141c; --text: #fff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; text-align: center; }
  
  h1 { font-size: 28px; font-weight: 900; letter-spacing: -1px; margin-bottom: 8px; }
  p { font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 30px; }
  
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 600px; }
  
  .btn { 
    padding: 30px 20px; border-radius: 16px; font-size: 20px; font-weight: 900; 
    border: 2px solid #333; background: #111; color: #fff; cursor: pointer; 
    transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .btn:hover { border-color: var(--red); }
  .btn.active { background: var(--red); border-color: var(--red); box-shadow: 0 0 30px rgba(229,9,20,0.4); }
  .btn svg { width: 28px; height: 28px; }
  
  .status-bar { position: fixed; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 800; color: rgba(255,255,255,0.4); }
  .live-indicator { display: flex; align-items: center; gap: 6px; color: var(--red); }
  .live-indicator .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .error { background: #fee2e2; color: #E50914; padding: 16px; border-radius: 12px; margin-bottom: 20px; font-weight: 700; display: none; }
</style>
</head>
<body>

<div class="status-bar">
  <div>DIRECTOR STUDIO</div>
  <div class="live-indicator"><div class="dot"></div> BROADCASTING</div>
</div>

<div style="width: 100%; max-width: 600px;">
  <h1>Camera Switcher</h1>
  <p id="event-label">Loading event...</p>

  <div id="error-box" class="error"></div>

  <div class="grid" id="controls">
    <button class="btn" data-cam="cam1">
      <i data-lucide="camera"></i> CAM 1
    </button>
    <button class="btn" data-cam="cam2">
      <i data-lucide="camera"></i> CAM 2
    </button>
    <button class="btn" data-cam="cam3">
      <i data-lucide="camera"></i> CAM 3
    </button>
    <button class="btn" data-cam="split">
      <i data-lucide="layout-grid"></i> SPLIT
    </button>
  </div>
</div>

<script>
  var firebaseConfig = {
    apiKey: "AIzaSyAxki2vcYmVeZav7N1WybofdvN3n6Aa0rk",
    authDomain: "starlane-stream.firebaseapp.com",
    projectId: "starlane-stream",
    storageBucket: "starlane-stream.firebasestorage.app",
    messagingSenderId: "115625325145",
    appId: "1:115625325145:web:b14025df503bbe2b7d7748"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();

  // 1. Read URL for Event ID
  var params = new URLSearchParams(window.location.search);
  var currentEventId = params.get('event');

  if (!currentEventId) {
    document.getElementById('error-box').style.display = 'block';
    document.getElementById('error-box').textContent = "⚠️ No Event ID found. Please use the link from the Admin Dashboard.";
    document.getElementById('controls').style.display = 'none';
  } else {
    document.getElementById('event-label').textContent = "Event ID: " + currentEventId;
    
    // 2. Listen to Firebase to highlight the active camera
    db.collection('streams').doc(currentEventId).onSnapshot(function(doc) {
      if (!doc.exists) return;
      var data = doc.data();
      var activeCam = data.activeCamera || 'cam1';
      
      // Highlight the correct button
      document.querySelectorAll('.btn').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.cam === activeCam);
      });
    });
  }

  // 3. Handle Button Clicks
  document.querySelectorAll('.btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      if (!currentEventId) return;
      
      var cam = this.dataset.cam;
      
      // Update Firebase
      db.collection('streams').doc(currentEventId).update({ activeCamera: cam })
        .then(function() {
          console.log("Switched to", cam);
        })
        .catch(function(err) {
          alert("Error switching camera: " + err.message);
        });
    });
  });

  if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
