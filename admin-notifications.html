<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#030407" />
<title>Send Notifications · FORESTBASE Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root { 
    --ink-black: #030407; --silver-glass: #AAB0C4; --bright-lime: #A3FF12;
    --surface: #FFFFFF; --surface-2: #F1F3F7; --border: #E2E5EB;
    --text: #111827; --text-muted: #6B7280;
    --font-display: 'Space Grotesk', sans-serif; --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FAFBFC; color: var(--text); font-family: var(--font-body); display: flex; min-height: 100vh; }
  a { text-decoration: none; color: inherit; }

  #loader { position: fixed; inset: 0; background: var(--ink-black); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; color: var(--bright-lime); font-family: var(--font-display); gap: 16px; }
  .spinner { width: 40px; height: 40px; border: 3px solid rgba(163,255,18,0.2); border-top-color: var(--bright-lime); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .sidebar { width: 260px; background: var(--ink-black); padding: 24px; position: fixed; height: 100vh; }
  .nav-brand { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 20px; color: #fff; margin-bottom: 40px; }
  .nav-brand span { color: var(--bright-lime); }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--silver-glass); transition: 0.2s; margin-bottom: 8px; }
  .nav-item:hover, .nav-item.active { background: var(--bright-lime); color: var(--ink-black); }

  .main-content { margin-left: 260px; flex: 1; padding: 40px; }
  .panel { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 32px; max-width: 600px; margin: 0 auto; }
  .panel-title { font-family: var(--font-display); font-size: 24px; font-weight: 700; margin-bottom: 8px; }
  .panel-sub { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
  
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); font-family: var(--font-body); }
  .form-group textarea { min-height: 120px; resize: vertical; }
  .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--bright-lime); background: #fff; }

  .btn-submit { background: var(--bright-lime); color: var(--ink-black); border: none; padding: 16px 32px; border-radius: 10px; font-family: var(--font-display); font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; transition: 0.2s; }
  .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(163,255,18,0.3); }
</style>
</head>
<body>

<div id="loader"><div class="spinner"></div> Authenticating...</div>

<aside class="sidebar" id="sidebar" style="display: none;">
  <a href="index.html" class="nav-brand">FOREST<span>BASE</span></a>
  <a href="admin.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Command Center</a>
  <div class="nav-item active"><i data-lucide="bell"></i> Send Notifications</div>
</aside>

<main class="main-content" id="main" style="display: none;">
  <div class="panel">
    <h2 class="panel-title">Broadcast Notification</h2>
    <p class="panel-sub">Send a real-time message to all users currently on the platform.</p>

    <form id="notif-form">
      <div class="form-group">
        <label>Notification Type</label>
        <select id="notif-type">
          <option value="info">General Info</option>
          <option value="success">Success / Update</option>
          <option value="warning">Warning / Alert</option>
        </select>
      </div>

      <div class="form-group">
        <label>Title</label>
        <input type="text" id="notif-title" placeholder="e.g. Welcome to the Forest!" required />
      </div>

      <div class="form-group">
        <label>Message</label>
        <textarea id="notif-message" placeholder="Type your message here..." required></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">
        <i data-lucide="send"></i> Broadcast to All Users
      </button>
    </form>
  </div>
</main>

<script>
(function(){
  var firebaseConfig = {
    apiKey: "AIzaSyAxki2vcYmVeZav7N1WybofdvN3n6Aa0rk",
    authDomain: "starlane-stream.firebaseapp.com",
    projectId: "starlane-stream",
    storageBucket: "starlane-stream.firebasestorage.app",
    messagingSenderId: "115625325145",
    appId: "1:115625325145:web:b14025df503bbe2b7d7748"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();
  var ADMIN_EMAILS = ['nylnathan340@gmail.com', 'customerservicesnovalink@gmail.com'];

  auth.onAuthStateChanged(function(user) {
    if (user && ADMIN_EMAILS.includes(user.email)) {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('sidebar').style.display = 'block';
      document.getElementById('main').style.display = 'block';
      if(window.lucide) lucide.createIcons();
    } else {
      window.location.href = 'login.html';
    }
  });

  document.getElementById('notif-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerHTML = 'Sending...';

    db.collection('global_notifications').add({
      title: document.getElementById('notif-title').value,
      message: document.getElementById('notif-message').value,
      type: document.getElementById('notif-type').value,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function() {
      btn.innerHTML = 'Sent Successfully!';
      btn.style.background = '#059669';
      btn.style.color = '#fff';
      document.getElementById('notif-form').reset();
      setTimeout(function() {
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="send"></i> Broadcast to All Users';
        btn.style.background = 'var(--bright-lime)';
        btn.style.color = 'var(--ink-black)';
        if(window.lucide) lucide.createIcons();
      }, 2500);
    });
  });
})();
</script>
</body>
</html>
