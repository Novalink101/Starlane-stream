<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="color-scheme" content="light" />
<title>Page Not Found · FORESTBASE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>

<style>
  :root { 
    --lime: #A3FF12; 
    --lime-hover: #85D60F;
    --bg: #FAFBFC; 
    --surface: #FFFFFF; 
    --text: #111827; 
    --text-muted: #6b7280; 
    --border: #E2E5EB;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body { 
    background: var(--bg); 
    color: var(--text); 
    font-family: var(--font-body); 
    display: flex; 
    flex-direction: column;
    align-items: center; 
    justify-content: center; 
    min-height: 100vh; 
    padding: 24px;
    overflow-x: hidden;
    position: relative;
    text-align: center;
  }
  a { text-decoration: none; color: inherit; }

  /* Navbar */
  .nav { position: absolute; top: 0; left: 0; right: 0; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo svg { width: 28px; height: 34px; }
  .logo b { font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--text); letter-spacing: -0.03em; }
  .logo b span { color: var(--lime-hover); }
  
  .btn-home-nav { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--text-muted); transition: 0.2s; }
  .btn-home-nav:hover { color: var(--text); }

  /* 404 Content */
  .container { max-width: 500px; z-index: 1; margin-top: 40px; }
  
  .error-code { 
    font-family: var(--font-display);
    font-size: clamp(100px, 20vw, 160px); 
    font-weight: 700; 
    line-height: 0.9; 
    letter-spacing: -0.05em; 
    background: linear-gradient(135deg, var(--lime) 0%, var(--lime-hover) 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 10px 20px rgba(163,255,18,0.2));
    margin-bottom: 20px;
  }

  .icon-box { 
    width: 72px; height: 72px; 
    background: rgba(163,255,18,0.15); 
    color: var(--lime-hover); 
    border-radius: 50%; display: flex; align-items: center; justify-content: center; 
    margin: 0 auto 24px; font-size: 32px; 
    border: 1px solid rgba(163,255,18,0.3);
  }

  .container h1 { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 12px; color: var(--text); }
  .container p { font-size: 16px; color: var(--text-muted); line-height: 1.6; margin-bottom: 32px; font-weight: 500; }

  .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  
  .btn { 
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; 
    padding: 14px 28px; border-radius: 12px; font-size: 15px; font-weight: 700; 
    transition: 0.2s; cursor: pointer; border: none; font-family: var(--font-display);
  }
  .btn-primary { 
    background: var(--lime); 
    color: var(--text); 
    box-shadow: 0 8px 20px rgba(163,255,18,0.3); 
  }
  .btn-primary:hover { 
    background: var(--lime-hover); 
    transform: translateY(-2px); 
    box-shadow: 0 12px 24px rgba(163,255,18,0.4);
  }
  .btn-ghost { 
    background: var(--surface); 
    color: var(--text); 
    border: 1px solid var(--border); 
  }
  .btn-ghost:hover { 
    background: var(--bg); 
    border-color: var(--text);
  }

</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="logo">
    <svg viewBox="0 0 60 74" aria-hidden="true">
      <path d="M30 4 L54 46 H6 Z" fill="#111827" />
      <path d="M30 22 L44 46 H16 Z" fill="#A3FF12" />
      <path d="M10 52 H50 V64 H10 Z" fill="#AAB0C4" />
      <path d="M20 56 H40 V60 H20 Z" fill="#FFFFFF" />
    </svg>
    <b>FOREST<span>BASE</span></b>
  </a>
  <a href="index.html" class="btn-home-nav"><i data-lucide="arrow-left" size="16"></i> Back to Home</a>
</nav>

<div class="container">
  <div class="error-code">404</div>
  <div class="icon-box"><i data-lucide="map-off"></i></div>
  <h1>Lost in the forest</h1>
  <p>The mystery you seek doesn't exist, has been moved, or the link is incorrect. Let's get you back to the marketplace.</p>
  
  <div class="btn-group">
    <a href="index.html" class="btn btn-primary"><i data-lucide="home" size="18"></i> Go to Homepage</a>
    <a href="browse.html" class="btn btn-ghost"><i data-lucide="shopping-bag" size="18"></i> Explore Products</a>
  </div>
</div>

<script>
  if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
