<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="color-scheme" content="light" />
<title>Page Not Found · Starlane Stream</title>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<style>
  :root { 
    --red: #E50914; 
    --red-hover: #FF3B4E;
    --bg: #ffffff; 
    --surface: #f9fafb; 
    --text: #111827; 
    --text-muted: #6b7280; 
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background: var(--bg); 
    color: var(--text); 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    display: flex; 
    flex-direction: column;
    align-items: center; 
    justify-content: center; 
    min-height: 100vh; 
    padding: 24px;
    overflow-x: hidden;
    position: relative;
    text-align: center;
  }
  a { text-decoration: none; color: inherit; }

  /* ── MOVING STARFIELD BACKGROUND (WHITE) ── */
  .starfield { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: #ffffff; overflow: hidden; }
  .stars-1 { position: absolute; inset: -50%; background-image: radial-gradient(1.5px 1.5px at 10% 20%, rgba(229,9,20,.15), transparent 100%), radial-gradient(1px 1px at 85% 15%, rgba(0,0,0,.08), transparent 100%), radial-gradient(2px 2px at 45% 35%, rgba(229,9,20,.1), transparent 100%); background-size: 200px 200px; animation: drift 40s linear infinite; }
  .stars-2 { position: absolute; inset: -50%; background-image: radial-gradient(1px 1px at 20% 30%, rgba(229,9,20,.3), transparent 100%), radial-gradient(2px 2px at 60% 10%, rgba(0,0,0,.15), transparent 100%); background-size: 300px 300px; animation: drift 20s linear infinite reverse; }
  @keyframes drift { 0% { transform: translateY(0) translateX(0); } 100% { transform: translateY(-200px) translateX(-100px); } }

  /* Navbar */
  .nav { position: absolute; top: 0; left: 0; right: 0; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo svg { width: 28px; height: 34px; }
  .logo b { font-weight: 900; font-size: 20px; color: #111827; letter-spacing: -0.5px; }
  .logo b span { color: var(--red); }
  
  .btn-home-nav { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--text-muted); transition: 0.2s; }
  .btn-home-nav:hover { color: var(--text); }

  /* 404 Content */
  .container { max-width: 500px; z-index: 1; margin-top: 40px; }
  
  .error-code { 
    font-size: clamp(100px, 20vw, 160px); 
    font-weight: 900; 
    line-height: 0.9; 
    letter-spacing: -0.05em; 
    background: linear-gradient(135deg, var(--red) 0%, #FF5566 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 10px 20px rgba(229,9,20,0.15));
    margin-bottom: 20px;
  }

  .icon-box { 
    width: 72px; height: 72px; 
    background: #fee2e2; color: var(--red); 
    border-radius: 50%; display: flex; align-items: center; justify-content: center; 
    margin: 0 auto 24px; font-size: 32px; 
  }

  .container h1 { font-size: 28px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 12px; color: #111827; }
  .container p { font-size: 16px; color: var(--text-muted); line-height: 1.6; margin-bottom: 32px; font-weight: 500; }

  .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  
  .btn { 
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; 
    padding: 14px 28px; border-radius: 12px; font-size: 15px; font-weight: 800; 
    transition: 0.2s; cursor: pointer; border: none; font-family: inherit;
  }
  .btn-primary { background: var(--red); color: #fff; box-shadow: 0 8px 20px rgba(229,9,20,0.3); }
  .btn-primary:hover { background: var(--red-hover); transform: translateY(-2px); }
  .btn-ghost { background: #ffffff; color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--surface); }

</style>
</head>
<body>

<div class="starfield"><div class="stars-1"></div><div class="stars-2"></div></div>

<nav class="nav">
  <a href="index.html" class="logo">
    <svg viewBox="0 0 60 74" aria-hidden="true">
      <defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E50914"/><stop offset="100%" stop-color="#FF5566"/></linearGradient></defs>
      <path d="M10 60 Q 22 32 44 20" stroke="url(#sg)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M16 62 Q 26 40 46 26" stroke="url(#sg)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>
      <circle cx="46" cy="18" r="5" fill="#fff"/><circle cx="46" cy="18" r="2.5" fill="#E50914"/>
    </svg>
    <b>STAR<span>LANE</span></b>
  </a>
  <a href="index.html" class="btn-home-nav"><i data-lucide="arrow-left" size="16"></i> Back to Home</a>
</nav>

<div class="container">
  <div class="error-code">404</div>
  <div class="icon-box"><i data-lucide="map-off"></i></div>
  <h1>Lost in space</h1>
  <p>The page you are looking for doesn't exist, has been moved, or the link is incorrect. Let's get you back on track.</p>
  
  <div class="btn-group">
    <a href="index.html" class="btn btn-primary"><i data-lucide="home" size="18"></i> Go to Homepage</a>
    <a href="https://novalink-tickets.onrender.com" class="btn btn-ghost"><i data-lucide="ticket" size="18"></i> Find Tickets</a>
  </div>
</div>

<script>
  if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
