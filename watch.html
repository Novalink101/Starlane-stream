<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="color-scheme" content="light" />
<title>Watch Event · Starlane Stream</title>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root { --red: #E50914; --red-hover: #FF3B4E; --bg: #ffffff; --surface: #f9fafb; --text: #111827; --text-muted: #6b7280; --border: #e5e7eb; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; position: relative; text-align: center; }
  a { text-decoration: none; color: inherit; }
  .hidden { display: none !important; }

  .starfield { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: #ffffff; overflow: hidden; }
  .stars-1 { position: absolute; inset: -50%; background-image: radial-gradient(1.5px 1.5px at 10% 20%, rgba(229,9,20,.15), transparent 100%); background-size: 200px 200px; animation: drift 40s linear infinite; }
  @keyframes drift { 0% { transform: translateY(0) translateX(0); } 100% { transform: translateY(-200px) translateX(-100px); } }

  .nav { position: absolute; top: 0; left: 0; right: 0; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; z-index: 50; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo svg { width: 28px; height: 34px; }
  .logo b { font-weight: 900; font-size: 20px; color: #111827; }
  .logo b span { color: var(--red); }
  .btn-nav { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--text-muted); }
  .btn-nav:hover { color: var(--text); }

  .card { background: #ffffff; border: 1px solid var(--border); border-radius: 24px; padding: 48px 40px; max-width: 480px; margin: 0 auto; box-shadow: 0 20px 40px -10px rgba(0,0,0,0.08); z-index: 1; margin-top: 60px; }
  .icon-box { width: 72px; height: 72px; background: #fee2e2; color: var(--red); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 32px; }
  .card h1 { font-size: 26px; font-weight: 900; margin-bottom: 12px; }
  .card p { font-size: 15px; color: var(--text-muted); margin-bottom: 28px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 16px 24px; border-radius: 12px; font-weight: 800; font-size: 16px; text-decoration: none; border: none; cursor: pointer; transition: 0.2s; width: 100%; margin-bottom: 12px; }
  .btn-primary { background: var(--red); color: #fff; }
  .btn-ghost { background: #ffffff; color: var(--text); border: 1px solid var(--border); }

  .player-container { position: relative; width: 100%; max-width: 1100px; aspect-ratio: 16/9; background: #000; border-radius: 20px; overflow: hidden; margin-top: 60px; z-index: 1; }
  .player-container video { width: 100%; height: 100%; display: block; object-fit: contain; }

  .split-screen { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; width: 100%; height: 100%; gap: 2px; background: #000; }
  .split-screen video { width: 100%; height: 100%; object-fit: cover; }
  .split-screen video:first-child { grid-column: 1 / -1; }

  .fullscreen-overlay { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0a0f; }
  .fullscreen-overlay.hidden { display: none; }
  .fullscreen-overlay .logos { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 24px; }
  .fullscreen-overlay .logos .plus { font-size: 24px; color: rgba(255,255,255,0.3); }
  .fullscreen-overlay h2 { font-size: 24px; font-weight: 900; color: #fff; margin-bottom: 8px; }
  .fullscreen-overlay p { font-size: 15px; color: rgba(255,255,255,0.6); }
  .prestream-spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--red); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 24px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="starfield"><div class="stars-1"></div></div>

<nav class="nav">
  <a href="index.html" class="logo">
    <svg viewBox="0 0 60 74"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E50914"/><stop offset="100%" stop-color="#FF5566"/></linearGradient></defs><path d="M10 60 Q 22 32 44 20" stroke="url(#sg)" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="46" cy="18" r="5" fill="#fff"/><circle cx="46" cy="18" r="2.5" fill="#E50914"/></svg>
    <b>STAR<span>LANE</span></b>
  </a>
  <a href="index.html" class="btn-nav"><i data-lucide="arrow-left" size="16"></i> Back to Home</a>
</nav>

<div id="screen-loading" class="card">
  <div class="prestream-spinner" style="margin: 0 auto 20px;"></div>
  <h1 style="font-size:20px;">Checking access…</h1>
</div>

<div id="screen-paywall" class="card hidden">
  <div class="icon-box"><i data-lucide="ticket"></i></div>
  <h1>Ticket Required</h1>
  <p id="paywall-msg">You need a ticket to watch this event.</p>
  <div id="paywall-actions"></div>
</div>

<div id="screen-player" class="hidden" style="width:100%; display:flex; justify-content:center;">
  <div class="player-container">
    
    <!-- Single Camera -->
    <video id="video" playsinline autoplay muted preload="auto"></video>

    <!-- Split Screen -->
    <div class="split-screen hidden" id="split-screen">
      <video id="video-cam1" playsinline autoplay muted preload="auto"></video>
      <video id="video-cam2" playsinline autoplay muted preload="auto"></video>
      <video id="video-cam3" playsinline autoplay muted preload="auto"></video>
    </div>

    <!-- Waiting Overlay -->
    <div class="fullscreen-overlay" id="waiting-overlay">
      <div class="prestream-spinner"></div>
      <div class="logos">
        <b style="color:#00E5E5; font-size:20px; font-weight:900;">NOVALINK</b>
        <span class="plus">×</span>
        <b style="color:#fff; font-size:20px; font-weight:900;">STAR<span style="color:var(--red)">LANE</span></b>
      </div>
      <h2 id="waiting-title">Connecting to live feed...</h2>
      <p id="waiting-sub">More than just ticketing.</p>
    </div>
  </div>
</div>

<script>
(function(){
  var firebaseConfig = {
    apiKey: "AIzaSyAxki2vcYmVeZav7N1WybofdvN3n6Aa0rk",
    authDomain: "starlane-stream.firebaseapp.com",
    projectId: "starlane-stream",
    storageBucket: "starlane-stream.firebasestorage.app",
    messagingSenderId: "115625325145",
    appId: "1:115625325145:web:b14025df503bbe2b7d7748"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();
  var auth = firebase.auth();

  var video = document.getElementById('video');
  var splitScreen = document.getElementById('split-screen');
  var cam1Video = document.getElementById('video-cam1');
  var cam2Video = document.getElementById('video-cam2');
  var cam3Video = document.getElementById('video-cam3');
  var waitingOverlay = document.getElementById('waiting-overlay');
  
  var screens = {
    loading: document.getElementById('screen-loading'),
    paywall: document.getElementById('screen-paywall'),
    player: document.getElementById('screen-player')
  };

  function showScreen(name) {
    screens.loading.classList.add('hidden');
    screens.paywall.classList.add('hidden');
    screens.player.classList.add('hidden');
    screens[name].classList.remove('hidden');
  }

  var streamId = new URLSearchParams(window.location.search).get('id');
  if (!streamId) {
    showScreen('paywall');
    document.getElementById('paywall-msg').textContent = "This link is missing the event ID.";
    return;
  }

  auth.onAuthStateChanged(function(user) {
    db.collection('streams').doc(streamId).get().then(function(doc) {
      if (!doc.exists) return showPaywall("Event not found.");
      
      var streamData = doc.data();
      var price = streamData.ppvPrice || 0;
      
      if (price === 0) return startPlayer();

      if (user) {
        db.collection('users').doc(user.uid).collection('passes').doc(streamId).get().then(function(passDoc) {
          if (passDoc.exists) startPlayer();
          else showPaywall(price);
        });
      } else {
        showPaywall(price);
      }
    });
  });

  function showPaywall(price) {
    showScreen('paywall');
    document.getElementById('paywall-actions').innerHTML = `
      <a href="checkout.html?streamId=${streamId}&price=${price}" class="btn btn-primary">Pay R${price} Now</a>
      <a href="https://novalink-tickets.onrender.com" class="btn btn-ghost">Buy on Novalink</a>
    `;
    if (window.lucide) lucide.createIcons();
  }

  var currentVideoUrl = '';
  
  function startPlayer() {
    showScreen('player');
    
    // Function to load a URL and handle the retry logic
    function loadVideoUrl(element, url) {
      if (!url) return;
      
      // If it's already playing this exact URL, ignore
      if (element.src === url) return;
      
      element.src = url;
      element.load(); // Force the browser to fetch the new chunk
      
      element.play().catch(function(err) {
        console.warn("Playback blocked or failed. Retrying...", err);
        // If it fails (e.g. Cloudinary is still processing), wait 1 second and try again
        setTimeout(function() {
          element.play().catch(function(){});
        }, 1000);
      });
    }

    // Poll the database every 2.5 seconds
    setInterval(function() {
      db.collection('streams').doc(streamId).get().then(function(doc) {
        if (!doc.exists) return;
        var data = doc.data();
        
        var activeCam = data.activeCamera || 'cam1';
        
        if (activeCam === 'split') {
          video.classList.add('hidden');
          splitScreen.classList.remove('hidden');
          waitingOverlay.classList.add('hidden');
          
          if (data.cams && data.cams.cam1) loadVideoUrl(cam1Video, data.cams.cam1);
          if (data.cams && data.cams.cam2) loadVideoUrl(cam2Video, data.cams.cam2);
          if (data.cams && data.cams.cam3) loadVideoUrl(cam3Video, data.cams.cam3);
          
        } else {
          splitScreen.classList.add('hidden');
          video.classList.remove('hidden');
          
          var camUrl = null;
          if (data.cams && data.cams[activeCam]) {
            camUrl = data.cams[activeCam];
          } else if (data.streamUrl && data.streamUrl !== 'broadcasting') {
            camUrl = data.streamUrl;
          }

          if (camUrl) {
            if (camUrl !== currentVideoUrl) {
              currentVideoUrl = camUrl;
              loadVideoUrl(video, camUrl);
              waitingOverlay.classList.add('hidden');
            }
          } else {
            waitingOverlay.classList.remove('hidden');
            document.getElementById('waiting-title').textContent = "Waiting for camera...";
          }
        }
      });
    }, 2500);
  }

  if (window.lucide) lucide.createIcons();
})();
</script>
</body>
</html>
