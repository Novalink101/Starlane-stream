<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="color-scheme" content="light" />
<title>Watch Event · Starlane Stream</title>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root { --red: #E50914; --red-hover: #FF3B4E; --bg: #ffffff; --surface: #f9fafb; --text: #111827; --text-muted: #6b7280; --border: #e5e7eb; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; overflow-x: hidden; position: relative; text-align: center; }
  a { text-decoration: none; color: inherit; }
  .hidden { display: none !important; }

  /* Starfield */
  .starfield { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: #ffffff; overflow: hidden; }
  .stars-1 { position: absolute; inset: -50%; background-image: radial-gradient(1.5px 1.5px at 10% 20%, rgba(229,9,20,.15), transparent 100%), radial-gradient(1px 1px at 85% 15%, rgba(0,0,0,.08), transparent 100%); background-size: 200px 200px; animation: drift 40s linear infinite; }
  @keyframes drift { 0% { transform: translateY(0) translateX(0); } 100% { transform: translateY(-200px) translateX(-100px); } }

  /* Navbar */
  .nav { position: absolute; top: 0; left: 0; right: 0; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; z-index: 50; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo svg { width: 28px; height: 34px; }
  .logo b { font-weight: 900; font-size: 20px; color: #111827; letter-spacing: -0.5px; }
  .logo b span { color: var(--red); }
  .btn-nav { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--text-muted); transition: 0.2s; }
  .btn-nav:hover { color: var(--text); }

  /* Cards */
  .card { background: #ffffff; border: 1px solid var(--border); border-radius: 24px; padding: 48px 40px; max-width: 480px; margin: 0 auto; box-shadow: 0 20px 40px -10px rgba(0,0,0,0.08); z-index: 1; margin-top: 60px; }
  .icon-box { width: 72px; height: 72px; background: #fee2e2; color: var(--red); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 32px; }
  .card h1 { font-size: 26px; font-weight: 900; margin-bottom: 12px; letter-spacing: -0.5px; color: #111827; }
  .card p { font-size: 15px; color: var(--text-muted); line-height: 1.6; margin-bottom: 28px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 16px 24px; border-radius: 12px; font-weight: 800; font-size: 16px; text-decoration: none; border: none; cursor: pointer; transition: 0.2s; width: 100%; margin-bottom: 12px; }
  .btn-primary { background: var(--red); color: #fff; box-shadow: 0 8px 20px rgba(229,9,20,0.3); }
  .btn-primary:hover { background: var(--red-hover); transform: translateY(-2px); }
  .btn-ghost { background: #ffffff; color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--surface); }

  /* Player */
  .player-container { position: relative; width: 100%; max-width: 1100px; aspect-ratio: 16/9; background: #000; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 40px -10px rgba(0,0,0,0.2); border: 1px solid var(--border); margin-top: 60px; z-index: 1; user-select: none; }
  .player-container video { width: 100%; height: 100%; display: block; object-fit: contain; }

  /* Waiting Overlay */
  .fullscreen-overlay { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; background: #0a0a0f; transition: opacity 0.5s; }
  .fullscreen-overlay.hidden { opacity: 0; pointer-events: none; }
  .fullscreen-overlay .logos { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 24px; }
  .fullscreen-overlay .logos .plus { font-size: 24px; color: rgba(255,255,255,0.3); font-weight: 300; }
  .fullscreen-overlay h2 { font-size: 24px; font-weight: 900; color: #fff; letter-spacing: -0.5px; margin-bottom: 8px; }
  .fullscreen-overlay p { font-size: 15px; color: rgba(255,255,255,0.6); font-weight: 500; }
  .prestream-spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--red); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 24px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 768px) {
    .nav { padding: 12px 16px; }
    .logo b { font-size: 18px; }
  }
</style>
</head>
<body>

<div class="starfield"><div class="stars-1"></div></div>

<nav class="nav">
  <a href="index.html" class="logo">
    <svg viewBox="0 0 60 74" aria-hidden="true">
      <defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E50914"/><stop offset="100%" stop-color="#FF5566"/></linearGradient></defs>
      <path d="M10 60 Q 22 32 44 20" stroke="url(#sg)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M16 62 Q 26 40 46 26" stroke="url(#sg)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>
      <circle cx="46" cy="18" r="5" fill="#fff"/><circle cx="46" cy="18" r="2.5" fill="#E50914"/>
    </svg>
    <b>STAR<span>LANE</span></b>
  </a>
  <a href="index.html" class="btn-nav"><i data-lucide="arrow-left" size="16"></i> Back to Home</a>
</nav>

<div id="screen-loading" class="card">
  <div class="prestream-spinner" style="margin: 0 auto 20px;"></div>
  <h1 style="font-size:20px;">Checking access…</h1>
</div>

<!-- PAYWALL SCREEN -->
<div id="screen-paywall" class="card hidden">
  <div class="icon-box"><i data-lucide="ticket"></i></div>
  <h1>Ticket Required</h1>
  <p id="paywall-msg">You need a ticket to watch this event.</p>
  <div id="paywall-actions"></div>
</div>

<!-- VIDEO PLAYER SCREEN -->
<div id="screen-player" class="hidden" style="width:100%; display:flex; justify-content:center;">
  <div class="player-container" id="player-container">
    <video id="video" playsinline autoplay muted></video>

    <!-- WAITING / POST-STREAM OVERLAY -->
    <div class="fullscreen-overlay" id="waiting-overlay">
      <div class="prestream-spinner"></div>
      <div class="logos">
        <b style="color:#00E5E5; font-size:20px; font-weight:900;">NOVALINK</b>
        <span class="plus">×</span>
        <b style="color:#fff; font-size:20px; font-weight:900;">STAR<span style="color:var(--red)">LANE</span></b>
      </div>
      <h2 id="waiting-title">Connecting to live feed...</h2>
      <p id="waiting-sub">More than just ticketing.</p>
    </div>
  </div>
</div>

<script>
(function(){
  var firebaseConfig = {
    apiKey: "AIzaSyAxki2vcYmVeZav7N1WybofdvN3n6Aa0rk",
    authDomain: "starlane-stream.firebaseapp.com",
    projectId: "starlane-stream",
    storageBucket: "starlane-stream.firebasestorage.app",
    messagingSenderId: "115625325145",
    appId: "1:115625325145:web:b14025df503bbe2b7d7748"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();
  var auth = firebase.auth();

  var video = document.getElementById('video');
  var waitingOverlay = document.getElementById('waiting-overlay');
  
  var screens = {
    loading: document.getElementById('screen-loading'),
    paywall: document.getElementById('screen-paywall'),
    player: document.getElementById('screen-player')
  };

  function showScreen(name) {
    screens.loading.classList.add('hidden');
    screens.paywall.classList.add('hidden');
    screens.player.classList.add('hidden');
    screens[name].classList.remove('hidden');
  }

  var streamId = new URLSearchParams(window.location.search).get('id');
  if (!streamId) {
    showScreen('paywall');
    document.getElementById('paywall-msg').textContent = "This link is missing the event ID.";
    return;
  }

  // 1. Verify Access
  auth.onAuthStateChanged(function(user) {
    db.collection('streams').doc(streamId).get().then(function(doc) {
      if (!doc.exists) {
        showScreen('paywall');
        document.getElementById('paywall-msg').textContent = "Event not found.";
        return;
      }
      
      var streamData = doc.data();
      var price = streamData.ppvPrice || 0;
      
      // If Free, play immediately
      if (price === 0) {
        startPlayer();
        return;
      }

      // If Paid, check passes (simplified for this demo)
      if (user) {
        db.collection('users').doc(user.uid).collection('passes').doc(streamId).get().then(function(passDoc) {
          if (passDoc.exists) {
            startPlayer();
          } else {
            showPaywall(price);
          }
        });
      } else {
        showPaywall(price);
      }
    });
  });

  function showPaywall(price) {
    showScreen('paywall');
    document.getElementById('paywall-msg').textContent = "You need a ticket or pass to watch this event.";
    document.getElementById('paywall-actions').innerHTML = `
      <a href="checkout.html?streamId=${streamId}&price=${price}" class="btn btn-primary" style="margin-bottom: 12px;">Pay R${price} Now</a>
      <a href="https://novalink-tickets.onrender.com" class="btn btn-ghost">Buy on Novalink</a>
    `;
    if (window.lucide) lucide.createIcons();
  }

  // 2. The Multi-Cam Player Logic
  var currentVideoUrl = '';
  
  function startPlayer() {
    showScreen('player');
    
    // Poll the database every 3 seconds for new video chunks or camera changes
    setInterval(function() {
      db.collection('streams').doc(streamId).get().then(function(doc) {
        if (!doc.exists) return;
        var data = doc.data();
        
        var activeCam = data.activeCamera || 'cam1';
        var camUrl = null;
        
        // Find the URL for the active camera
        if (data.cams && data.cams[activeCam]) {
          camUrl = data.cams[activeCam];
        } else if (data.streamUrl && data.streamUrl !== 'broadcasting') {
          // Fallback for standard HLS links
          camUrl = data.streamUrl;
        }

        if (camUrl) {
          // If it's a new URL, load it
          if (camUrl !== currentVideoUrl) {
            currentVideoUrl = camUrl;
            video.src = camUrl;
            video.play().catch(function(){});
            waitingOverlay.classList.add('hidden');
          }
        } else {
          waitingOverlay.classList.remove('hidden');
          document.getElementById('waiting-title').textContent = "Waiting for camera...";
        }
      });
    }, 3000);
  }

  if (window.lucide) lucide.createIcons();
})();
</script>
</body>
</html>
