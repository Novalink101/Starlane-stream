<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#050508" />
<title>Watch · Starlane Stream</title>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root { --red: #E50914; --bg: #050508; --surface: #14141c; --text: #fff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; overflow-x: hidden; }
  .hidden { display: none !important; }
  
  /* Screens */
  .screen { width: 100%; max-width: 900px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .card { background: var(--surface); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 40px; max-width: 480px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
  
  /* Loading */
  .spinner { width: 44px; height: 44px; border: 4px solid rgba(255,255,255,.1); border-top-color: var(--red); border-radius: 50%; animation: spin .9s linear infinite; margin: 0 auto 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Paywall */
  .icon { width: 72px; height: 72px; border-radius: 50%; background: rgba(229,9,20,.12); border: 2px solid rgba(229,9,20,.3); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 32px; }
  .card h1 { font-size: 24px; margin-bottom: 10px; }
  .card p { color: rgba(255,255,255,0.6); line-height: 1.6; margin-bottom: 24px; font-size: 15px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 24px; border-radius: 12px; font-weight: 800; font-size: 15px; text-decoration: none; border: none; cursor: pointer; transition: 0.2s; width: 100%; margin-bottom: 10px; }
  .btn.primary { background: var(--red); color: #fff; box-shadow: 0 8px 20px rgba(229,9,20,0.3); }
  .btn.primary:hover { background: #ff3b4e; transform: translateY(-2px); }
  .btn.ghost { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); }
  .btn.ghost:hover { background: rgba(255,255,255,0.1); }

  /* Player */
  .player-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
  video { width: 100%; height: 100%; display: block; outline: none; }
  .welcome { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); z-index: 10; }
</style>
</head>
<body>

<!-- 1. LOADING SCREEN -->
<div id="screen-loading" class="screen">
  <div class="spinner"></div>
  <h2>Checking access…</h2>
</div>

<!-- 2. PAYWALL SCREEN -->
<div id="screen-paywall" class="screen hidden">
  <div class="card">
    <div class="icon" id="paywall-icon">🔒</div>
    <h1 id="paywall-title">Access Denied</h1>
    <p id="paywall-msg">You need a ticket or pass to watch this stream.</p>
    <div id="paywall-actions"></div>
  </div>
</div>

<!-- 3. VIDEO PLAYER -->
<div id="screen-player" class="screen hidden">
  <div class="player-wrap">
    <div class="welcome hidden" id="welcome-banner"></div>
    <video id="video" controls playsinline></video>
  </div>
</div>

<script>
(function(){
  // Firebase Config
  var firebaseConfig = {
    apiKey: "AIzaSyAxki2vcYmVeZav7N1WybofdvN3n6Aa0rk",
    authDomain: "starlane-stream.firebaseapp.com",
    projectId: "starlane-stream",
    storageBucket: "starlane-stream.firebasestorage.app",
    messagingSenderId: "115625325145",
    appId: "1:115625325145:web:b14025df503bbe2b7d7748"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();
  var auth = firebase.auth();

  // UI Elements
  var screens = {
    loading: document.getElementById('screen-loading'),
    paywall: document.getElementById('screen-paywall'),
    player: document.getElementById('screen-player')
  };

  function showScreen(name) {
    screens.loading.classList.add('hidden');
    screens.paywall.classList.add('hidden');
    screens.player.classList.add('hidden');
    screens[name].classList.remove('hidden');
  }

  function showPaywall(title, msg, buttonsHTML) {
    document.getElementById('paywall-title').textContent = title;
    document.getElementById('paywall-msg').textContent = msg;
    document.getElementById('paywall-actions').innerHTML = buttonsHTML;
    showScreen('paywall');
    if (window.lucide) lucide.createIcons();
  }

  // Parse URL (Fixes the Novalink double '?' issue)
  var search = window.location.search.replace(/\?ticketRef=/, '&ticketRef=');
  var params = new URLSearchParams(search);
  var streamId = params.get('id');
  var ticketRef = params.get('ticketRef');

  if (!streamId) {
    showScreen('loading');
    setTimeout(function(){ showPaywall('Error', 'No stream ID provided in the URL.', ''); }, 500);
    return;
  }

  // 1. Verify Novalink Ticket (If URL has a ticket)
  async function verifyNovalink(ref) {
    try {
      var res = await fetch('https://novalink-api-8vfg.onrender.com/api/verify-stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ticketRef: ref })
      });
      return await res.json();
    } catch(e) {
      return { valid: false, error: 'Could not connect to Novalink servers.' };
    }
  }

  // 2. Fetch Stream Data & Play
  async function loadAndPlay(guestName) {
    try {
      var doc = await db.collection('streams').doc(streamId).get();
      if (!doc.exists) return showPaywall('Error', 'This stream does not exist.', '');

      var data = doc.data();
      var videoUrl = data.streamUrl || (data.segments && data.segments[0] ? data.segments[0].url : '');

      if (!videoUrl) return showPaywall('Error', 'No video URL configured for this stream.', '');

      // Show Player
      showScreen('player');
      var video = document.getElementById('video');
      
      if (guestName) {
        var banner = document.getElementById('welcome-banner');
        banner.textContent = 'Welcome, ' + guestName;
        banner.classList.remove('hidden');
        setTimeout(function(){ banner.classList.add('hidden'); }, 5000);
      }

      // Load Video (HLS or MP4)
      if (videoUrl.includes('.m3u8') && Hls.isSupported()) {
        var hls = new Hls();
        hls.loadSource(videoUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
      } else {
        video.src = videoUrl;
        video.play();
      }

    } catch(err) {
      showPaywall('Error', err.message, '');
    }
  }

  // BOOT SEQUENCE
  document.addEventListener('DOMContentLoaded', function() {
    if (window.lucide) lucide.createIcons();
    
    // A. If they have a Novalink ticket
    if (ticketRef) {
      verifyNovalink(ticketRef).then(function(res) {
        if (res.valid) {
          loadAndPlay(res.guestName);
        } else {
          showPaywall('Ticket Invalid', res.error || 'This ticket is not valid.', 
            '<a href="https://novalink-tickets.onrender.com" class="btn primary">Buy on Novalink</a>'
          );
        }
      });
      return;
    }

    // B. If no ticket, check Starlane PPV logic
    auth.onAuthStateChanged(function(user) {
      db.collection('streams').doc(streamId).get().then(function(doc) {
        if (!doc.exists) return showPaywall('Error', 'Stream not found.', '');
        
        var data = doc.data();
        
        if (data.requiresTicket) {
          var price = data.ppvPrice || 150;
          
          if (!user) {
            showPaywall('Login Required', 'Please sign in to purchase this Pay-Per-View stream.', 
              '<a href="auth.html?redirect=' + encodeURIComponent(location.href) + '" class="btn primary">Sign In</a>'
            );
            return;
          }

          // Check if they already bought the pass
          db.collection('users').doc(user.uid).collection('passes').doc(streamId).get().then(function(passDoc) {
            if (passDoc.exists) {
              loadAndPlay('PPV Pass Holder');
            } else {
              showPaywall('Pay-Per-View', 'You do not have a Novalink ticket. Pay a discounted rate to watch.', 
                '<a href="checkout-starlane.html?streamId=' + streamId + '&price=' + price + '" class="btn primary">Pay R' + price + ' (65%)</a>' +
                '<a href="https://novalink-tickets.onrender.com" class="btn ghost" target="_blank">Buy Full Ticket on Novalink</a>'
              );
            }
          });
        } else {
          // Free stream
          loadAndPlay(null);
        }
      });
    });
  });
})();
</script>
</body>
</html>
