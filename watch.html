<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="color-scheme" content="light" />
<title>Watch Event · Starlane Stream</title>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root { 
    --red: #E50914; 
    --bg: #ffffff; 
    --surface: #f9fafb; 
    --text: #111827; 
    --text-muted: #6b7280; 
    --border: #e5e7eb;
    --success: #10B981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background: var(--bg); color: var(--text); 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    display: flex; flex-direction: column; align-items: center; justify-content: center; 
    min-height: 100vh; padding: 24px; position: relative; text-align: center; overflow-x: hidden; 
  }
  a { text-decoration: none; color: inherit; }
  .hidden { display: none !important; }

  /* Starfield */
  .starfield { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: #ffffff; overflow: hidden; }
  .stars-1 { position: absolute; inset: -50%; background-image: radial-gradient(1.5px 1.5px at 10% 20%, rgba(229,9,20,.15), transparent 100%); background-size: 200px 200px; animation: drift 40s linear infinite; }
  @keyframes drift { 0% { transform: translateY(0) translateX(0); } 100% { transform: translateY(-200px) translateX(-100px); } }

  /* Navbar */
  .nav { position: absolute; top: 0; left: 0; right: 0; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; z-index: 50; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo svg { width: 28px; height: 34px; }
  .logo b { font-weight: 900; font-size: 20px; color: #111827; }
  .logo b span { color: var(--red); }
  .btn-nav { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--text-muted); }
  
  /* Cards */
  .card { background: #fff; border: 1px solid var(--border); border-radius: 24px; padding: 48px 40px; max-width: 480px; margin: 0 auto; box-shadow: 0 20px 40px -10px rgba(0,0,0,.08); z-index: 1; margin-top: 60px; }
  .icon-box { width: 72px; height: 72px; background: #fee2e2; color: var(--red); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 32px; }
  .card h1 { font-size: 26px; font-weight: 900; margin-bottom: 12px; }
  .card p { font-size: 15px; color: var(--text-muted); margin-bottom: 28px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 16px 24px; border-radius: 12px; font-weight: 800; font-size: 16px; border: none; cursor: pointer; width: 100%; margin-bottom: 12px; }
  .btn-primary { background: var(--red); color: #fff; }
  .btn-ghost { background: #fff; color: var(--text); border: 1px solid var(--border); }

  /* Player Container */
  .player-wrap { 
    position: relative; width: 100%; max-width: 1200px; aspect-ratio: 16/9; 
    background: #000; border-radius: 20px; overflow: hidden; margin-top: 60px; z-index: 1; 
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); group;
  }
  .video-container { width: 100%; height: 100%; position: relative; }
  .video-container video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  
  /* Split Views */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; width: 100%; height: 100%; background: #000; }
  .grid-4 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 4px; width: 100%; height: 100%; background: #000; }
  .grid-2 video, .grid-4 video { position: relative; width: 100%; height: 100%; object-fit: cover; }

  /* Ads Overlay */
  .ad-container { position: absolute; inset: 0; z-index: 45; background: #000; display: flex; flex-direction: column; }
  .ad-media { flex: 1; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .ad-topbar { position: absolute; top: 0; left: 0; right: 0; padding: 16px; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); z-index: 46; display: flex; justify-content: space-between; align-items: flex-start; }
  .ad-label { background: #F59E0B; color: #000; font-size: 10px; font-weight: 900; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; }

  /* Buffering Overlay */
  .waiting { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0a0f; }
  .waiting h2 { font-size: 24px; font-weight: 900; color: #fff; margin-bottom: 8px; }
  .waiting p { font-size: 14px; color: rgba(255,255,255,0.6); margin-top: 8px; }
  .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--red); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 24px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  /* Custom Controls Bar */
  .controls-overlay {
    position: absolute; bottom: 0; left: 0; right: 0; padding: 20px;
    background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
    display: flex; align-items: center; gap: 16px; z-index: 30;
    opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
  }
  .player-wrap:hover .controls-overlay, .controls-overlay.active { opacity: 1; pointer-events: auto; }
  
  .ctrl-btn { background: none; border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; opacity: 0.8; }
  .ctrl-btn:hover { opacity: 1; transform: scale(1.1); color: var(--red); }
  
  .live-badge { display: flex; align-items: center; gap: 6px; background: rgba(229,9,20,0.2); color: var(--red); padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 900; margin-left: auto; border: 1px solid rgba(229,9,20,0.4); text-transform: uppercase; letter-spacing: 1px; }
  .live-dot { width: 6px; height: 6px; background: var(--red); border-radius: 50%; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
</style>
</head>
<body>

<div class="starfield"><div class="stars-1"></div></div>

<nav class="nav">
  <a href="index.html" class="logo">
    <svg viewBox="0 0 60 74"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E50914"/><stop offset="100%" stop-color="#FF5566"/></linearGradient></defs><path d="M10 60 Q 22 32 44 20" stroke="url(#sg)" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="46" cy="18" r="5" fill="#fff"/><circle cx="46" cy="18" r="2.5" fill="#E50914"/></svg>
    <b>STAR<span>LANE</span></b>
  </a>
  <a href="index.html" class="btn-nav"><i data-lucide="arrow-left" size="16"></i> Back to Home</a>
</nav>

<!-- SCREEN: LOADING -->
<div id="screen-loading" class="card">
  <div class="spinner" style="margin:0 auto 20px; border-top-color:var(--red);"></div>
  <h1 style="font-size:20px;">Checking access…</h1>
</div>

<!-- SCREEN: PAYWALL -->
<div id="screen-paywall" class="card hidden">
  <div class="icon-box"><i data-lucide="ticket"></i></div>
  <h1 id="paywall-title">Ticket Required</h1>
  <p id="paywall-msg">You need a ticket to watch this event.</p>
  <div id="paywall-actions"></div>
</div>

<!-- SCREEN: PLAYER -->
<div id="screen-player" class="hidden" style="width:100%; display:flex; justify-content:center;">
  <div class="player-wrap" id="player-wrap">
    
    <!-- SINGLE VIEW (Double Buffer) -->
    <div id="view-single" class="video-container">
      <video id="video-single-a" playsinline autoplay muted preload="auto"></video>
      <video id="video-single-b" playsinline autoplay muted preload="auto" style="display:none;"></video>
    </div>

    <!-- SPLIT VIEWS -->
    <div id="view-2way" class="grid-2 hidden">
      <video id="video-cam1-2" playsinline autoplay muted preload="auto"></video>
      <video id="video-cam2-2" playsinline autoplay muted preload="auto"></video>
    </div>

    <div id="view-4way" class="grid-4 hidden">
      <video id="video-cam1-4" playsinline autoplay muted preload="auto"></video>
      <video id="video-cam2-4" playsinline autoplay muted preload="auto"></video>
      <video id="video-cam3-4" playsinline autoplay muted preload="auto"></video>
      <video id="video-cam4-4" playsinline autoplay muted preload="auto"></video>
    </div>

    <!-- ADS OVERLAY -->
    <div class="ad-container hidden" id="ad-overlay">
      <div class="ad-topbar"><div class="ad-label">Sponsored</div></div>
      <div id="ad-media-container" style="flex:1; display:flex; align-items:center; justify-content:center;"></div>
    </div>

    <!-- BUFFERING OVERLAY -->
    <div class="waiting" id="waiting-overlay">
      <div class="spinner"></div>
      <h2 id="waiting-title">Buffering live feed...</h2>
      <p id="waiting-sub">Gathering 40 seconds of video to ensure smooth playback.</p>
    </div>

    <!-- UNMUTE BUTTON -->
    <button class="btn" id="unmute-btn" style="position:absolute; top:20px; right:20px; z-index:50; width:auto; padding:10px 20px; background:rgba(0,0,0,0.8); color:#fff; border:1px solid rgba(255,255,255,0.2); border-radius:8px; font-size:13px; backdrop-filter:blur(4px); display:none;">
      <i data-lucide="volume-x" size="16"></i> Tap to Unmute
    </button>

    <!-- CUSTOM CONTROLS -->
    <div class="controls-overlay" id="controls-bar">
      <button class="ctrl-btn" id="play-pause-btn"><i data-lucide="play" size="24"></i></button>
      <button class="ctrl-btn" id="mute-btn"><i data-lucide="volume-2" size="24"></i></button>
      
      <div class="live-badge" id="live-badge" style="display:none;">
        <div class="live-dot"></div> Live
      </div>

      <button class="ctrl-btn" id="fullscreen-btn" style="margin-left: 16px;"><i data-lucide="maximize" size="24"></i></button>
    </div>

  </div>
</div>

<script>
(function(){
  var firebaseConfig = { apiKey:"AIzaSyAxki2vcYmVeZav7N1WybofdvN3n6Aa0rk", authDomain:"starlane-stream.firebaseapp.com", projectId:"starlane-stream", storageBucket:"starlane-stream.firebasestorage.app", messagingSenderId:"115625325145", appId:"1:115625325145:web:b14025df503bbe2b7d7748" };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();
  var auth = firebase.auth();

  var ADMIN_EMAILS = ['nylnathan340@gmail.com','customerservicesnovalink@gmail.com'];
  var streamId = new URLSearchParams(location.search).get('id');
  if (!streamId) return;

  var screens = { 
    loading: document.getElementById('screen-loading'), 
    paywall: document.getElementById('screen-paywall'), 
    player: document.getElementById('screen-player') 
  };
  var views = { 
    single: document.getElementById('view-single'), 
    way2: document.getElementById('view-2way'), 
    way4: document.getElementById('view-4way') 
  };

  function showScreen(name) {
    Object.values(screens).forEach(s => s.classList.add('hidden'));
    screens[name].classList.remove('hidden');
  }

  // ═══════════════════════════════════════════════════════════
  // 1. ACCESS GATE
  // ═══════════════════════════════════════════════════════════
  auth.onAuthStateChanged(function(user) {
    db.collection('streams').doc(streamId).get().then(function(doc) {
      if (!doc.exists) return showPaywall('Event not found.');
      var s = doc.data();

      // Admin Bypass (for testing)
      if (user && ADMIN_EMAILS.includes(user.email.toLowerCase())) return startPlayer();
      
      // Free event
      if (!s.ppvPrice || s.ppvPrice === 0) return startPlayer();
      
      // Paid event
      if (!user) return showPaywall(s.ppvPrice);
      
      db.collection('users').doc(user.uid).collection('passes').doc(streamId).get().then(function(p) {
        if (p.exists) startPlayer(); else showPaywall(s.ppvPrice);
      });
    });
  });

  function showPaywall(priceOrMsg) {
    showScreen('paywall');
    if (typeof priceOrMsg === 'string') {
      document.getElementById('paywall-msg').textContent = priceOrMsg;
    } else {
      var price = priceOrMsg;
      document.getElementById('paywall-msg').textContent = 'Unlock this stream for R' + price + '.';
      document.getElementById('paywall-actions').innerHTML = 
        '<a href="checkout.html?streamId=' + streamId + '&price=' + price + '" class="btn btn-primary">Pay R' + price + ' Now</a>' +
        '<a href="https://novalink-tickets.onrender.com" class="btn btn-ghost">Buy on Novalink</a>';
    }
    if (window.lucide) lucide.createIcons();
  }

  // ═══════════════════════════════════════════════════════════
  // 2. 40-SECOND BUFFER PLAYER (THE FIX)
  // ═══════════════════════════════════════════════════════════
  var currentActiveCam = null;
  var pendingChunks = [];
  var isQueuePlaying = false;
  var activeVidElement = null;
  var inactiveVidElement = null;
  var nextTimeout = null;
  
  var isPaused = false;
  var isMuted = true;

  function playNextFromQueue() {
    if (isPaused) {
      nextTimeout = setTimeout(playNextFromQueue, 500); // Check again in 500ms
      return;
    }

    // If we run out of chunks, show buffering
    if (pendingChunks.length === 0) {
      isQueuePlaying = false;
      document.getElementById('waiting-overlay').classList.remove('hidden');
      document.getElementById('waiting-title').textContent = "Buffering next segment...";
      document.getElementById('waiting-sub').textContent = "Waiting for the camera to send more video.";
      document.getElementById('live-badge').style.display = 'none';
      return;
    }

    var url = pendingChunks.shift();
    
    // Hide overlays
    document.getElementById('waiting-overlay').classList.add('hidden');
    document.getElementById('live-badge').style.display = 'flex';

    inactiveVidElement.src = url;
    inactiveVidElement.load();
    
    inactiveVidElement.play().then(function() {
      inactiveVidElement.style.display = 'block';
      activeVidElement.style.display = 'none';
      activeVidElement.pause();
      
      // Swap elements
      var temp = activeVidElement;
      activeVidElement = inactiveVidElement;
      inactiveVidElement = temp;
      
      if (!isMuted) activeVidElement.muted = false;
      else activeVidElement.muted = true;

      // Play the next chunk when this one ends
      activeVidElement.onended = function() {
        clearTimeout(nextTimeout);
        playNextFromQueue();
      };
      
      // Fallback for WebM chunks that might not fire 'onended' correctly
      clearTimeout(nextTimeout);
      nextTimeout = setTimeout(function() {
        playNextFromQueue();
      }, 1950); 

    }).catch(function(err) {
      console.log("Skipping chunk due to error:", err);
      playNextFromQueue();
    });
  }

  // ═══════════════════════════════════════════════════════════
  // 3. PLAYER & FIREBASE SYNC
  // ═══════════════════════════════════════════════════════════
  function startPlayer() {
    showScreen('player');
    
    activeVidElement = document.getElementById('video-single-a');
    inactiveVidElement = document.getElementById('video-single-b');

    // Setup Controls
    document.getElementById('play-pause-btn').addEventListener('click', function() {
      isPaused = !isPaused;
      this.innerHTML = isPaused ? '<i data-lucide="play" size="24"></i>' : '<i data-lucide="pause" size="24"></i>';
      if (window.lucide) lucide.createIcons();
      if (isPaused) {
        activeVidElement.pause();
      } else {
        activeVidElement.play();
      }
    });

    document.getElementById('mute-btn').addEventListener('click', function() {
      isMuted = !isMuted;
      activeVidElement.muted = isMuted;
      inactiveVidElement.muted = isMuted;
      document.getElementById('unmute-btn').style.display = 'none';
      this.innerHTML = isMuted ? '<i data-lucide="volume-x" size="24"></i>' : '<i data-lucide="volume-2" size="24"></i>';
      if (window.lucide) lucide.createIcons();
    });

    document.getElementById('fullscreen-btn').addEventListener('click', function() {
      var wrap = document.getElementById('player-wrap');
      if (!document.fullscreenElement) {
        wrap.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    });

    document.getElementById('unmute-btn').addEventListener('click', function() {
      isMuted = false;
      activeVidElement.muted = false;
      inactiveVidElement.muted = false;
      this.style.display = 'none';
      document.getElementById('mute-btn').innerHTML = '<i data-lucide="volume-2" size="24"></i>';
      if (window.lucide) lucide.createIcons();
    });

    // Listen to Firebase
    db.collection('streams').doc(streamId).onSnapshot(function(doc) {
      if (!doc.exists) return;
      var data = doc.data();

      // Handle Ads
      if (data.forceAds === true) {
        document.getElementById('ad-overlay').classList.remove('hidden');
        return;
      } else {
        document.getElementById('ad-overlay').classList.add('hidden');
      }

      var activeCam = data.activeCamera || 'cam1';
      var camHistory = data.camHistory || {};
      
      // Handle Camera Switch
      if (currentActiveCam !== activeCam) {
        currentActiveCam = activeCam;
        pendingChunks = [];
        isQueuePlaying = false;
        clearTimeout(nextTimeout);
        
        activeVidElement.pause(); inactiveVidElement.pause();
        activeVidElement.src = ""; inactiveVidElement.src = "";
        
        Object.values(views).forEach(v => v.classList.add('hidden'));

        if (activeCam === 'split4' || activeCam === 'split2') {
           document.getElementById(activeCam === 'split4' ? 'view-4way' : 'view-2way').classList.remove('hidden');
           document.getElementById('waiting-overlay').classList.add('hidden');
           var cams = data.cams || {};
           if (activeCam === 'split4') {
             document.getElementById('video-cam1-4').src = cams.cam1 || ''; document.getElementById('video-cam1-4').play();
             document.getElementById('video-cam2-4').src = cams.cam2 || ''; document.getElementById('video-cam2-4').play();
             document.getElementById('video-cam3-4').src = cams.cam3 || ''; document.getElementById('video-cam3-4').play();
             document.getElementById('video-cam4-4').src = cams.cam4 || ''; document.getElementById('video-cam4-4').play();
           } else {
             document.getElementById('video-cam1-2').src = cams.cam1 || ''; document.getElementById('video-cam1-2').play();
             document.getElementById('video-cam2-2').src = cams.cam2 || ''; document.getElementById('video-cam2-2').play();
           }
           return;
        }
        
        views.single.classList.remove('hidden');
      }

      // Handle Single View 40-Second Buffer Logic
      if (currentActiveCam !== 'split4' && currentActiveCam !== 'split2') {
        var history = camHistory[currentActiveCam] || [];
        
        // Find new chunks
        history.forEach(function(chunk) {
          if (!pendingChunks.includes(chunk.url) && chunk.url !== activeVidElement.src && chunk.url !== inactiveVidElement.src) {
            pendingChunks.push(chunk.url);
          }
        });

        // IF WE HAVE 20 CHUNKS (40 seconds) AND NOT PLAYING, START!
        if (!isQueuePlaying && pendingChunks.length >= 20) {
          isQueuePlaying = true;
          document.getElementById('waiting-overlay').classList.add('hidden');
          playNextFromQueue();
        } else if (!isQueuePlaying && pendingChunks.length > 0) {
          // Show buffering progress
          document.getElementById('waiting-overlay').classList.remove('hidden');
          document.getElementById('waiting-title').textContent = "Building live buffer...";
          document.getElementById('waiting-sub').textContent = "Buffering 40 seconds of video... (" + pendingChunks.length + "/20)";
        }
      }
    });
  }

  if (window.lucide) lucide.createIcons();
})();
</script>
</body>
  </html>
