<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="color-scheme" content="light" />
<title>Watch Event · Starlane Stream</title>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<!-- Google Cast SDK -->
<script type="text/javascript" src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
<style>
  :root { --red: #E50914; --red-hover: #FF3B4E; --bg: #ffffff; --surface: #f9fafb; --text: #111827; --text-muted: #6b7280; --border: #e5e7eb; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; position: relative; text-align: center; overflow-x: hidden; }
  a { text-decoration: none; color: inherit; }
  .hidden { display: none !important; }

  .starfield { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: #ffffff; overflow: hidden; }
  .stars-1 { position: absolute; inset: -50%; background-image: radial-gradient(1.5px 1.5px at 10% 20%, rgba(229,9,20,.15), transparent 100%); background-size: 200px 200px; animation: drift 40s linear infinite; }
  @keyframes drift { 0% { transform: translateY(0) translateX(0); } 100% { transform: translateY(-200px) translateX(-100px); } }

  .nav { position: absolute; top: 0; left: 0; right: 0; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; z-index: 50; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo svg { width: 28px; height: 34px; }
  .logo b { font-weight: 900; font-size: 20px; color: #111827; }
  .logo b span { color: var(--red); }
  .btn-nav { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--text-muted); }
  .btn-nav:hover { color: var(--text); }

  .card { background: #ffffff; border: 1px solid var(--border); border-radius: 24px; padding: 48px 40px; max-width: 480px; margin: 0 auto; box-shadow: 0 20px 40px -10px rgba(0,0,0,0.08); z-index: 1; margin-top: 60px; }
  .icon-box { width: 72px; height: 72px; background: #fee2e2; color: var(--red); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 32px; }
  .card h1 { font-size: 26px; font-weight: 900; margin-bottom: 12px; }
  .card p { font-size: 15px; color: var(--text-muted); margin-bottom: 28px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 16px 24px; border-radius: 12px; font-weight: 800; font-size: 16px; text-decoration: none; border: none; cursor: pointer; transition: 0.2s; width: 100%; margin-bottom: 12px; }
  .btn-primary { background: var(--red); color: #fff; }
  .btn-ghost { background: #ffffff; color: var(--text); border: 1px solid var(--border); }

  .player-container { position: relative; width: 100%; max-width: 1200px; aspect-ratio: 16/9; background: #000; border-radius: 20px; overflow: hidden; margin-top: 60px; z-index: 1; user-select: none; }
  
  .player-watermark { position: absolute; top: 20px; left: 20px; z-index: 25; display: flex; align-items: center; gap: 8px; opacity: 0.85; transition: opacity 0.3s; pointer-events: none; }
  .player-watermark svg { width: 24px; height: 30px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
  .player-watermark b { font-weight: 900; font-size: 16px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
  .player-watermark b span { color: var(--red); }

  .player-container.inactive { cursor: none; }
  .player-container.inactive .controls-overlay, .player-container.inactive .player-watermark { opacity: 0; pointer-events: none; }
  
  .controls-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 40%, transparent 100%); transition: opacity 0.3s ease; z-index: 10; }
  
  .cam-grid { display: grid; width: 100%; height: 100%; gap: 4px; background: #000; }
  .grid-2 { grid-template-columns: 1fr 1fr; }
  .grid-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .cam-box { position: relative; width: 100%; height: 100%; background: #0a0a0f; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .cam-box video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  
  .cam-offline { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2; background: #0a0a0f; }
  .cam-offline svg { width: 40px; height: 48px; opacity: 0.5; margin-bottom: 8px; }
  .cam-offline p { font-size: 12px; font-weight: 800; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; }

  .timeline-container { position: absolute; bottom: 70px; left: 24px; right: 24px; height: 20px; display: flex; align-items: center; cursor: pointer; z-index: 20; }
  .timeline-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.3); border-radius: 4px; position: relative; transition: height 0.1s; }
  .timeline-container:hover .timeline-bg { height: 8px; }
  .timeline-progress { position: absolute; top: 0; left: 0; height: 100%; background: var(--red); border-radius: 4px; pointer-events: none; }

  .bottom-bar { display: flex; align-items: center; justify-content: space-between; padding: 0 24px 20px 24px; color: white; z-index: 20; }
  .left-controls, .right-controls { display: flex; align-items: center; gap: 16px; }
  .ctrl-btn { background: none; border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.1s; padding: 4px; }
  .ctrl-btn:hover { transform: scale(1.1); }
  .ctrl-btn svg { width: 22px; height: 22px; fill: white; }
  
  .volume-container { display: flex; align-items: center; gap: 8px; }
  .volume-slider { width: 0; overflow: hidden; transition: width 0.2s; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; cursor: pointer; position: relative; }
  .volume-container:hover .volume-slider { width: 60px; }
  .volume-slider-fill { height: 100%; background: white; border-radius: 2px; width: 100%; }

  .time-display { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  
  .fullscreen-overlay { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0a0f; }
  .fullscreen-overlay.hidden { display: none; }
  .fullscreen-overlay .logos { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 24px; }
  .fullscreen-overlay .logos .plus { font-size: 24px; color: rgba(255,255,255,0.3); }
  .fullscreen-overlay h2 { font-size: 24px; font-weight: 900; color: #fff; margin-bottom: 8px; }
  .fullscreen-overlay p { font-size: 15px; color: rgba(255,255,255,0.6); }
  .prestream-spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--red); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 24px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Google Cast Button Default Styling */
  google-cast-launcher {
    width: 24px;
    height: 24px;
    cursor: pointer;
    --connected-color: #E50914;
    --disconnected-color: #FFFFFF;
  }

  @media (max-width: 768px) {
    .bottom-bar { padding: 0 12px 12px 12px; gap: 8px; }
    .left-controls, .right-controls { gap: 12px; }
    .time-display { font-size: 11px; }
    .volume-container { display: none; }
  }
</style>
</head>
<body>

<div class="starfield"><div class="stars-1"></div></div>

<nav class="nav">
  <a href="index.html" class="logo">
    <svg viewBox="0 0 60 74"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E50914"/><stop offset="100%" stop-color="#FF5566"/></linearGradient></defs><path d="M10 60 Q 22 32 44 20" stroke="url(#sg)" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="46" cy="18" r="5" fill="#fff"/><circle cx="46" cy="18" r="2.5" fill="#E50914"/></svg>
    <b>STAR<span>LANE</span></b>
  </a>
  <a href="index.html" class="btn-nav"><i data-lucide="arrow-left" size="16"></i> Back to Home</a>
</nav>

<div id="screen-loading" class="card">
  <div class="prestream-spinner" style="margin: 0 auto 20px;"></div>
  <h1 style="font-size:20px;">Checking access…</h1>
</div>

<div id="screen-paywall" class="card hidden">
  <div class="icon-box"><i data-lucide="ticket"></i></div>
  <h1>Ticket Required</h1>
  <p id="paywall-msg">You need a ticket to watch this event.</p>
  <div id="paywall-actions"></div>
</div>

<div id="screen-player" class="hidden" style="width:100%; display:flex; justify-content:center;">
  <div class="player-container" id="player-container">
    
    <div class="player-watermark">
      <svg viewBox="0 0 60 74"><path d="M10 60 Q 22 32 44 20" stroke="#E50914" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="46" cy="18" r="5" fill="#fff"/></svg>
      <b>STAR<span>LANE</span></b>
    </div>

    <div id="view-single" class="cam-box">
      <video id="video-single" playsinline autoplay muted preload="auto"></video>
      <div class="cam-offline" id="offline-single">
        <svg viewBox="0 0 60 74"><path d="M10 60 Q 22 32 44 20" stroke="#E50914" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="46" cy="18" r="5" fill="#fff"/></svg>
        <p>Camera Offline</p>
      </div>
    </div>

    <div id="view-2way" class="cam-grid grid-2 hidden">
      <div class="cam-box">
        <video id="video-cam1-2" playsinline autoplay muted preload="auto"></video>
        <div class="cam-offline" id="offline-cam1-2"><svg viewBox="0 0 60 74"><path d="M10 60 Q 22 32 44 20" stroke="#E50914" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="46" cy="18" r="5" fill="#fff"/></svg><p>CAM 1</p></div>
      </div>
      <div class="cam-box">
        <video id="video-cam2-2" playsinline autoplay muted preload="auto"></video>
        <div class="cam-offline" id="offline-cam2-2"><svg viewBox="0 0 60 74"><path d="M10 60 Q 22 32 44 20" stroke="#E50914" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="46" cy="18" r="5" fill="#fff"/></svg><p>CAM 2</p></div>
      </div>
    </div>

    <div id="view-4way" class="cam-grid grid-4 hidden">
      <div class="cam-box">
        <video id="video-cam1-4" playsinline autoplay muted preload="auto"></video>
        <div class="cam-offline" id="offline-cam1-4"><svg viewBox="0 0 60 74"><path d="M10 60 Q 22 32 44 20" stroke="#E50914" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="46" cy="18" r="5" fill="#fff"/></svg><p>CAM 1</p></div>
      </div>
      <div class="cam-box">
        <video id="video-cam2-4" playsinline autoplay muted preload="auto"></video>
        <div class="cam-offline" id="offline-cam2-4"><svg viewBox="0 0 60 74"><path d="M10 60 Q 22 32 44 20" stroke="#E50914" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="46" cy="18" r="5" fill="#fff"/></svg><p>CAM 2</p></div>
      </div>
      <div class="cam-box">
        <video id="video-cam3-4" playsinline autoplay muted preload="auto"></video>
        <div class="cam-offline" id="offline-cam3-4"><svg viewBox="0 0 60 74"><path d="M10 60 Q 22 32 44 20" stroke="#E50914" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="46" cy="18" r="5" fill="#fff"/></svg><p>CAM 3</p></div>
      </div>
      <div class="cam-box">
        <video id="video-cam4-4" playsinline autoplay muted preload="auto"></video>
        <div class="cam-offline" id="offline-cam4-4"><svg viewBox="0 0 60 74"><path d="M10 60 Q 22 32 44 20" stroke="#E50914" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="46" cy="18" r="5" fill="#fff"/></svg><p>CAM 4</p></div>
      </div>
    </div>

    <div class="controls-overlay" id="controls-overlay">
      <div class="timeline-container" id="timeline-container">
        <div class="timeline-bg">
          <div class="timeline-progress" id="timeline-progress"></div>
        </div>
      </div>

      <div class="bottom-bar">
        <div class="left-controls">
          <button class="ctrl-btn" id="btn-play"><i data-lucide="pause"></i></button>
          
          <div class="volume-container">
            <button class="ctrl-btn" id="btn-mute"><i data-lucide="volume-2"></i></button>
            <div class="volume-slider" id="volume-slider">
              <div class="volume-slider-fill" id="volume-fill"></div>
            </div>
          </div>

          <span class="time-display" id="time-display">LIVE</span>
        </div>

        <div class="right-controls">
          <!-- GOOGLE CAST BUTTON -->
          <google-cast-launcher id="castButton"></google-cast-launcher>
          
          <button class="ctrl-btn" id="btn-fullscreen"><i data-lucide="maximize"></i></button>
        </div>
      </div>
    </div>

    <div class="fullscreen-overlay" id="waiting-overlay">
      <div class="prestream-spinner"></div>
      <div class="logos">
        <b style="color:#00E5E5; font-size:20px; font-weight:900;">NOVALINK</b>
        <span class="plus">×</span>
        <b style="color:#fff; font-size:20px; font-weight:900;">STAR<span style="color:var(--red)">LANE</span></b>
      </div>
      <h2 id="waiting-title">Connecting to live feed...</h2>
      <p id="waiting-sub">More than just ticketing.</p>
    </div>
  </div>
</div>

<script>
(function(){
  // ── GOOGLE CAST INITIALIZATION ──
  window['__onGCastApiAvailable'] = function(isAvailable) {
    if (isAvailable) {
      initializeCastApi();
    }
  };

  function initializeCastApi() {
    cast.framework.CastContext.getInstance().setOptions({
      receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
      autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
    });
  }

  var firebaseConfig = {
    apiKey: "AIzaSyAxki2vcYmVeZav7N1WybofdvN3n6Aa0rk",
    authDomain: "starlane-stream.firebaseapp.com",
    projectId: "starlane-stream",
    storageBucket: "starlane-stream.firebasestorage.app",
    messagingSenderId: "115625325145",
    appId: "1:115625325145:web:b14025df503bbe2b7d7748"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();
  var auth = firebase.auth();

  var playerContainer = document.getElementById('player-container');
  var controlsOverlay = document.getElementById('controls-overlay');
  var waitingOverlay = document.getElementById('waiting-overlay');
  var activeVideo = document.getElementById('video-single');
  var views = {
    single: document.getElementById('view-single'),
    way2: document.getElementById('view-2way'),
    way4: document.getElementById('view-4way')
  };
  
  var screens = {
    loading: document.getElementById('screen-loading'),
    paywall: document.getElementById('screen-paywall'),
    player: document.getElementById('screen-player')
  };

  function showScreen(name) {
    screens.loading.classList.add('hidden');
    screens.paywall.classList.add('hidden');
    screens.player.classList.add('hidden');
    screens[name].classList.remove('hidden');
  }

  var streamId = new URLSearchParams(window.location.search).get('id');
  if (!streamId) return showPaywall("Missing ID");

  auth.onAuthStateChanged(function(user) {
    db.collection('streams').doc(streamId).get().then(function(doc) {
      if (!doc.exists) return showPaywall("Event not found.");
      var streamData = doc.data();
      if (streamData.ppvPrice === 0) return startPlayer();
      if (user) {
        db.collection('users').doc(user.uid).collection('passes').doc(streamId).get().then(function(p) {
          if (p.exists) startPlayer(); else showPaywall(streamData.ppvPrice);
        });
      } else showPaywall(streamData.ppvPrice);
    });
  });

  function showPaywall(price) {
    showScreen('paywall');
    document.getElementById('paywall-actions').innerHTML = `
      <a href="checkout.html?streamId=${streamId}&price=${price}" class="btn btn-primary">Pay R${price} Now</a>
      <a href="https://novalink-tickets.onrender.com" class="btn btn-ghost">Buy on Novalink</a>
    `;
    if (window.lucide) lucide.createIcons();
  }

  function updateCamBox(videoId, offlineId, url) {
    var vid = document.getElementById(videoId);
    var offline = document.getElementById(offlineId);
    if (url && url !== 'broadcasting') {
      offline.classList.add('hidden');
      if (vid.src !== url) {
        vid.src = url;
        vid.play().catch(()=>{});
      }
    } else {
      offline.classList.remove('hidden');
      vid.src = '';
    }
  }

  function startPlayer() {
    showScreen('player');
    
    setInterval(function() {
      db.collection('streams').doc(streamId).get().then(function(doc) {
        if (!doc.exists) return;
        var data = doc.data();
        var cams = data.cams || {};
        var activeCam = data.activeCamera || 'cam1';

        Object.values(views).forEach(v => v.classList.add('hidden'));
        activeVideo = document.getElementById('video-cam1-4'); 

        if (activeCam === 'split4') {
          views.way4.classList.remove('hidden');
          updateCamBox('video-cam1-4', 'offline-cam1-4', cams.cam1);
          updateCamBox('video-cam2-4', 'offline-cam2-4', cams.cam2);
          updateCamBox('video-cam3-4', 'offline-cam3-4', cams.cam3);
          updateCamBox('video-cam4-4', 'offline-cam4-4', cams.cam4);
          activeVideo = document.getElementById('video-cam1-4');
        } else if (activeCam === 'split2') {
          views.way2.classList.remove('hidden');
          updateCamBox('video-cam1-2', 'offline-cam1-2', cams.cam1);
          updateCamBox('video-cam2-2', 'offline-cam2-2', cams.cam2);
          activeVideo = document.getElementById('video-cam1-2');
        } else {
          views.single.classList.remove('hidden');
          var camUrl = cams[activeCam];
          updateCamBox('video-single', 'offline-single', camUrl);
          activeVideo = document.getElementById('video-single');
        }
        
        waitingOverlay.classList.add('hidden');
      });
    }, 2500);
  }

  // PLAYER CONTROLS LOGIC
  var btnPlay = document.getElementById('btn-play');
  var btnMute = document.getElementById('btn-mute');
  var btnFullscreen = document.getElementById('btn-fullscreen');
  var volumeSlider = document.getElementById('volume-slider');
  var volumeFill = document.getElementById('volume-fill');
  var timeDisplay = document.getElementById('time-display');
  var hideControlsTimeout;

  function showControls() {
    playerContainer.classList.remove('inactive');
    clearTimeout(hideControlsTimeout);
    hideControlsTimeout = setTimeout(function() {
      playerContainer.classList.add('inactive');
    }, 3000);
  }

  playerContainer.addEventListener('mousemove', showControls);
  playerContainer.addEventListener('touchstart', showControls);

  btnPlay.addEventListener('click', function() {
    if (activeVideo.paused) {
      activeVideo.play();
      btnPlay.innerHTML = '<i data-lucide="pause"></i>';
    } else {
      activeVideo.pause();
      btnPlay.innerHTML = '<i data-lucide="play"></i>';
    }
    if (window.lucide) lucide.createIcons();
  });

  btnMute.addEventListener('click', function() {
    activeVideo.muted = !activeVideo.muted;
    updateVolume();
  });

  volumeSlider.addEventListener('click', function(e) {
    var rect = volumeSlider.getBoundingClientRect();
    var pos = (e.clientX - rect.left) / rect.width;
    activeVideo.volume = Math.max(0, Math.min(1, pos));
    activeVideo.muted = false;
    updateVolume();
  });

  function updateVolume() {
    if (activeVideo.muted || activeVideo.volume === 0) {
      btnMute.innerHTML = '<i data-lucide="volume-x"></i>';
      volumeFill.style.width = '0%';
    } else {
      btnMute.innerHTML = '<i data-lucide="volume-2"></i>';
      volumeFill.style.width = (activeVideo.volume * 100) + '%';
    }
    if (window.lucide) lucide.createIcons();
  }

  btnFullscreen.addEventListener('click', function() {
    if (!document.fullscreenElement) {
      playerContainer.requestFullscreen().catch(()=>{});
    } else {
      document.exitFullscreen();
    }
  });

  setInterval(function() {
    if (!activeVideo) return;
    if (isFinite(activeVideo.duration) && activeVideo.duration > 0) {
      var percent = (activeVideo.currentTime / activeVideo.duration) * 100;
      document.getElementById('timeline-progress').style.width = percent + '%';
      var mins = Math.floor(activeVideo.currentTime / 60);
      var secs = Math.floor(activeVideo.currentTime % 60);
      timeDisplay.textContent = mins + ':' + (secs < 10 ? '0' : '') + secs + ' / LIVE';
    } else {
      timeDisplay.textContent = 'LIVE';
      document.getElementById('timeline-progress').style.width = '100%';
    }
  }, 1000);

  if (window.lucide) lucide.createIcons();
})();
</script>
</body>
</html>
