<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Camera App · Starlane</title>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root { --red:#E50914; --bg:#0a0a0f; --surface:#1a1a24; --text:#fff; --border:rgba(255,255,255,.1); }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { background:#000; color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; height:100vh; width:100vw; overflow:hidden; position:relative; }
  .hidden { display:none !important; }
  #preview { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; }
  .overlay-wrapper { position:absolute; inset:0; z-index:10; display:flex; flex-direction:column; justify-content:space-between; background:linear-gradient(to bottom,rgba(0,0,0,.7) 0%,transparent 20%,transparent 70%,rgba(0,0,0,.9) 100%); opacity:0; pointer-events:none; transition:opacity .3s; }
  .overlay-wrapper.show { opacity:1; pointer-events:auto; }
  .top-bar { padding:30px 20px; display:flex; justify-content:space-between; align-items:flex-start; }
  .status { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:900; text-transform:uppercase; letter-spacing:1px; background:rgba(0,0,0,.5); padding:6px 12px; border-radius:20px; backdrop-filter:blur(8px); }
  .status .dot { width:8px; height:8px; border-radius:50%; background:#555; }
  .status.live .dot { background:var(--red); box-shadow:0 0 10px var(--red); animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.4;} }
  .bottom-controls { padding:20px 20px 40px 20px; display:flex; flex-direction:column; gap:20px; }
  .control-group { background:rgba(0,0,0,.6); backdrop-filter:blur(12px); padding:16px; border-radius:16px; border:1px solid rgba(255,255,255,.1); }
  .control-group label { display:flex; justify-content:space-between; font-size:11px; font-weight:800; color:rgba(255,255,255,.7); margin-bottom:12px; text-transform:uppercase; letter-spacing:1px; }
  .slider { -webkit-appearance:none; width:100%; height:6px; border-radius:3px; background:rgba(255,255,255,.2); outline:none; }
  .slider::-webkit-slider-thumb { -webkit-appearance:none; width:28px; height:28px; border-radius:50%; background:#fff; cursor:pointer; }
  .btn { width:100%; padding:18px; border-radius:16px; font-size:16px; font-weight:900; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:.2s; }
  .btn-stop { background:#fff; color:#000; }
  .setup-screen { position:absolute; inset:0; background:var(--bg); z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; }
  .setup-screen h2 { font-size:24px; font-weight:900; margin-bottom:8px; color:#fff; }
  .setup-screen p { font-size:14px; color:rgba(255,255,255,.6); margin-bottom:24px; }
  .select-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; width:100%; max-width:400px; margin-bottom:24px; }
  .select-btn { padding:24px; border-radius:16px; background:var(--surface); border:2px solid var(--border); color:#fff; font-size:18px; font-weight:900; cursor:pointer; transition:.2s; }
  .select-btn:hover, .select-btn:active { border-color:var(--red); background:rgba(229,9,20,.1); }
  .event-list { width:100%; max-width:400px; display:flex; flex-direction:column; gap:12px; max-height:50vh; overflow-y:auto; margin-bottom:24px; }
  .event-btn { padding:16px; border-radius:12px; background:var(--surface); border:1px solid var(--border); color:#fff; text-align:left; cursor:pointer; }
  .event-btn h4 { font-size:16px; margin-bottom:4px; }
  .event-btn p { font-size:12px; color:rgba(255,255,255,.5); margin:0; }
  .ads-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px; width:100%; max-width:300px; }
  .ads-row label { font-size:10px; color:rgba(255,255,255,.5); margin-bottom:4px; display:block; text-transform:uppercase; font-weight:800; }
  .ads-row input { width:100%; padding:12px; border-radius:8px; background:var(--surface); border:1px solid var(--border); color:#fff; font-size:14px; }
</style>
</head>
<body>

<div class="setup-screen" id="login-screen">
  <h2>Admin Login</h2><p>Sign in to access your camera broadcast slots.</p>
  <button class="btn" id="btn-login" style="background:var(--red); color:#fff; max-width:300px;">Sign In</button>
</div>

<div class="setup-screen hidden" id="camera-screen">
  <h2>Select Camera Slot</h2>
  <div class="select-grid" id="cam-select-grid"></div>
</div>

<div class="setup-screen hidden" id="event-screen">
  <h2>Select Event</h2>
  <div class="event-list" id="event-select-list"></div>
  <button class="btn" id="btn-back-cam" style="background:transparent; color:rgba(255,255,255,.5); border:1px solid var(--border); max-width:300px; margin-top:10px;">Back to Cameras</button>
</div>

<div class="setup-screen hidden" id="ad-screen">
  <h2>Pre-Show Ads</h2>
  <div class="ads-row">
    <div><label>Pre-Show (Mins)</label><input type="number" id="ads-time" value="5" /></div>
    <div><label>Ad Length (Secs)</label><input type="number" id="ads-duration" value="30" /></div>
  </div>
  <button class="btn" id="btn-start-stream" style="background:var(--red); color:#fff; max-width:300px;">Go Live in HD</button>
</div>

<video id="preview" autoplay playsinline muted class="hidden"></video>

<div class="overlay-wrapper hidden" id="overlay">
  <div class="top-bar">
    <div class="status" id="status-indicator"><div class="dot"></div> <span id="status-text">OFFLINE</span></div>
  </div>
  <div class="bottom-controls">
    <div class="control-group"><label>Zoom <span id="zoom-val">1.0x</span></label><input type="range" id="zoom-slider" class="slider" min="1" max="5" step="0.1" value="1" /></div>
    <div class="control-group"><label>Brightness <span id="bright-val">100%</span></label><input type="range" id="bright-slider" class="slider" min="0.5" max="1.5" step="0.1" value="1" /></div>
    <button class="btn btn-stop" id="btn-stop">STOP BROADCAST</button>
  </div>
</div>

<script>
  var firebaseConfig = { apiKey:"AIzaSyAxki2vcYmVeZav7N1WybofdvN3n6Aa0rk", authDomain:"starlane-stream.firebaseapp.com", projectId:"starlane-stream", storageBucket:"starlane-stream.firebasestorage.app", messagingSenderId:"115625325145", appId:"1:115625325145:web:b14025df503bbe2b7d7748" };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();
  var auth = firebase.auth();

  var video = document.getElementById('preview');
  var overlay = document.getElementById('overlay');
  var stream = null;
  var mediaRecorder = null;
  var isStreaming = false;
  var killWatcher = null;
  var selectedCamId = null;
  var selectedEventId = null;
  var selectedEventName = null;

  // Preselect camera from QR code (?cam=cam1)
  var presetCam = new URLSearchParams(location.search).get('cam');
  if (presetCam && ['cam1','cam2','cam3','cam4'].includes(presetCam)) selectedCamId = presetCam;

  auth.onAuthStateChanged(function(user) {
    if (user) {
      document.getElementById('login-screen').classList.add('hidden');
      if (selectedCamId) {
        document.getElementById('event-screen').classList.remove('hidden');
        loadEvents();
      } else {
        document.getElementById('camera-screen').classList.remove('hidden');
        renderCameraButtons();
      }
    } else {
      document.getElementById('login-screen').classList.remove('hidden');
      document.getElementById('camera-screen').classList.add('hidden');
      document.getElementById('event-screen').classList.add('hidden');
    }
  });

  document.getElementById('btn-login').addEventListener('click', function() {
    window.location.href = 'auth.html?redirect=' + encodeURIComponent(location.pathname + location.search);
  });

  function renderCameraButtons() {
    var grid = document.getElementById('cam-select-grid');
    grid.innerHTML = '';
    ['cam1','cam2','cam3','cam4'].forEach(function(cam, i) {
      var btn = document.createElement('button');
      btn.className = 'select-btn';
      btn.textContent = 'CAM ' + (i + 1);
      btn.onclick = function() {
        selectedCamId = cam;
        document.getElementById('camera-screen').classList.add('hidden');
        document.getElementById('event-screen').classList.remove('hidden');
        loadEvents();
      };
      grid.appendChild(btn);
    });
  }

  function loadEvents() {
    var list = document.getElementById('event-select-list');
    list.innerHTML = '<p>Loading events...</p>';
    db.collection('streams').where('active', '==', true).get().then(function(snap) {
      list.innerHTML = '';
      snap.forEach(function(doc) {
        var data = doc.data();
        var btn = document.createElement('button');
        btn.className = 'event-btn';
        btn.innerHTML = '<h4>' + (data.title || 'Untitled') + '</h4><p>' + (data.startDate || '') + '</p>';
        btn.onclick = function() {
          selectedEventId = doc.id;
          selectedEventName = data.title;
          document.getElementById('event-screen').classList.add('hidden');
          document.getElementById('ad-screen').classList.remove('hidden');
        };
        list.appendChild(btn);
      });
    });
  }

  document.getElementById('btn-back-cam').addEventListener('click', function() {
    document.getElementById('event-screen').classList.add('hidden');
    document.getElementById('camera-screen').classList.remove('hidden');
  });

  document.getElementById('btn-start-stream').addEventListener('click', async function() {
    var adsTime = parseInt(document.getElementById('ads-time').value) || 0;
    var adsDuration = parseInt(document.getElementById('ads-duration').value) || 0;

    try {
      var constraints = {
        video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } },
        audio: { echoCancellation:true, noiseSuppression:true, autoGainControl:true, sampleRate:44100, channelCount:2 }
      };
      try { stream = await navigator.mediaDevices.getUserMedia(constraints); }
      catch (e) { stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" }, audio:true }); }

      video.srcObject = stream;
      video.classList.remove('hidden');

      // Clear any previous kill flag, set active camera
      await db.collection('streams').doc(selectedEventId).update({
        activeCamera: selectedCamId,
        streamUrl: 'broadcasting',
        killedAt: firebase.firestore.FieldValue.delete(),
        adSchedule: { preShowMins: adsTime, durationSecs: adsDuration }
      });

      document.getElementById('ad-screen').classList.add('hidden');
      overlay.classList.remove('hidden');
      document.getElementById('status-indicator').classList.add('live');
      document.getElementById('status-text').textContent = 'LIVE: ' + selectedEventName;
      overlay.classList.add('show');
      setTimeout(function(){ overlay.classList.remove('show'); }, 3000);

      startRecording();
      startKillWatcher(); // Watch for Director Kill Switch
    } catch (err) {
      alert("Camera Error: " + err.message);
    }
  });

  function startKillWatcher() {
    if (killWatcher) killWatcher();
    killWatcher = db.collection('streams').doc(selectedEventId).onSnapshot(function(doc) {
      if (!doc.exists) return;
      if (doc.data().killedAt && isStreaming) {
        isStreaming = false;
        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        if (stream) stream.getTracks().forEach(function(t){ t.stop(); });
        if (killWatcher) killWatcher();
        alert('Director has killed the stream. Recording stopped.');
        window.location.reload();
      }
    });
  }

  var lastTap = 0;
  document.body.addEventListener('click', function(e) {
    var now = Date.now();
    if (now - lastTap < 300) { overlay.classList.toggle('show'); e.preventDefault(); }
    lastTap = now;
  });

  document.getElementById('zoom-slider').addEventListener('input', function() {
    if (!stream) return;
    var track = stream.getVideoTracks()[0];
    if (track.getCapabilities && track.getCapabilities().zoom) {
      var z = parseFloat(this.value);
      document.getElementById('zoom-val').textContent = z.toFixed(1) + 'x';
      track.applyConstraints({ advanced: [{ zoom: z }] });
    }
  });

  document.getElementById('bright-slider').addEventListener('input', function() {
    if (!stream) return;
    var track = stream.getVideoTracks()[0];
    if (track.getCapabilities && track.getCapabilities().brightness) {
      var b = parseFloat(this.value);
      document.getElementById('bright-val').textContent = Math.round(b * 100) + '%';
      track.applyConstraints({ advanced: [{ brightness: b }] });
    }
  });

  document.getElementById('btn-stop').addEventListener('click', async function() {
    if (!confirm("Stop broadcasting?")) return;
    isStreaming = false;
    if (killWatcher) killWatcher();
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    if (stream) stream.getTracks().forEach(function(t){ t.stop(); });
    await db.collection('streams').doc(selectedEventId).update({ streamUrl: null, activeCamera: null });
    window.location.reload();
  });

  function startRecording() {
    isStreaming = true;
    var options = { mimeType:'video/webm;codecs=vp8,opus', videoBitsPerSecond:5000000, audioBitsPerSecond:128000 };
    if (!MediaRecorder.isTypeSupported(options.mimeType)) options = {};

    mediaRecorder = new MediaRecorder(stream, options);
    mediaRecorder.ondataavailable = async function(e) {
      if (e.data.size > 0 && isStreaming) {
        var formData = new FormData();
        formData.append('video', e.data);
        formData.append('eventId', selectedEventId);
        formData.append('camId', selectedCamId);
        try {
          await fetch('https://starlane-stream-api.onrender.com/api/upload-chunk', { method:'POST', body: formData });
        } catch (err) { console.error(err); }
      }
    };
    mediaRecorder.onstop = function() { if (isStreaming) startRecording(); };
    mediaRecorder.start();
    setTimeout(function(){ if (mediaRecorder.state === 'recording') mediaRecorder.stop(); }, 2000);
  }

  if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
