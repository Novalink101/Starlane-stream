<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Go Live · Novalink</title>
<style>
  body { background: #000; color: #fff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; text-align: center; }
  .video-container { position: relative; width: 100%; max-width: 600px; aspect-ratio: 16/9; background: #111; border-radius: 16px; overflow: hidden; border: 2px solid #333; margin-bottom: 24px; }
  video { width: 100%; height: 100%; object-fit: cover; }
  .status { position: absolute; top: 16px; right: 16px; background: rgba(0,0,0,0.7); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #E50914; }
  .dot.recording { animation: pulse 1s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .btn { padding: 16px 32px; border-radius: 50px; font-size: 18px; font-weight: 900; border: none; cursor: pointer; transition: 0.2s; width: 100%; max-width: 400px; }
  .btn-start { background: #E50914; color: #fff; box-shadow: 0 10px 30px rgba(229,9,20,0.4); }
  .btn-stop { background: #fff; color: #000; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

  <h1 id="title">Ready to Broadcast</h1>
  <p id="subtitle">Click below to turn on your camera.</p>

  <div class="video-container">
    <video id="preview" autoplay playsinline muted></video>
    <div class="status"><span class="dot" id="status-dot"></span> <span id="status-text">OFFLINE</span></div>
  </div>

  <button id="start-btn" class="btn btn-start">🔴 Start Streaming</button>
  <button id="stop-btn" class="btn btn-stop" style="display:none;">⏹ Stop Streaming</button>

<script>
  const video = document.getElementById('preview');
  const startBtn = document.getElementById('start-btn');
  const stopBtn = document.getElementById('stop-btn');
  const statusDot = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');
  const title = document.getElementById('title');
  const subtitle = document.getElementById('subtitle');

  let mediaRecorder;
  let stream;
  let isStreaming = false;

  // REPLACE THIS WITH YOUR STARLANE EVENT ID
  const EVENT_ID = "YOUR_STREAM_ID_HERE"; 

  startBtn.addEventListener('click', async () => {
    try {
      // 1. Turn on camera
      stream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: "environment" }, // Use back camera
        audio: true 
      });
      video.srcObject = stream;
      
      // 2. Start Recording
      startRecording();

      startBtn.style.display = 'none';
      stopBtn.style.display = 'block';
      title.textContent = "You are LIVE";
      subtitle.textContent = "Viewers can see you now on Starlane.";
      statusDot.classList.add('recording');
      statusText.textContent = "LIVE";
      isStreaming = true;

    } catch (err) {
      alert("Camera access denied: " + err.message);
    }
  });

  stopBtn.addEventListener('click', () => {
    isStreaming = false;
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    if (stream) stream.getTracks().forEach(track => track.stop());
    
    startBtn.style.display = 'block';
    stopBtn.style.display = 'none';
    title.textContent = "Stream Ended";
    subtitle.textContent = "You are offline.";
    statusDot.classList.remove('recording');
    statusText.textContent = "OFFLINE";
  });

  function startRecording() {
    // We record a 5-second chunk, upload it, then record the next 5 seconds
    const options = { mimeType: 'video/webm;codecs=vp8,opus' };
    mediaRecorder = new MediaRecorder(stream, options);

    mediaRecorder.ondataavailable = async (e) => {
      if (e.data.size > 0 && isStreaming) {
        const blob = e.data;
        await uploadChunkToBackend(blob);
      }
    };

    mediaRecorder.onstop = () => {
      // When the 5s chunk finishes, restart immediately if still streaming
      if (isStreaming) {
        startRecording();
      }
    };

    mediaRecorder.start();
    
    // Stop the recording after 5 seconds to send the chunk
    setTimeout(() => {
      if (mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
    }, 5000);
  }

  async function uploadChunkToBackend(blob) {
    // We send the blob to our Node.js backend, which uploads to Cloudinary
    const formData = new FormData();
    formData.append('video', blob);
    formData.append('eventId', EVENT_ID);

    try {
      await fetch('https://starlane-stream-api.onrender.com/api/upload-chunk', {
        method: 'POST',
        body: formData
      });
    } catch (err) {
      console.error("Upload failed", err);
    }
  }
</script>
</body>
</html>
