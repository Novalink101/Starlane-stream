<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Camera · Starlane Broadcast</title>
<style>
  body { background: #000; color: #fff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; text-align: center; }
  video { width: 100%; max-width: 600px; aspect-ratio: 16/9; background: #111; border-radius: 16px; border: 2px solid #333; margin-bottom: 24px; object-fit: cover; }
  .btn { padding: 16px 32px; border-radius: 50px; font-size: 18px; font-weight: 900; border: none; cursor: pointer; width: 100%; max-width: 400px; }
  .btn-start { background: #E50914; color: #fff; }
  .btn-stop { background: #fff; color: #000; }
  .status { font-size: 14px; font-weight: 800; margin-bottom: 12px; color: #E50914; text-transform: uppercase; }
</style>
</head>
<body>

  <div class="status" id="cam-label">CAMERA 1</div>
  <video id="preview" autoplay playsinline muted></video>

  <button id="start-btn" class="btn btn-start">🔴 Start Broadcasting</button>
  <button id="stop-btn" class="btn btn-stop" style="display:none;">⏹ Stop</button>

<script>
  const params = new URLSearchParams(window.location.search);
  const camParam = params.get('cam') || '1'; // Defaults to cam 1
  const camId = 'cam' + camParam;
  const eventId = params.get('eventId') || 'YOUR_STREAM_ID_HERE';

  document.getElementById('cam-label').textContent = 'CAMERA ' + camParam;

  const video = document.getElementById('preview');
  let mediaRecorder;
  let stream;
  let isStreaming = false;

  document.getElementById('start-btn').addEventListener('click', async () => {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
      video.srcObject = stream;
      
      isStreaming = true;
      startRecording();

      document.getElementById('start-btn').style.display = 'none';
      document.getElementById('stop-btn').style.display = 'block';
    } catch (err) {
      alert("Camera error: " + err.message);
    }
  });

  document.getElementById('stop-btn').addEventListener('click', () => {
    isStreaming = false;
    if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    if (stream) stream.getTracks().forEach(t => t.stop());
    document.getElementById('start-btn').style.display = 'block';
    document.getElementById('stop-btn').style.display = 'none';
  });

  function startRecording() {
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8' });
    
    mediaRecorder.ondataavailable = async (e) => {
      if (e.data.size > 0 && isStreaming) {
        const formData = new FormData();
        formData.append('video', e.data);
        formData.append('eventId', eventId);
        formData.append('camId', camId);

        try {
          await fetch('https://starlane-stream-api.onrender.com/api/upload-chunk', {
            method: 'POST',
            body: formData
          });
        } catch (err) { console.error("Upload failed", err); }
      }
    };

    mediaRecorder.onstop = () => { if (isStreaming) startRecording(); };
    mediaRecorder.start();
    setTimeout(() => { if (mediaRecorder.state === 'recording') mediaRecorder.stop(); }, 5000);
  }
</script>
</body>
</html>
