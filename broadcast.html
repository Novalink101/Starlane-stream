<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Camera App · Starlane</title>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root { --red: #E50914; --bg: #0a0a0f; --surface: #1a1a24; --text: #fff; --border: rgba(255,255,255,0.1); }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: #000; color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; width: 100vw; overflow: hidden; position: relative; }
  
  .hidden { display: none !important; }

  /* Video */
  #preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }

  /* Overlay Controls */
  .overlay-wrapper { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 20%, transparent 70%, rgba(0,0,0,0.9) 100%); opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
  .overlay-wrapper.show { opacity: 1; pointer-events: auto; }

  .top-bar { padding: 30px 20px; display: flex; justify-content: space-between; align-items: flex-start; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 20px; backdrop-filter: blur(8px); }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
  .status.live .dot { background: var(--red); box-shadow: 0 0 10px var(--red); animation: pulse 1s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .bottom-controls { padding: 20px 20px 40px 20px; display: flex; flex-direction: column; gap: 20px; }
  .control-group { background: rgba(0,0,0,0.6); backdrop-filter: blur(12px); padding: 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); }
  .control-group label { display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; color: rgba(255,255,255,0.7); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .slider { -webkit-appearance: none; width: 100%; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.2); outline: none; }
  .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: #fff; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
  .btn { width: 100%; padding: 18px; border-radius: 16px; font-size: 16px; font-weight: 900; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
  .btn-stop { background: #fff; color: #000; }
  .btn-stop:active { transform: scale(0.98); }

  /* Setup Screens */
  .setup-screen { position: absolute; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; overflow-y: auto; }
  .setup-screen h2 { font-size: 24px; font-weight: 900; margin-bottom: 8px; color: #fff; }
  .setup-screen p { font-size: 14px; color: rgba(255,255,255,0.6); margin-bottom: 24px; }
  
  /* Selection Grid */
  .select-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 400px; margin-bottom: 24px; }
  .select-btn { padding: 24px; border-radius: 16px; background: var(--surface); border: 2px solid var(--border); color: #fff; font-size: 18px; font-weight: 900; cursor: pointer; transition: 0.2s; }
  .select-btn:hover, .select-btn:active { border-color: var(--red); background: rgba(229,9,20,0.1); }
  
  .event-list { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; max-height: 50vh; overflow-y: auto; margin-bottom: 24px; }
  .event-btn { padding: 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); color: #fff; text-align: left; cursor: pointer; }
  .event-btn h4 { font-size: 16px; margin-bottom: 4px; }
  .event-btn p { font-size: 12px; color: rgba(255,255,255,0.5); margin: 0; }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="setup-screen" id="login-screen">
  <div style="width: 56px; height: 56px; background: rgba(229,9,20,0.15); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px;">
    <i data-lucide="lock" style="color: var(--red); width: 28px; height: 28px;"></i>
  </div>
  <h2>Admin Login</h2>
  <p>Sign in to access your camera broadcast slots.</p>
  <button class="btn" id="btn-login" style="background: var(--red); color: #fff; max-width: 300px;">
    <i data-lucide="log-in"></i> Sign In
  </button>
</div>

<!-- CAMERA SELECTION SCREEN -->
<div class="setup-screen hidden" id="camera-screen">
  <h2>Select Camera Slot</h2>
  <p>Which angle is this phone covering?</p>
  <div class="select-grid" id="cam-select-grid">
    <!-- Buttons injected via JS -->
  </div>
</div>

<!-- EVENT SELECTION SCREEN -->
<div class="setup-screen hidden" id="event-screen">
  <h2>Select Event</h2>
  <p>Which stream are you broadcasting to?</p>
  <div class="event-list" id="event-select-list">
    <!-- Events injected via JS -->
  </div>
  <button class="btn" id="btn-back-cam" style="background: transparent; color: rgba(255,255,255,0.5); border: 1px solid var(--border); max-width: 300px; margin-top: 10px;">
    Back to Cameras
  </button>
</div>

<!-- AD SETTINGS SCREEN -->
<div class="setup-screen hidden" id="ad-screen">
  <div style="width: 56px; height: 56px; background: rgba(229,9,20,0.15); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px;">
    <i data-lucide="play-circle" style="color: var(--red); width: 28px; height: 28px;"></i>
  </div>
  <h2>Pre-Show Ads</h2>
  <p>Set the ad timer before the stream starts.</p>
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 300px; margin-bottom: 24px;">
    <div style="text-align:left;">
      <label style="font-size:10px; color:gray; font-weight:800; text-transform:uppercase;">Pre-Show (Mins)</label>
      <input type="number" id="ads-time" value="5" style="width:100%; padding:12px; border-radius:8px; background:var(--surface); border:1px solid var(--border); color:#fff;" />
    </div>
    <div style="text-align:left;">
      <label style="font-size:10px; color:gray; font-weight:800; text-transform:uppercase;">Ad Length (Secs)</label>
      <input type="number" id="ads-duration" value="30" style="width:100%; padding:12px; border-radius:8px; background:var(--surface); border:1px solid var(--border); color:#fff;" />
    </div>
  </div>
  <button class="btn" id="btn-start-stream" style="background: var(--red); color: #fff; max-width: 300px;">
    <i data-lucide="video"></i> Turn On Camera & Go Live
  </button>
</div>

<!-- FULL SCREEN CAMERA -->
<video id="preview" autoplay playsinline muted class="hidden"></video>

<!-- CONTROLS OVERLAY -->
<div class="overlay-wrapper hidden" id="overlay">
  <div class="top-bar">
    <div class="status" id="status-indicator">
      <div class="dot"></div> <span id="status-text">OFFLINE</span>
    </div>
  </div>
  <div class="bottom-controls">
    <div class="control-group">
      <label>Zoom <span id="zoom-val">1.0x</span></label>
      <input type="range" id="zoom-slider" class="slider" min="1" max="5" step="0.1" value="1" />
    </div>
    <div class="control-group">
      <label>Brightness <span id="bright-val">100%</span></label>
      <input type="range" id="bright-slider" class="slider" min="0.5" max="1.5" step="0.1" value="1" />
    </div>
    <button class="btn btn-stop" id="btn-stop">
      <i data-lucide="square"></i> STOP BROADCAST
    </button>
  </div>
</div>

<script>
  var firebaseConfig = {
    apiKey: "AIzaSyAxki2vcYmVeZav7N1WybofdvN3n6Aa0rk",
    authDomain: "starlane-stream.firebaseapp.com",
    projectId: "starlane-stream",
    storageBucket: "starlane-stream.firebasestorage.app",
    messagingSenderId: "115625325145",
    appId: "1:115625325145:web:b14025df503bbe2b7d7748"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();
  var auth = firebase.auth();

  var video = document.getElementById('preview');
  var overlay = document.getElementById('overlay');
  
  var stream = null;
  var mediaRecorder = null;
  var isStreaming = false;
  
  var selectedCamId = null;
  var selectedEventId = null;
  var selectedEventName = null;

  // 1. AUTHENTICATION
  auth.onAuthStateChanged(function(user) {
    if (user) {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('camera-screen').classList.remove('hidden');
      renderCameraButtons();
    } else {
      document.getElementById('login-screen').classList.remove('hidden');
      document.getElementById('camera-screen').classList.add('hidden');
    }
  });

  document.getElementById('btn-login').addEventListener('click', function() {
    window.location.href = 'auth.html?redirect=' + encodeURIComponent('broadcast.html');
  });

  // 2. RENDER CAMERA BUTTONS
  function renderCameraButtons() {
    var grid = document.getElementById('cam-select-grid');
    grid.innerHTML = '';
    ['cam1', 'cam2', 'cam3', 'cam4'].forEach(function(cam, index) {
      var btn = document.createElement('button');
      btn.className = 'select-btn';
      btn.textContent = 'CAM ' + (index + 1);
      btn.onclick = function() {
        selectedCamId = cam;
        document.getElementById('camera-screen').classList.add('hidden');
        document.getElementById('event-screen').classList.remove('hidden');
        loadEvents();
      };
      grid.appendChild(btn);
    });
  }

  // 3. LOAD EVENTS
  function loadEvents() {
    var list = document.getElementById('event-select-list');
    list.innerHTML = '<p style="text-align:center; color:gray;">Loading events...</p>';
    
    db.collection('streams').where('active', '==', true).get().then(function(snap) {
      list.innerHTML = '';
      if (snap.empty) {
        list.innerHTML = '<p style="text-align:center; color:gray;">No active events found. Create one in Event Studio.</p>';
        return;
      }
      snap.forEach(function(doc) {
        var data = doc.data();
        var btn = document.createElement('button');
        btn.className = 'event-btn';
        btn.innerHTML = `<h4>${data.title || 'Untitled'}</h4><p>${data.startDate || 'No date'}</p>`;
        btn.onclick = function() {
          selectedEventId = doc.id;
          selectedEventName = data.title;
          document.getElementById('event-screen').classList.add('hidden');
          document.getElementById('ad-screen').classList.remove('hidden');
        };
        list.appendChild(btn);
      });
    });
  }

  document.getElementById('btn-back-cam').addEventListener('click', function() {
    document.getElementById('event-screen').classList.add('hidden');
    document.getElementById('camera-screen').classList.remove('hidden');
  });

  // 4. START STREAM
  document.getElementById('btn-start-stream').addEventListener('click', async function() {
    var adsTime = parseInt(document.getElementById('ads-time').value) || 0;
    var adsDuration = parseInt(document.getElementById('ads-duration').value) || 0;

    try {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: true });
      } catch (e) {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true });
      }
      
      video.srcObject = stream;
      video.classList.remove('hidden');
      
      await db.collection('streams').doc(selectedEventId).update({
        activeCamera: selectedCamId,
        streamUrl: 'broadcasting',
        adSchedule: { preShowMins: adsTime, durationSecs: adsDuration }
      });
      
      document.getElementById('ad-screen').classList.add('hidden');
      overlay.classList.remove('hidden');
      document.getElementById('status-indicator').classList.add('live');
      document.getElementById('status-text').textContent = 'LIVE: ' + selectedEventName;
      
      // Show overlay briefly
      overlay.classList.add('show');
      setTimeout(function() { overlay.classList.remove('show'); }, 3000);

      startRecording();

    } catch (err) {
      alert("Camera Error: " + err.message);
    }
  });

  // Double tap to toggle controls
  var lastTap = 0;
  document.body.addEventListener('click', function(e) {
    var currentTime = new Date().getTime();
    var tapLength = currentTime - lastTap;
    if (tapLength < 300 && tapLength > 0) {
      overlay.classList.toggle('show');
      e.preventDefault();
    }
    lastTap = currentTime;
  });

  // Zoom & Brightness
  document.getElementById('zoom-slider').addEventListener('input', function() {
    if (stream) {
      var track = stream.getVideoTracks()[0];
      if (track.getCapabilities().zoom) {
        var zoomValue = parseFloat(this.value);
        document.getElementById('zoom-val').textContent = zoomValue.toFixed(1) + 'x';
        track.applyConstraints({ advanced: [{ zoom: zoomValue }] });
      }
    }
  });

  document.getElementById('bright-slider').addEventListener('input', function() {
    if (stream) {
      var track = stream.getVideoTracks()[0];
      if (track.getCapabilities().brightness) {
        var brightValue = parseFloat(this.value);
        document.getElementById('bright-val').textContent = Math.round(brightValue * 100) + '%';
        track.applyConstraints({ advanced: [{ brightness: brightValue }] });
      }
    }
  });

  // Stop Broadcast
  document.getElementById('btn-stop').addEventListener('click', async function() {
    if (confirm("Stop broadcasting immediately?")) {
      isStreaming = false;
      if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      if (stream) stream.getTracks().forEach(t => t.stop());
      await db.collection('streams').doc(selectedEventId).update({ streamUrl: null, activeCamera: null });
      window.location.reload();
    }
  });

  // Recording Loop
  function startRecording() {
    isStreaming = true;
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8,opus' });
    
    mediaRecorder.ondataavailable = async (e) => {
      if (e.data.size > 0 && isStreaming) {
        const formData = new FormData();
        formData.append('video', e.data);
        formData.append('eventId', selectedEventId);
        formData.append('camId', selectedCamId);
        try {
          await fetch('https://starlane-stream-api.onrender.com/api/upload-chunk', {
            method: 'POST',
            body: formData
          });
        } catch (err) { console.error("Upload failed", err); }
      }
    };

    mediaRecorder.onstop = () => { if (isStreaming) startRecording(); };
    mediaRecorder.start();
    setTimeout(() => { if (mediaRecorder.state === 'recording') mediaRecorder.stop(); }, 5000);
  }

  if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
