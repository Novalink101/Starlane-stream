<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Live Broadcast Studio · Starlane</title>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root { --red: #E50914; --bg: #0a0a0f; --surface: #1a1a24; --text: #fff; --border: rgba(255,255,255,0.1); }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  
  .top-bar { padding: 16px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.5); z-index: 10; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
  .status .dot { width: 10px; height: 10px; border-radius: 50%; background: #555; }
  .status.live .dot { background: var(--red); box-shadow: 0 0 10px var(--red); animation: pulse 1s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .video-container { flex: 1; position: relative; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  video { width: 100%; height: 100%; object-fit: cover; }
  
  .overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); z-index: 10; }
  .control-group { margin-bottom: 16px; }
  .control-group label { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; color: rgba(255,255,255,0.7); margin-bottom: 8px; text-transform: uppercase; }
  .slider { -webkit-appearance: none; width: 100%; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.2); outline: none; }
  .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #fff; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.5); }

  .btn { width: 100%; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 900; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
  .btn-start { background: var(--red); color: #fff; box-shadow: 0 8px 20px rgba(229,9,20,0.4); }
  .btn-stop { background: #fff; color: #000; }
  
  .setup-screen { position: absolute; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
  .setup-screen h2 { font-size: 24px; font-weight: 900; margin-bottom: 8px; color: #fff; }
  .setup-screen p { font-size: 14px; color: rgba(255,255,255,0.6); margin-bottom: 24px; }
  
  .ads-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; width: 100%; max-width: 400px; }
  .ads-row div { text-align: left; }
  .ads-row label { font-size: 10px; color: rgba(255,255,255,0.5); margin-bottom: 4px; display: block; text-transform: uppercase; font-weight: 800; }
  .ads-row input { width: 100%; padding: 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); color: #fff; font-size: 14px; }
</style>
</head>
<body>

<!-- SETUP SCREEN -->
<div class="setup-screen" id="setup-modal">
  <div style="width: 56px; height: 56px; background: rgba(229,9,20,0.15); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px;">
    <i data-lucide="camera" style="color: var(--red); width: 28px; height: 28px;"></i>
  </div>
  <h2>Ready to Broadcast</h2>
  <p id="setup-sub">Waiting for camera hardware...</p>

  <div class="ads-row">
    <div>
      <label>Pre-Show Ads (Mins)</label>
      <input type="number" id="ads-time" value="5" />
    </div>
    <div>
      <label>Ad Duration (Secs)</label>
      <input type="number" id="ads-duration" value="30" />
    </div>
  </div>

  <button class="btn btn-start" id="btn-start-setup">
    <i data-lucide="video"></i> Turn On Camera
  </button>
</div>

<!-- LIVE BROADCAST UI -->
<div class="top-bar">
  <div class="status" id="status-indicator">
    <div class="dot"></div> <span id="status-text">OFFLINE</span>
  </div>
  <div style="font-size: 12px; font-weight: 800; color: rgba(255,255,255,0.5);">STARLANE LIVE</div>
</div>

<div class="video-container">
  <video id="preview" autoplay playsinline muted></video>
  
  <div class="overlay">
    <div class="control-group">
      <label>Zoom <span id="zoom-val">1.0x</span></label>
      <input type="range" id="zoom-slider" class="slider" min="1" max="5" step="0.1" value="1" />
    </div>

    <div class="control-group">
      <label>Brightness <span id="bright-val">100%</span></label>
      <input type="range" id="bright-slider" class="slider" min="0.5" max="1.5" step="0.1" value="1" />
    </div>

    <button class="btn btn-stop" id="btn-stop" style="display: none;">
      <i data-lucide="square"></i> STOP BROADCAST
    </button>
  </div>
</div>

<script>
  var firebaseConfig = {
    apiKey: "AIzaSyAxki2vcYmVeZav7N1WybofdvN3n6Aa0rk",
    authDomain: "starlane-stream.firebaseapp.com",
    projectId: "starlane-stream",
    storageBucket: "starlane-stream.firebasestorage.app",
    messagingSenderId: "115625325145",
    appId: "1:115625325145:web:b14025df503bbe2b7d7748"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();

  var video = document.getElementById('preview');
  var stream = null;
  var mediaRecorder = null;
  var isStreaming = false;
  
  var params = new URLSearchParams(window.location.search);
  var currentEventId = params.get('event');
  var currentCamId = params.get('cam') || 'cam1';

  if (currentEventId) {
    document.getElementById('setup-modal').style.display = 'none';
    setTimeout(function() {
      document.getElementById('btn-start-setup').click();
    }, 500);
  }

  document.getElementById('btn-start-setup').addEventListener('click', async function() {
    if (!currentEventId) return alert("No Event ID found. Use the Admin link.");

    var adsTime = parseInt(document.getElementById('ads-time').value) || 0;
    var adsDuration = parseInt(document.getElementById('ads-duration').value) || 0;

    try {
      // Try HD First
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: true 
        });
      } catch (e) {
        // Fallback to standard if HD fails on this phone
        console.log("HD failed, trying standard resolution...");
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: true 
        });
      }
      
      video.srcObject = stream;
      
      // Send the "I am live" signal to Firebase
      try {
        await db.collection('streams').doc(currentEventId).update({
          activeCamera: currentCamId,
          streamUrl: 'broadcasting',
          adSchedule: { preShowMins: adsTime, durationSecs: adsDuration }
        });
      } catch (dbErr) {
        // If Firebase blocks it, alert the user clearly
        console.error("Firebase Error:", dbErr);
        return alert("Firebase Error: " + dbErr.message + "\n\nPlease check your Firestore Rules.");
      }
      
      document.getElementById('setup-modal').style.display = 'none';
      document.getElementById('btn-stop').style.display = 'flex';
      document.getElementById('status-indicator').classList.add('live');
      document.getElementById('status-text').textContent = 'LIVE';
      
      startRecording();

    } catch (err) {
      alert("Camera Error: " + err.message);
    }
  });

  document.getElementById('zoom-slider').addEventListener('input', function() {
    if (stream) {
      var track = stream.getVideoTracks()[0];
      if (track.getCapabilities().zoom) {
        var zoomValue = parseFloat(this.value);
        document.getElementById('zoom-val').textContent = zoomValue.toFixed(1) + 'x';
        track.applyConstraints({ advanced: [{ zoom: zoomValue }] });
      }
    }
  });

  document.getElementById('bright-slider').addEventListener('input', function() {
    if (stream) {
      var track = stream.getVideoTracks()[0];
      if (track.getCapabilities().brightness) {
        var brightValue = parseFloat(this.value);
        document.getElementById('bright-val').textContent = Math.round(brightValue * 100) + '%';
        track.applyConstraints({ advanced: [{ brightness: brightValue }] });
      }
    }
  });

  document.getElementById('btn-stop').addEventListener('click', async function() {
    if (confirm("Stop broadcasting immediately?")) {
      isStreaming = false;
      if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      if (stream) stream.getTracks().forEach(t => t.stop());
      
      await db.collection('streams').doc(currentEventId).update({
        streamUrl: null, activeCamera: null
      });

      window.location.reload();
    }
  });

  function startRecording() {
    isStreaming = true;
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8,opus' });
    
    mediaRecorder.ondataavailable = async (e) => {
      if (e.data.size > 0 && isStreaming) {
        const formData = new FormData();
        formData.append('video', e.data);
        formData.append('eventId', currentEventId);
        formData.append('camId', currentCamId);

        try {
          await fetch('https://starlane-stream-api.onrender.com/api/upload-chunk', {
            method: 'POST',
            body: formData
          });
        } catch (err) { console.error("Upload failed", err); }
      }
    };

    mediaRecorder.onstop = () => { if (isStreaming) startRecording(); };
    mediaRecorder.start();
    setTimeout(() => { if (mediaRecorder.state === 'recording') mediaRecorder.stop(); }, 5000);
  }

  if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
