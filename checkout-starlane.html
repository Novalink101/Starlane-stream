<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Pay-Per-View Checkout · Starlane Stream</title>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root { --red: #E50914; --bg: #050508; --surface: #14141c; --text: #fff; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
  .card { background: var(--surface); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 40px; max-width: 480px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
  h1 { margin: 0 0 10px; font-size: 24px; }
  p { color: rgba(255,255,255,0.6); line-height: 1.6; margin-bottom: 24px; font-size: 15px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px; border-radius: 12px; background: var(--red); color: #fff; text-decoration: none; font-weight: 800; font-size: 16px; border: none; cursor: pointer; transition: 0.2s; }
  .btn:hover:not(:disabled) { background: #ff3b4e; transform: translateY(-2px); }
  .btn:disabled { opacity: 0.7; cursor: not-allowed; }
  
  .checkbox-group { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 24px; font-size: 13px; color: rgba(255,255,255,0.7); cursor: pointer; line-height: 1.5; }
  .checkbox-group input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--red); cursor: pointer; }
  .checkbox-group a { color: var(--red); text-decoration: none; font-weight: 700; }
  .checkbox-group a:hover { text-decoration: underline; }

  .success-icon { width: 64px; height: 64px; border-radius: 50%; background: rgba(16,185,129,0.1); border: 2px solid #10B981; color: #10B981; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 32px; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="card" id="checkout-step">
  <h1>Pay-Per-View Access</h1>
  <p>You don't have a Novalink ticket. You can pay a discounted rate to watch this stream directly on Starlane.</p>
  
  <div style="background: rgba(229,9,20,0.1); border: 1px solid var(--red); padding: 16px; border-radius: 12px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center;">
    <span style="font-weight: 700;">Total to pay:</span>
    <span style="font-size: 24px; font-weight: 900; color: var(--red);">R<span id="display-price">0</span></span>
  </div>

  <label class="checkbox-group">
    <input type="checkbox" id="termsCheck" />
    <span>I agree to the <a href="legal.html#terms" target="_blank">Terms of Service</a>, <a href="legal.html#privacy" target="_blank">Privacy Policy</a>, and understand this is a non-refundable digital purchase.</span>
  </label>

  <button id="yocoBtn" class="btn">
    Pay Now <i data-lucide="credit-card"></i>
  </button>
</div>

<div class="card hidden" id="success-step" style="text-align: center;">
  <div class="success-icon"><i data-lucide="check"></i></div>
  <h1>Payment Successful</h1>
  <p>Your access is unlocked. You can now watch the stream.</p>
  <a href="#" id="watchBtn" class="btn">Go to Stream <i data-lucide="play"></i></a>
</div>

<script>
(function(){
  var firebaseConfig = {
    apiKey: "AIzaSyAxki2vcYmVeZav7N1WybofdvN3n6Aa0rk",
    authDomain: "starlane-stream.firebaseapp.com",
    projectId: "starlane-stream",
    storageBucket: "starlane-stream.firebasestorage.app",
    messagingSenderId: "115625325145",
    appId: "1:115625325145:web:b14025df503bbe2b7d7748"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();
  var auth = firebase.auth();

  var urlParams = new URLSearchParams(window.location.search);
  var streamId = urlParams.get('streamId');
  var price = urlParams.get('price');
  var currentUser = null;

  if (!streamId || !price) {
    document.body.innerHTML = '<h2 style="text-align:center;">Invalid Checkout Link</h2>';
    return;
  }

  document.getElementById('display-price').textContent = price;
  var yocoBtn = document.getElementById('yocoBtn');
  yocoBtn.innerHTML = 'Pay R' + price + ' Now <i data-lucide="credit-card"></i>';
  if (window.lucide) lucide.createIcons();

  auth.onAuthStateChanged(function(user) {
    if (!user) {
      window.location.href = 'auth.html?redirect=' + encodeURIComponent(location.pathname + location.search);
      return;
    }
    currentUser = user;
  });

  yocoBtn.addEventListener('click', async function() {
    var termsCheck = document.getElementById('termsCheck');
    
    // 1. Check Terms & Conditions
    if (!termsCheck.checked) {
      termsCheck.parentElement.style.color = '#EF4444';
      alert("Please agree to the Terms of Service before paying.");
      return;
    }

    var btn = this;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Connecting to Yoco...';

    try {
      // 2. Auto-unlock the pass in Firebase FIRST
      await db.collection('users').doc(currentUser.uid).collection('passes').doc(streamId).set({
        streamId: streamId,
        price: parseInt(price, 10),
        status: 'approved',
        purchasedAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      // 3. Generate the Yoco link via Novalink API
      var res = await fetch('https://novalink-api-8vfg.onrender.com/api/create-checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          eventId: streamId,
          ticketId: currentUser.uid,
          orderRef: 'SPPV-' + Date.now(),
          amount: parseInt(price, 10) * 100,
          collection: 'starlane_passes'
        })
      });

      var data = await res.json();

      if (data.redirectUrl) {
        // 4. Send them to Yoco to pay
        window.location.href = data.redirectUrl;
      } else {
        throw new Error(data.error || 'Failed to generate payment link.');
      }
    } catch(e) {
      // Rollback the pass if Yoco fails to generate
      await db.collection('users').doc(currentUser.uid).collection('passes').doc(streamId).delete().catch(function(){});
      
      alert(e.message || 'Network error connecting to payment server.');
      btn.disabled = false;
      btn.innerHTML = 'Pay R' + price + ' Now <i data-lucide="credit-card"></i>';
      lucide.createIcons();
    }
  });
})();
</script>
</body>
</html>
