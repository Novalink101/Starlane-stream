<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#050508" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="referrer" content="no-referrer" />
<title>Watch · Starlane Stream</title>

<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
:root{
  --red:#E50914;--red-hover:#FF3B4E;--red-dark:#B20710;
  --red-soft:rgba(229,9,20,.12);
  --red-border:rgba(229,9,20,.25);

  --bg:#050508;--bg-2:#0A0A0F;
  --surface:rgba(20,20,28,.75);
  --surface-2:rgba(30,30,40,.6);
  --border:rgba(255,255,255,.08);
  --border-2:rgba(255,255,255,.14);

  --text:#FFFFFF;
  --text-2:rgba(255,255,255,.75);
  --text-3:rgba(255,255,255,.5);
  --text-muted:rgba(255,255,255,.35);

  --green:#10B981;
  --yellow:#F59E0B;
  --danger:#EF4444;

  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:22px;--r-full:999px;
  --ease:cubic-bezier(.25,.8,.25,1);
  --ease-out:cubic-bezier(.22,.9,.3,1);
  --container:1480px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);font-size:14px;line-height:1.55;
  color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;flex-direction:column;
  overflow-x:hidden;
}
img,svg{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:inherit;text-decoration:none}
h1,h2,h3{line-height:1.15;font-weight:900;letter-spacing:-.02em;color:#fff}
::selection{background:var(--red);color:#fff}
.hidden{display:none!important}

.container{max-width:var(--container);margin:0 auto;padding:0 24px;width:100%}
@media (max-width:560px){.container{padding:0 16px}}

/* Starfield */
.starfield{
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(229,9,20,.05) 0%, transparent 55%),
    linear-gradient(180deg, #050508 0%, #0A0A14 100%);
}
.starfield::before{
  content:'';position:absolute;inset:0;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,.5), transparent 100%),
    radial-gradient(1px 1px at 87% 32%, rgba(255,255,255,.35), transparent 100%),
    radial-gradient(1.5px 1.5px at 34% 78%, rgba(255,255,255,.4), transparent 100%),
    radial-gradient(1px 1px at 67% 12%, rgba(255,255,255,.3), transparent 100%);
  animation:twinkle 8s ease-in-out infinite;
}
@keyframes twinkle{0%,100%{opacity:.85}50%{opacity:.4}}

/* ── NAV ── */
.nav{
  position:sticky;top:0;z-index:50;
  background:rgba(5,5,8,.9);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.nav-inner{
  max-width:var(--container);margin:0 auto;
  padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
}
.nav-brand{display:inline-flex;align-items:center;gap:11px;flex-shrink:0}
.nav-brand svg{width:28px;height:34px;display:block}
.nav-brand b{font-weight:900;font-size:17px;letter-spacing:-.01em;color:#fff}
.nav-brand b span{color:var(--red)}
.nav-actions{display:flex;gap:10px;align-items:center;flex-shrink:0;flex-wrap:wrap}
@media (max-width:560px){
  .nav-inner{padding:12px 16px;gap:10px}
  .nav-brand b{font-size:15px}
  .nav-brand svg{width:24px;height:30px}
}

.nav-btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 14px;border-radius:var(--r-full);
  font-size:13px;font-weight:800;
  transition:all .2s var(--ease);
  white-space:nowrap;text-decoration:none;
  font-family:inherit;cursor:pointer;
  border:1px solid transparent;line-height:1;
}
.nav-btn svg{width:14px;height:14px;flex-shrink:0}
.nav-btn.ghost{background:transparent;color:var(--text-2);border-color:var(--border-2)}
.nav-btn.ghost:hover{color:#fff;border-color:var(--red);background:var(--red-soft)}
.nav-btn.primary{background:var(--red);color:#fff;box-shadow:0 4px 14px rgba(229,9,20,.35)}
.nav-btn.primary:hover{background:var(--red-hover);transform:translateY(-1px)}
.nav-btn .avatar{
  width:22px;height:22px;border-radius:50%;
  background:linear-gradient(135deg,var(--red),#FF5566);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:900;
  flex-shrink:0;font-family:var(--mono);
}
@media (max-width:560px){
  .nav-btn .lbl{display:none}
  .nav-btn{padding:9px 12px}
}

/* ── PAGE HEADER (breadcrumb + title) ── */
.pg-head{
  background:linear-gradient(180deg, #0A0A0F 0%, #050508 100%);
  padding:24px 0 22px;
  border-bottom:1px solid var(--border);
  position:relative;
  overflow:hidden;
}
.pg-head::after{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.025) 1px, transparent 0);
  background-size:20px 20px;
  pointer-events:none;
}
.pg-head-in{
  max-width:var(--container);margin:0 auto;padding:0 24px;
  position:relative;z-index:1;
}
@media (max-width:560px){.pg-head-in{padding:0 16px}.pg-head{padding:18px 0 16px}}
.pg-crumb{
  display:inline-flex;align-items:center;gap:7px;
  font-size:11.5px;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-3);
  margin-bottom:10px;
  transition:color .2s;
}
.pg-crumb:hover{color:var(--red)}
.pg-crumb svg{width:13px;height:13px}
.pg-title{
  font-size:clamp(1.3rem,2.8vw,1.9rem);
  font-weight:900;
  letter-spacing:-.02em;
  color:#fff;
  margin-bottom:8px;
  word-break:break-word;
  line-height:1.15;
}
.pg-meta{
  display:flex;gap:14px;flex-wrap:wrap;
  font-size:12.5px;
  color:var(--text-3);
  font-weight:600;
  align-items:center;
}
.pg-meta span{display:inline-flex;align-items:center;gap:6px}
.pg-meta svg{width:13px;height:13px;color:var(--red);flex-shrink:0}
.pg-meta .live-pill{
  background:var(--red);color:#fff;
  font-size:10px;font-weight:900;
  letter-spacing:.1em;text-transform:uppercase;
  padding:4px 10px;border-radius:var(--r-full);
  display:inline-flex;align-items:center;gap:5px;
}
.pg-meta .live-pill::before{
  content:'';width:6px;height:6px;border-radius:50%;
  background:#fff;animation:pulse 1.5s infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.85)}}

/* ── MAIN LAYOUT ── */
main{flex:1;padding:22px 0 60px}
@media (max-width:640px){main{padding:14px 0 48px}}

.layout{
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:22px;
  max-width:var(--container);
  margin:0 auto;
  padding:0 24px;
}
@media (min-width:1024px){
  .layout{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
}
@media (max-width:560px){.layout{padding:0 16px}}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-xl);
  padding:18px;
  backdrop-filter:blur(12px);
  box-shadow:0 24px 60px rgba(0,0,0,.35);
}
.card + .card{margin-top:14px}
@media (max-width:560px){.card{padding:14px;border-radius:var(--r-lg)}}

.card-title{
  font-size:10.5px;font-weight:900;
  text-transform:uppercase;letter-spacing:.08em;
  color:var(--red);
  margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}
.card-title svg{width:14px;height:14px}

/* ══════════════════════════════════════════════════════════════
   PLAYER
   ══════════════════════════════════════════════════════════════ */
.nl-player-wrap{
  background:#000;
  border-radius:var(--r-lg);
  overflow:hidden;
  border:1px solid var(--border);
  box-shadow:0 16px 48px rgba(0,0,0,.5);
  position:relative;
}
.nl-player{
  position:relative;
  aspect-ratio:16/9;
  background:#000;
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.nl-player iframe,
.nl-player #ytPlayer,
.nl-player #ytPlayerHost iframe{
  position:absolute!important;
  inset:0;
  width:100%!important;
  height:100%!important;
  border:0;
  z-index:1!important;
  background:#000;
}
#ytPlayerHost{position:absolute;inset:0;z-index:1;}
#nativeVideoPlayer{
  position:absolute!important;
  inset:0;
  width:100%!important;
  height:100%!important;
  background:#000;
  object-fit:contain;
  z-index:1;
}

.nl-player-topbar,.nl-player-bottombar,.nl-cd-pill,.nl-progress-wrap,.nl-buffering{
  transition:opacity .4s ease, transform .4s ease;
}
.nl-player.hide-controls .nl-player-topbar{
  opacity:0;transform:translateY(-8px);pointer-events:none;
}
.nl-player.hide-controls .nl-player-bottombar{
  opacity:0;transform:translateY(8px);pointer-events:none;
}
.nl-player.hide-controls .nl-cd-pill{
  opacity:0;pointer-events:none;
}
.nl-player.hide-controls .nl-progress-wrap{
  opacity:0;transform:translateY(8px);pointer-events:none;
}
.nl-player.hide-cursor{cursor:none;}

/* Tap zones for double-tap seek */
.nl-tap-zone{
  position:absolute;top:0;bottom:0;width:40%;z-index:4;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
.nl-tap-zone.left{left:0;justify-content:flex-start;padding-left:8%;}
.nl-tap-zone.right{right:0;justify-content:flex-end;padding-right:8%;}
.nl-tap-ripple{
  width:100px;height:100px;border-radius:50%;
  background:rgba(0,0,0,.55);
  border:2px solid rgba(255,255,255,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;
  backdrop-filter:blur(10px);
  opacity:0;transform:scale(.5);
  transition:opacity .35s ease, transform .35s cubic-bezier(0.175,0.885,0.32,1.275);
  pointer-events:none;
  box-shadow:0 8px 32px rgba(0,0,0,.4);
}
.nl-tap-ripple.show{opacity:1;transform:scale(1);}
.nl-tap-ripple svg{width:28px;height:28px;margin-bottom:2px;}
.nl-tap-ripple span{font-size:11px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;}

/* Countdown pill (top-right) */
.nl-cd-pill{
  position:absolute;top:12px;right:12px;z-index:6;
  display:none;align-items:center;gap:8px;
  padding:7px 12px;
  background:rgba(10,10,15,.88);
  border:1px solid var(--red-border);
  border-radius:var(--r-full);
  color:#fff;
  font-family:var(--mono);
  font-size:11.5px;font-weight:900;
  letter-spacing:.04em;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  box-shadow:0 6px 18px rgba(0,0,0,.4);
}
.nl-cd-pill.show{display:inline-flex}
.nl-cd-pill .dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--red);
  animation:pulse 1.5s infinite;
}
.nl-cd-pill .lbl{
  font-family:var(--font);
  font-size:9.5px;font-weight:900;
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--red);opacity:.85;
}
@media (max-width:520px){
  .nl-cd-pill{top:8px;right:8px;padding:5px 9px;font-size:10.5px;gap:6px;}
  .nl-cd-pill .lbl{font-size:8.5px}
}

/* Top bar (channel + brand) */
.nl-player-topbar{
  position:absolute;top:0;left:0;right:0;z-index:5;
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;
  padding:12px 14px;
  background:linear-gradient(180deg,rgba(0,0,0,.75) 0%,rgba(0,0,0,0) 100%);
  pointer-events:none;
}
.nl-player-topbar .left{display:flex;align-items:center;gap:8px;min-width:0}
.nl-player-topbar .live-tag{
  background:var(--red);color:#fff;
  font-size:9.5px;font-weight:900;
  letter-spacing:.08em;
  padding:4px 9px;border-radius:5px;
  text-transform:uppercase;
  display:inline-flex;align-items:center;gap:5px;
  pointer-events:none;
}
.nl-player-topbar .live-tag::before{
  content:'';width:5px;height:5px;border-radius:50%;
  background:#fff;animation:pulse 1.5s infinite;
}
.nl-player-topbar .ch-pill{
  background:rgba(10,10,15,.7);
  border:1px solid var(--red-border);
  color:#fff;
  font-size:9.5px;font-weight:900;
  letter-spacing:.06em;text-transform:uppercase;
  padding:4px 9px;border-radius:var(--r-full);
  backdrop-filter:blur(8px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:180px;pointer-events:none;
}
.nl-player-topbar .wm{
  display:inline-flex;align-items:center;gap:6px;
  text-shadow:0 2px 8px rgba(0,0,0,.85);
  pointer-events:none;opacity:.85;
}
.nl-player-topbar .wm svg{width:15px;height:19px;flex-shrink:0;display:block}
.nl-player-topbar .wm span{
  font-weight:900;font-size:11px;
  letter-spacing:.12em;color:#fff;
  text-transform:uppercase;
}

/* Buffering spinner */
.nl-buffering{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  z-index:3;display:none;pointer-events:none;
}
.nl-buffering.show{display:block;}
.nl-buffering .ring{
  width:56px;height:56px;border-radius:50%;
  border:3px solid rgba(255,255,255,.15);
  border-top-color:var(--red);
  animation:spinnerRing .9s linear infinite;
}
@keyframes spinnerRing{to{transform:rotate(360deg)}}

/* Bottom bar with controls */
.nl-player-bottombar{
  position:absolute;bottom:44px;left:0;right:0;z-index:5;
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;
  padding:6px 14px;
  pointer-events:none;
}
.nl-player-bottombar .controls{
  display:flex;gap:6px;align-items:center;
  pointer-events:auto;flex-wrap:wrap;
}
.nl-ctrl{
  width:36px;height:36px;border-radius:50%;
  background:rgba(0,0,0,.55);
  color:#fff;
  border:1px solid rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
  transition:.15s;
  backdrop-filter:blur(6px);
  flex-shrink:0;
  font-size:11px;font-weight:900;
  letter-spacing:-1px;
  font-family:var(--mono);
}
.nl-ctrl:hover{
  background:var(--red);
  color:#fff;
  border-color:var(--red);
  transform:scale(1.08);
}
.nl-ctrl:active{transform:scale(.95)}
.nl-ctrl svg{width:16px;height:16px}
.nl-ctrl.jump-live{
  width:auto;padding:0 14px;border-radius:var(--r-full);
  font-size:11.5px;font-weight:900;
  letter-spacing:.04em;text-transform:uppercase;
  color:#fff;
  background:linear-gradient(135deg,var(--red),#FF2A3D);
  border-color:var(--red);
  display:none;align-items:center;gap:6px;height:36px;
  font-family:var(--font);
}
.nl-ctrl.jump-live.show{display:inline-flex}
.nl-ctrl.jump-live::before{
  content:'';width:7px;height:7px;border-radius:50%;
  background:#fff;animation:pulse 1.2s infinite;
}
.nl-ctrl.jump-live:hover{
  background:linear-gradient(135deg,#FF2A3D,#FF5566);
  transform:translateY(-1px);
}
.nl-player-bottombar .right{
  display:flex;gap:6px;align-items:center;pointer-events:auto;
}
@media (max-width:520px){
  .nl-player-bottombar{bottom:38px;padding:4px 10px;}
  .nl-ctrl{width:32px;height:32px;}
  .nl-ctrl svg{width:14px;height:14px;}
  .nl-ctrl.jump-live{height:32px;padding:0 10px;font-size:10.5px;}
  .nl-progress-wrap{padding:10px 10px 6px;}
  .nl-time,.nl-time-sep{font-size:10.5px;}
}

/* Progress bar */
.nl-progress-wrap{
  position:absolute;bottom:0;left:0;right:0;z-index:6;
  padding:14px 14px 8px;
  background:linear-gradient(0deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,0) 100%);
  pointer-events:auto;
}
.nl-progress{
  position:relative;
  height:4px;border-radius:2px;
  background:rgba(255,255,255,.25);
  cursor:pointer;
  transition:height .15s ease;
}
.nl-progress:hover{height:6px;}
.nl-progress.dragging{height:6px;}
.nl-progress-loaded{
  position:absolute;top:0;left:0;bottom:0;border-radius:2px;
  background:rgba(255,255,255,.4);
  pointer-events:none;
}
.nl-progress-played{
  position:absolute;top:0;left:0;bottom:0;border-radius:2px;
  background:var(--red);
  pointer-events:none;
}
.nl-progress-played.behind{background:var(--yellow);}
.nl-progress-handle{
  position:absolute;top:50%;left:0;
  width:14px;height:14px;border-radius:50%;
  background:var(--red);
  border:2px solid #fff;
  transform:translate(-50%,-50%);
  pointer-events:none;
  box-shadow:0 2px 6px rgba(0,0,0,.5);
  transition:opacity .15s ease, transform .15s ease;
  opacity:0;
}
.nl-progress:hover .nl-progress-handle,
.nl-progress.dragging .nl-progress-handle{
  opacity:1;
  transform:translate(-50%,-50%) scale(1.15);
}
.nl-progress-hover{
  position:absolute;bottom:10px;left:0;
  font-family:var(--mono);
  font-size:11px;font-weight:800;
  padding:2px 6px;border-radius:4px;
  background:rgba(0,0,0,.85);color:#fff;
  transform:translateX(-50%);
  pointer-events:none;white-space:nowrap;
  opacity:0;transition:opacity .15s ease;
}
.nl-progress:hover .nl-progress-hover,
.nl-progress.dragging .nl-progress-hover{opacity:1;}

.nl-progress-row{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:6px;gap:8px;
}
.nl-progress-left{display:flex;align-items:center;gap:8px;min-width:0;}
.nl-progress-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.nl-time{
  font-family:var(--mono);
  font-size:11.5px;font-weight:800;
  color:#fff;letter-spacing:.03em;
  text-shadow:0 1px 3px rgba(0,0,0,.6);
}
.nl-time-sep{color:rgba(255,255,255,.5);font-size:11.5px;font-weight:700;}

.nl-live-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:var(--r-full);
  font-size:10px;font-weight:900;
  letter-spacing:.1em;text-transform:uppercase;
  border:none;cursor:pointer;
  font-family:inherit;
  transition:.15s ease;
  white-space:nowrap;
}
.nl-live-pill.live{background:var(--red);color:#fff;}
.nl-live-pill.live::before{
  content:'';width:6px;height:6px;border-radius:50%;
  background:#fff;animation:pulse 1.4s infinite;
}
.nl-live-pill.behind{
  background:rgba(255,255,255,.15);color:#fff;
  border:1px solid rgba(255,255,255,.25);
}
.nl-live-pill.behind:hover{
  background:var(--red);border-color:var(--red);
}
.nl-live-pill:disabled{opacity:.5;cursor:not-allowed;}

/* ── Curtain (loading / countdown) ── */
.nl-curtain{
  position:absolute;inset:0;z-index:5;
  background:
    radial-gradient(circle at 78% 30%, rgba(229,9,20,.12), transparent 55%),
    radial-gradient(circle at 22% 82%, rgba(229,9,20,.06), transparent 45%),
    linear-gradient(160deg,#0A0A0F 0%,#150a0e 45%,#0A0A0F 100%);
  display:none;
  flex-direction:column;align-items:center;justify-content:center;
  gap:16px;text-align:center;padding:32px 24px;
  color:#fff;overflow:hidden;
}
.nl-curtain.show{display:flex}
.nl-curtain::after{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.03) 1px, transparent 0);
  background-size:24px 24px;pointer-events:none;
}
.nc-logo{
  width:80px;height:100px;display:block;
  animation:ncFloat 2.8s ease-in-out infinite;
  filter:drop-shadow(0 8px 28px rgba(229,9,20,.5));
  position:relative;z-index:1;
}
@keyframes ncFloat{
  0%,100%{transform:translateY(0) scale(1);}
  50%{transform:translateY(-6px) scale(1.04);}
}
.nc-brand{
  font-weight:900;font-size:13px;
  letter-spacing:.32em;color:var(--red);
  text-transform:uppercase;
  position:relative;z-index:1;
  text-shadow:0 2px 12px rgba(229,9,20,.4);
}
.nc-title{
  font-size:clamp(1.05rem,2.4vw,1.35rem);
  font-weight:900;color:#fff;
  margin-top:4px;
  position:relative;z-index:1;
}
.nc-sub{
  font-size:13px;color:rgba(255,255,255,.6);
  max-width:380px;line-height:1.55;
  position:relative;z-index:1;
}
.nc-progress{
  width:180px;height:4px;border-radius:99px;
  background:rgba(255,255,255,.1);
  overflow:hidden;
  position:relative;z-index:1;
  margin-top:6px;
}
.nc-progress > i{
  display:block;height:100%;
  background:linear-gradient(90deg,transparent,var(--red),transparent);
  animation:ncSlide 1.6s ease-in-out infinite;
}
@keyframes ncSlide{
  0%{transform:translateX(-100%);}
  100%{transform:translateX(100%);}
}
.nc-badge{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 13px;border-radius:var(--r-full);
  background:rgba(229,9,20,.1);
  border:1px solid var(--red-border);
  font-size:10.5px;font-weight:900;
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--red);
  position:relative;z-index:1;
}
.nc-badge svg{width:12px;height:12px;}

.nc-countdown{
  display:flex;gap:12px;justify-content:center;
  margin:8px 0 4px;
  position:relative;z-index:1;
  flex-wrap:wrap;
}
.nc-cd-unit{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  min-width:74px;padding:14px 10px;
  background:rgba(229,9,20,.06);
  border:1px solid var(--red-border);
  border-radius:14px;
  box-shadow:0 8px 24px rgba(229,9,20,.08);
}
.nc-cd-unit strong{
  font-family:var(--mono);
  font-size:clamp(1.8rem,5vw,2.6rem);
  font-weight:900;color:#fff;
  line-height:1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
  text-shadow:0 4px 18px rgba(229,9,20,.45);
}
.nc-cd-unit small{
  font-size:9.5px;font-weight:800;
  letter-spacing:.14em;
  color:rgba(255,255,255,.55);
  text-transform:uppercase;
}
.nc-cd-date{
  font-size:12.5px;color:rgba(255,255,255,.7);
  font-weight:600;position:relative;z-index:1;margin-top:2px;
}
.nc-cd-date strong{color:#fff;font-weight:800;}
@media (max-width:520px){
  .nc-cd-unit{min-width:58px;padding:10px 6px;border-radius:10px}
  .nc-countdown{gap:6px}
  .nc-logo{width:64px;height:80px}
}

/* ── Up Next overlay ── */
.nl-upnext{
  position:absolute;inset:0;z-index:22;
  background:
    radial-gradient(circle at 78% 30%, rgba(229,9,20,.16), transparent 55%),
    radial-gradient(circle at 22% 82%, rgba(229,9,20,.08), transparent 45%),
    linear-gradient(160deg,#0A0A0F 0%,#150a0e 45%,#0A0A0F 100%);
  display:none;
  flex-direction:column;align-items:center;justify-content:center;
  gap:14px;text-align:center;padding:28px 24px;
  color:#fff;overflow:hidden;
}
.nl-upnext.show{display:flex}
.nl-upnext::after{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.03) 1px, transparent 0);
  background-size:24px 24px;pointer-events:none;
}
.un-logo{width:60px;height:74px;display:block;filter:drop-shadow(0 6px 20px rgba(229,9,20,.4));position:relative;z-index:1;}
.un-brand{font-weight:900;font-size:11.5px;letter-spacing:.3em;color:var(--red);text-transform:uppercase;position:relative;z-index:1;}
.un-label{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);position:relative;z-index:1;margin-top:2px;}
.un-title{font-size:clamp(1.15rem,2.6vw,1.5rem);font-weight:900;color:#fff;position:relative;z-index:1;max-width:90%;word-break:break-word;}
.un-meta{font-size:12.5px;color:rgba(255,255,255,.6);position:relative;z-index:1;}
.un-ring{
  width:96px;height:96px;border-radius:50%;
  border:3px solid rgba(229,9,20,.15);
  border-top-color:var(--red);
  animation:spinnerRing 1s linear infinite;
  position:relative;z-index:1;margin:6px 0;
  display:flex;align-items:center;justify-content:center;
}
.un-ring .num{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);
  font-size:34px;font-weight:900;color:#fff;
  text-shadow:0 2px 10px rgba(229,9,20,.5);
  animation:none;
}
.un-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;position:relative;z-index:1;margin-top:6px;}
.un-btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:11px 20px;border-radius:var(--r-md);
  font-weight:900;font-size:13px;letter-spacing:.03em;
  border:1px solid transparent;cursor:pointer;
  font-family:inherit;transition:.15s;
}
.un-btn.primary{background:var(--red);color:#fff;}
.un-btn.primary:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(229,9,20,.5);background:var(--red-hover);}
.un-btn.ghost{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff;}
.un-btn.ghost:hover{background:rgba(255,255,255,.16);}
.un-btn svg{width:15px;height:15px;}

/* ── Idle overlay (no content scheduled) ── */
.nl-idle{
  position:absolute;inset:0;z-index:21;
  background:
    radial-gradient(circle at 78% 30%, rgba(229,9,20,.14), transparent 55%),
    radial-gradient(circle at 22% 82%, rgba(229,9,20,.06), transparent 45%),
    linear-gradient(160deg,#0A0A0F 0%,#150a0e 45%,#0A0A0F 100%);
  display:none;
  flex-direction:column;align-items:center;justify-content:center;
  gap:14px;text-align:center;padding:32px 24px;
  color:#fff;overflow:hidden;
}
.nl-idle.show{display:flex}
.nl-idle .id-logo{
  width:72px;height:90px;display:block;
  filter:drop-shadow(0 8px 24px rgba(229,9,20,.4));
  position:relative;z-index:1;
  animation:ncFloat 2.8s ease-in-out infinite;
}
.nl-idle .id-brand{
  font-weight:900;font-size:12px;
  letter-spacing:.32em;color:var(--red);text-transform:uppercase;
  position:relative;z-index:1;
}
.nl-idle .id-title{
  font-size:clamp(1.1rem,2.4vw,1.4rem);
  font-weight:900;color:#fff;
  position:relative;z-index:1;
}
.nl-idle .id-sub{
  font-size:13px;color:rgba(255,255,255,.65);
  max-width:400px;line-height:1.55;
  position:relative;z-index:1;
}
.nl-idle .id-badge{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 13px;border-radius:var(--r-full);
  background:rgba(229,9,20,.1);
  border:1px solid var(--red-border);
  font-size:10.5px;font-weight:900;
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--red);
  position:relative;z-index:1;
}
.nl-idle .id-badge svg{width:12px;height:12px;}

/* ── Offline overlay ── */
.nl-offline{
  position:absolute;inset:0;z-index:25;
  background:linear-gradient(160deg,#0A0A0F 0%,#150a0e 50%,#0A0A0F 100%);
  display:none;
  flex-direction:column;align-items:center;justify-content:center;
  gap:18px;text-align:center;padding:32px 24px;color:#fff;
}
.nl-offline.show{display:flex}
.nl-offline .off-ico{
  width:72px;height:72px;border-radius:50%;
  background:rgba(229,9,20,.15);
  border:2px solid var(--red-border);
  display:flex;align-items:center;justify-content:center;
  color:var(--red);position:relative;
}
.nl-offline .off-ico::after{
  content:'';position:absolute;inset:-8px;
  border-radius:50%;
  border:1px dashed rgba(229,9,20,.35);
  animation:spinSlow 8s linear infinite;
}
@keyframes spinSlow{to{transform:rotate(360deg)}}
.nl-offline .off-ico svg{width:32px;height:32px}
.nl-offline .off-title{font-size:clamp(1.05rem,2.4vw,1.4rem);font-weight:900;color:#fff;}
.nl-offline .off-sub{font-size:13px;color:rgba(255,255,255,.65);max-width:360px;line-height:1.55;}
.nl-offline .off-status{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 16px;border-radius:var(--r-full);
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);
  font-size:11.5px;font-weight:800;
  color:rgba(255,255,255,.85);letter-spacing:.04em;
}
.nl-offline .off-status .pulse{
  width:7px;height:7px;border-radius:50%;
  background:var(--red);animation:pulse 1.2s infinite;
}

/* ── Queue banner ── */
.nl-queue-banner{
  position:absolute;bottom:96px;left:50%;
  transform:translateX(-50%);
  z-index:16;
  display:none;align-items:center;gap:12px;
  padding:10px 18px;border-radius:var(--r-full);
  background:rgba(10,10,15,.92);
  border:1px solid var(--red-border);
  box-shadow:0 12px 30px rgba(0,0,0,.5);
  backdrop-filter:blur(12px);
  color:#fff;
  max-width:calc(100% - 40px);
}
.nl-queue-banner.show{display:inline-flex}
.nl-queue-banner .qb-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--red);animation:pulse 1.2s infinite;flex-shrink:0;
}
.nl-queue-banner .qb-lbl{
  font-size:9.5px;font-weight:900;
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--red);
}
.nl-queue-banner .qb-title{
  font-size:12.5px;font-weight:800;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:220px;
}
.nl-queue-banner .qb-time{
  font-family:var(--mono);
  font-size:12px;font-weight:900;color:#fff;
  background:rgba(229,9,20,.12);
  padding:3px 10px;border-radius:8px;
  flex-shrink:0;
}
@media (max-width:520px){
  .nl-queue-banner{bottom:82px;padding:8px 14px;gap:8px}
  .nl-queue-banner .qb-title{max-width:120px;font-size:11.5px}
  .nl-queue-banner .qb-time{font-size:11px;padding:2px 8px}
}

/* ── AD OVERLAY ── */
.nl-ad{
  position:absolute;inset:0;z-index:15;
  background:#000;
  display:none;flex-direction:column;
  overflow:hidden;
}
.nl-ad.show{display:flex}
.nl-ad-media{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:#000;
}
.nl-ad-media video,
.nl-ad-media img{
  width:100%;height:100%;
  object-fit:contain;display:block;
}
.nl-ad-topbar{
  position:absolute;top:0;left:0;right:0;z-index:17;
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:14px 16px;
  background:linear-gradient(180deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,0) 100%);
  pointer-events:none;
}
.nl-ad-topbar .lbl{
  background:linear-gradient(90deg,var(--red),#FF2A3D);
  color:#fff;
  font-size:9.5px;font-weight:900;
  letter-spacing:.14em;text-transform:uppercase;
  padding:5px 11px;border-radius:var(--r-full);
  display:inline-flex;align-items:center;gap:6px;
  pointer-events:auto;
  box-shadow:0 4px 14px rgba(229,9,20,.35);
}
.nl-ad-topbar .lbl svg{width:11px;height:11px}
.nl-ad-topbar .title{
  font-size:11.5px;font-weight:800;
  color:rgba(255,255,255,.85);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:60%;text-shadow:0 1px 4px rgba(0,0,0,.6);
}
.nl-ad-bottombar{
  position:absolute;bottom:0;left:0;right:0;z-index:17;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:14px 16px;
  background:linear-gradient(0deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,0) 100%);
  pointer-events:none;
}
.nl-ad-cta{
  pointer-events:auto;
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 16px;
  background:linear-gradient(135deg,var(--red),#FF2A3D);
  color:#fff;
  font-size:12.5px;font-weight:900;
  border-radius:11px;
  text-decoration:none;
  box-shadow:0 8px 22px rgba(229,9,20,.35);
  transition:.15s;border:none;font-family:inherit;cursor:pointer;
}
.nl-ad-cta:hover{transform:translateY(-2px);background:var(--red-hover);}
.nl-ad-cta svg{width:14px;height:14px}
.nl-ad-skip{
  pointer-events:auto;
  background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.25);
  color:#fff;
  font-size:12px;font-weight:800;
  padding:9px 14px;border-radius:10px;
  cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;
  backdrop-filter:blur(8px);
  transition:.15s;font-family:inherit;
}
.nl-ad-skip:hover:not(:disabled){
  background:rgba(0,0,0,.75);
  border-color:rgba(255,255,255,.45);
}
.nl-ad-skip:disabled{opacity:.65;cursor:not-allowed}
.nl-ad-skip svg{width:14px;height:14px}
.nl-ad-skip .cnt{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:22px;height:22px;padding:0 6px;
  background:rgba(255,255,255,.15);
  border-radius:6px;
  font-family:var(--mono);
  font-size:11px;
}
.nl-ad-fs{
  pointer-events:auto;
  background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.25);
  color:#fff;
  width:38px;height:38px;border-radius:10px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);
  transition:.15s;font-family:inherit;flex-shrink:0;
}
.nl-ad-fs:hover{background:rgba(0,0,0,.75);border-color:rgba(255,255,255,.45);}
.nl-ad-fs svg{width:16px;height:16px}
.nl-ad-progress{
  position:absolute;bottom:0;left:0;right:0;height:3px;
  background:rgba(255,255,255,.15);z-index:18;
}
.nl-ad-progress > i{
  display:block;height:100%;
  background:var(--red);
  border-radius:0 2px 2px 0;
  width:0%;transition:width .2s linear;
}
.nl-ad-tap{
  position:absolute;inset:0;z-index:19;
  display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(4px);
  color:#fff;cursor:pointer;
}
.nl-ad-tap.show{display:flex}
.nl-ad-tap .tap-inner{
  display:flex;flex-direction:column;align-items:center;gap:12px;
  text-align:center;padding:20px 24px;
  background:rgba(10,10,15,.85);
  border:1px solid var(--red-border);
  border-radius:16px;
  box-shadow:0 12px 30px rgba(0,0,0,.5);
}
.nl-ad-tap .tap-inner svg{width:36px;height:36px;color:var(--red);}
.nl-ad-tap .tap-inner .tap-t{font-size:14px;font-weight:900;letter-spacing:.02em;}
.nl-ad-tap .tap-inner .tap-s{font-size:11.5px;color:rgba(255,255,255,.7);max-width:240px;line-height:1.5;}

/* House ad (fallback) */
.house-ad{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:24px;text-align:center;
  width:100%;height:100%;
  background:
    radial-gradient(circle at 30% 30%, rgba(229,9,20,.18), transparent 55%),
    radial-gradient(circle at 75% 75%, rgba(229,9,20,.14), transparent 50%),
    linear-gradient(160deg,#0A0A0F,#150a0e);
  color:#fff;
}
.house-ad .hh-brand{
  display:inline-flex;align-items:center;gap:10px;
  padding:9px 16px 9px 12px;
  background:rgba(229,9,20,.08);
  border:1px solid var(--red-border);
  border-radius:var(--r-full);
}
.house-ad .hh-brand svg{width:22px;height:27px;display:block}
.house-ad .hh-brand .wm{
  font-weight:900;font-size:12px;
  letter-spacing:.1em;color:#fff;
  text-transform:uppercase;line-height:1;
}
.house-ad .hh-t{
  font-size:15px;font-weight:900;
  letter-spacing:.02em;color:#fff;margin-top:4px;
}
.house-ad .hh-s{
  font-size:12.5px;color:rgba(255,255,255,.72);
  line-height:1.55;max-width:340px;
}
.house-ad .hh-cta{
  margin-top:6px;
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 18px;
  background:linear-gradient(135deg,var(--red),#FF2A3D);
  color:#fff;
  font-size:13px;font-weight:900;
  border-radius:11px;
  text-decoration:none;
  box-shadow:0 8px 22px rgba(229,9,20,.35);
  border:none;font-family:inherit;cursor:pointer;
}
.house-ad .hh-cta:hover{background:var(--red-hover);transform:translateY(-2px);}
.house-ad .hh-cta svg{width:14px;height:14px}

/* ── Info panel ── */
.info-list{display:flex;flex-direction:column;gap:10px}
.info-row{
  display:flex;gap:10px;align-items:flex-start;
  font-size:13px;color:var(--text-2);line-height:1.5;
}
.info-row svg{width:15px;height:15px;color:var(--red);flex-shrink:0;margin-top:3px}
.info-row .lbl{
  font-size:10px;font-weight:800;
  text-transform:uppercase;letter-spacing:.06em;
  color:var(--text-muted);
  display:block;margin-bottom:2px;
}
.info-row .val{
  font-weight:700;color:#fff;word-break:break-word;
}
.info-row .val a{color:var(--red);font-weight:800;}
.info-row .val a:hover{text-decoration:underline;}

/* Free note */
.free-note{
  display:flex;gap:10px;align-items:flex-start;
  padding:12px 14px;
  background:linear-gradient(135deg,rgba(16,185,129,.08),rgba(229,9,20,.04));
  border:1px solid rgba(16,185,129,.3);
  border-radius:11px;margin-top:12px;
}
.free-note svg{width:16px;height:16px;color:var(--green);flex-shrink:0;margin-top:2px}
.free-note .t{font-size:12px;font-weight:800;color:var(--green);margin-bottom:2px;}
.free-note .s{font-size:11px;color:var(--text-2);line-height:1.5;font-weight:500;}

/* ── Episode picker (for shows) ── */
.episode-panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-xl);
  padding:18px;
  margin-top:14px;
}
.episode-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;margin-bottom:14px;
}
.episode-head h3{
  font-size:14.5px;font-weight:900;
  color:#fff;
  display:inline-flex;align-items:center;gap:9px;
}
.episode-head h3 svg{width:16px;height:16px;color:var(--red);}
.season-picker{
  display:flex;gap:6px;overflow-x:auto;
  scrollbar-width:none;padding:2px 0;
  max-width:100%;
}
.season-picker::-webkit-scrollbar{display:none}
.season-btn{
  flex-shrink:0;
  padding:8px 14px;border-radius:var(--r-full);
  font-size:12.5px;font-weight:800;
  color:var(--text-3);
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);
  cursor:pointer;font-family:inherit;
  transition:all .2s var(--ease);
  white-space:nowrap;
}
.season-btn:hover{color:#fff;border-color:var(--red-border);}
.season-btn.active{
  background:var(--red);color:#fff;border-color:var(--red);
  box-shadow:0 4px 12px rgba(229,9,20,.35);
}
.episode-list{
  display:flex;flex-direction:column;gap:8px;
  max-height:400px;overflow-y:auto;
}
.episode-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;
  background:rgba(255,255,255,.02);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  cursor:pointer;
  transition:all .15s var(--ease);
  text-decoration:none;
}
.episode-item:hover{border-color:var(--red-border);background:rgba(229,9,20,.05);}
.episode-item.active{

  if (d > 0) return d + 'd ' + h + 'h';
  if (h > 0) return h + 'h ' + m + 'm';
  if (m > 0) return m + 'm ' + sec + 's';

function showCurtain(kind, title, sub){
  var c = $('curtain');
  if (!c) return;

  if (kind === 'countdown'){
    var targetMs = 0;
    var dateLabel = 'Starts soon';
    var segs = getSegments();
    var now = Date.now();
    var upcoming = null;
    for (var i = 0; i < segs.length; i++){
      if (now < segs[i].startMs){ upcoming = segs[i]; break; }
    }
    if (upcoming){
      targetMs = upcoming.startMs;
      dateLabel = 'Starts ' + formatDate(streamData.startDate, upcoming.startTime);
    } else if (segs.length){
      targetMs = segs[0].startMs;
      dateLabel = 'Starts ' + formatDate(streamData.startDate, segs[0].startTime);
    }

    c.innerHTML =
      LOGO_SVG +
      '<span class="nc-badge">' + icon('clock') + ' Up next</span>' +
      '<div class="nc-brand">STARLANE</div>' +
      '<div class="nc-title">' + esc(title || 'Stream starts in') + '</div>' +
      '<div class="nc-countdown">' +
        '<div class="nc-cd-unit"><strong id="ncDays">00</strong><small>Days</small></div>' +
        '<div class="nc-cd-unit"><strong id="ncHours">00</strong><small>Hours</small></div>' +
        '<div class="nc-cd-unit"><strong id="ncMins">00</strong><small>Min</small></div>' +
        '<div class="nc-cd-unit"><strong id="ncSecs">00</strong><small>Sec</small></div>' +
      '</div>' +
      '<div class="nc-cd-date">' + esc(dateLabel) + '</div>' +
      (sub ? '<div class="nc-sub">' + esc(sub) + '</div>' : '');

    c.dataset.targetMs = String(targetMs);
    c.classList.add('show');
    updateCurtainCountdown();
    refreshIcons();
    return;
  }

  var badgeHTML = '';
  if (kind === 'loading') badgeHTML = '<span class="nc-badge">' + icon('loader') + ' Loading</span>';
  else if (kind === 'queue') badgeHTML = '<span class="nc-badge">' + icon('megaphone') + ' Ads playing</span>';
  else if (kind === 'ended') badgeHTML = '<span class="nc-badge">' + icon('square') + ' Ended</span>';
  else if (kind === 'error') badgeHTML = '<span class="nc-badge">' + icon('alert-circle') + ' Error</span>';

  c.innerHTML =
    LOGO_SVG +
    badgeHTML +
    '<div class="nc-brand">STARLANE</div>' +
    '<div class="nc-title">' + esc(title || 'Loading…') + '</div>' +
    '<div class="nc-sub">' + esc(sub || '') + '</div>' +
    (kind !== 'error' ? '<div class="nc-progress"><i></i></div>' : '');

  c.classList.add('show');
  refreshIcons();
}

function hideCurtain(){
  var c = $('curtain');
  if (c) c.classList.remove('show');
}

function updateCurtainCountdown(){
  var c = $('curtain');
  if (!c || !c.classList.contains('show')) return;
  var targetMs = parseInt(c.dataset.targetMs || '0', 10);
  if (!targetMs) return;

  var diff = targetMs - Date.now();
  if (diff < 0) diff = 0;
  var s = Math.floor(diff / 1000);
  var d = Math.floor(s / 86400);
  var h = Math.floor((s % 86400) / 3600);
  var m = Math.floor((s % 3600) / 60);
  var sec = s % 60;

  var dEl = $('ncDays'), hEl = $('ncHours'), mEl = $('ncMins'), sEl = $('ncSecs');
  if (dEl) dEl.textContent = String(d).padStart(2,'0');
  if (hEl) hEl.textContent = String(h).padStart(2,'0');
  if (mEl) mEl.textContent = String(m).padStart(2,'0');
  if (sEl) sEl.textContent = String(sec).padStart(2,'0');
}

/* ═══════════════════════════════════════════════════════════════
   SEGMENTS — universal timeline for live/movie/show/highlight
   ═══════════════════════════════════════════════════════════════ */
function getSegments(){
  if (!streamData) return [];

  // ── MOVIE: single URL, plays anytime, ad gaps apply ──
  if (streamData.type === 'movie'){
    var url = streamData.streamUrl || '';
    var dur = parseInt(streamData.durationMinutes, 10) || 120;
    return [{
      url: url,
      startTime: '00:00',
      endTime: minutesToTime(dur),
      startMs: Date.now() - 1000, // movies are always "live" (playable now)
      endMs: Date.now() + dur * 60000,
      platform: detectPlatformFromUrl(url),
      isMovie: true
    }];
  }

  // ── SHOW: episodes, one URL each ──
  if (streamData.type === 'show' && Array.isArray(streamData.episodes)){
    var ep = streamData.episodes[currentEpisodeIndex] || streamData.episodes[0];
    if (!ep) return [];
    var dur2 = parseInt(ep.durationMinutes, 10) || 45;
    return [{
      url: ep.streamUrl || '',
      startTime: '00:00',
      endTime: minutesToTime(dur2),
      startMs: Date.now() - 1000,
      endMs: Date.now() + dur2 * 60000,
      platform: detectPlatformFromUrl(ep.streamUrl || ''),
      isEpisode: true,
      episodeIndex: currentEpisodeIndex
    }];
  }

  // ── LIVE/HIGHLIGHT: scheduled segments (existing behavior) ──
  if (Array.isArray(streamData.segments) && streamData.segments.length){
    var dateStr = streamData.startDate || '';
    return streamData.segments.map(function(s){
      var startMs = new Date(dateStr + 'T' + (s.startTime || '00:00') + ':00').getTime();
      var endMs = new Date(dateStr + 'T' + (s.endTime || '23:59') + ':00').getTime();
      if (endMs <= startMs) endMs += 86400000;
      return {
        url: s.url || '',
        startTime: s.startTime,
        endTime: s.endTime,
        startMs: startMs,
        endMs: endMs,
        platform: detectPlatformFromUrl(s.url || '')
      };
    }).filter(function(s){ return !isNaN(s.startMs) && !isNaN(s.endMs); });
  }

  // ── SINGLE URL LIVE/HIGHLIGHT ──
  var ds2 = streamData.startDate || '';
  var ts2 = streamData.startTime || '00:00';
  var dur3 = parseInt(streamData.durationMinutes, 10) || 90;
  var st2 = new Date(ds2 + 'T' + ts2 + ':00').getTime();
  if (isNaN(st2)) return [];
  return [{
    url: streamData.streamUrl || '',
    startTime: ts2,
    endTime: '00:00',
    startMs: st2,
    endMs: st2 + dur3 * 60000,
    platform: detectPlatformFromUrl(streamData.streamUrl || '')
  }];
}

function getTiming(){
  var segs = getSegments();
  if (!segs.length) return { valid:false };
  var startMs = segs[0].startMs;
  var endMs = segs[segs.length - 1].endMs + 15 * 60000;
  var replayMs = endMs + REPLAY_DAYS * 86400000;
  return {
    valid: true,
    startMs: startMs,
    endMs: endMs,
    replayUntilMs: replayMs,
    segments: segs
  };
}

function computePhase(){
  if (!streamData) return 'unknown';

  // Movies and shows are always "live" (on-demand, playable now)
  if (streamData.type === 'movie' || streamData.type === 'show'){
    return 'live';
  }

  var t = getTiming();
  if (!t.valid) return 'unknown';
  var now = Date.now();
  var segs = t.segments;

  if (now < segs[0].startMs) return 'upcoming';

  for (var i = 0; i < segs.length; i++){
    if (now >= segs[i].startMs && now <= segs[i].endMs) return 'live';
  }

  for (var j = 0; j < segs.length - 1; j++){
    if (now > segs[j].endMs && now < segs[j+1].startMs) return 'gap';
  }

  if (now <= t.replayUntilMs && streamData.replayEnabled !== false){
    return 'replay';
  }
  return 'ended';
}

function getActiveSegment(){
  var segs = getSegments();
  var now = Date.now();

  // For movies/shows, there's always an "active" segment (index 0)
  if (streamData && (streamData.type === 'movie' || streamData.type === 'show')){
    return segs[0] ? { seg: segs[0], index: 0 } : null;
  }

  for (var i = 0; i < segs.length; i++){
    if (now >= segs[i].startMs && now <= segs[i].endMs){
      return { seg: segs[i], index: i };
    }
  }
  return null;
}

function getNextSegment(){
  var segs = getSegments();
  var now = Date.now();
  for (var i = 0; i < segs.length; i++){
    if (now < segs[i].startMs) return { seg: segs[i], index: i };
  }
  return null;
}

/* ═══════════════════════════════════════════════════════════════
   PLAYER LOADERS
   ═══════════════════════════════════════════════════════════════ */
function getHost(){ return $('ytPlayerHost'); }

function buildVideoEl(id){
  var v = document.createElement('video');
  v.id = id || 'nativeVideoPlayer';
  v.controls = false;
  v.autoplay = true;
  v.muted = true;
  v.playsInline = true;
  v.style.width = '100%';
  v.style.height = '100%';
  v.style.position = 'absolute';
  v.style.inset = '0';
  v.style.objectFit = 'contain';
  v.setAttribute('playsinline', '');
  return v;
}

function wireNativeVideoEvents(video){
  video.addEventListener('loadedmetadata', function(){
    liveSyncState.duration = video.duration || 0;
    updateProgressFill();
  });

  video.addEventListener('canplay', function jumpToLiveOnLoad(){
    if (!liveSyncState.isLive) return;
    try {
      if (video.seekable && video.seekable.length){
        var end = video.seekable.end(video.seekable.length - 1);
        if (end > 0 && video.currentTime < end - 5){
          video.currentTime = Math.max(0, end - 0.5);
        }
      } else if (isFinite(video.duration) && video.duration > 0){
        if (video.currentTime < video.duration - 5){
          video.currentTime = video.duration - 0.5;
        }
      }
    } catch(e){}
  });

  video.addEventListener('timeupdate', function(){
    updateProgressFill();
    updateJumpLiveButton();
  });
  video.addEventListener('progress', function(){ updateProgressFill(); });
  video.addEventListener('waiting', function(){
    var b = $('nlBuffering'); if (b) b.classList.add('show');
  });
  video.addEventListener('playing', function(){
    var b = $('nlBuffering'); if (b) b.classList.remove('show');
    var pp = $('ctrlPlayPause'); if (pp) pp.innerHTML = icon('pause');
    refreshIcons();
  });
  video.addEventListener('pause', function(){
    var pp = $('ctrlPlayPause'); if (pp) pp.innerHTML = icon('play');
    refreshIcons();
    if (currentPhase === 'live') liveSyncState.lockToLiveEdge = false;
  });
  video.addEventListener('canplay', function(){
    var b = $('nlBuffering'); if (b) b.classList.remove('show');
  });
  video.addEventListener('ended', function(){ handleSegmentEnd(); });
  video.addEventListener('error', function(){
    var msg = 'Playback error.';
    if (video.error){
      if (video.error.code === 2) msg = 'Network error loading stream.';
      else if (video.error.code === 3) msg = 'Media decode error.';
      else if (video.error.code === 4) msg = 'Format not supported.';
    }
    toast(msg, 'error', 5000);
  });
}

function clearPlayerHost(){
  var host = getHost();
  if (host) host.innerHTML = '';
  ytPlayer = null;
  ytReady = false;
  currentYtVideoId = null;
  var nativeVid = document.getElementById('nativeVideoPlayer');
  if (nativeVid) nativeVid.remove();
  if (window.dashjs && dashPlayer){
    try { dashPlayer.reset(); } catch(e){}
    dashPlayer = null;
  }
  if (window.mpegts && mpegtsPlayer){
    try { mpegtsPlayer.destroy(); } catch(e){}
    mpegtsPlayer = null;
  }
}

/* ── HLS ── */
function loadHlsPlayer(url, isLive){
  var host = getHost(); if (!host) return;
  showCurtain('loading', 'Connecting…', 'HLS stream');
  clearPlayerHost();

  var video = buildVideoEl('nativeVideoPlayer');
  wireNativeVideoEvents(video);
  liveSyncState.isLive = isLive !== false;

  if (window.Hls && Hls.isSupported()){
    var hls = new Hls({ liveDurationInfinity: true });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function(){
      video.play().catch(function(){});
      hideCurtain();
    });
    hls.on(Hls.Events.ERROR, function(event, data){
      if (data && data.fatal){
        switch (data.type){
          case Hls.ErrorTypes.NETWORK_ERROR:
            hls.startLoad();
            break;
          case Hls.ErrorTypes.MEDIA_ERROR:
            hls.recoverMediaError();
            break;
          default:
            showCurtain('error', 'Stream Error', 'Could not connect to the HLS stream.');
            break;
        }
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')){
    video.src = url;
    video.addEventListener('loadedmetadata', function(){
      video.play().catch(function(){});
      hideCurtain();
    });
  } else {
    showCurtain('error', 'Not supported', 'Your browser cannot play HLS streams.');
    return;
  }

  host.appendChild(video);
  updateJumpLiveButton();
}

/* ── DASH ── */
function loadDashPlayer(url, isLive){
  var host = getHost(); if (!host) return;
  if (!window.dashjs){
    showCurtain('error', 'Not supported', 'DASH library failed to load.');
    return;
  }
  showCurtain('loading', 'Connecting…', 'DASH stream');
  clearPlayerHost();

  var video = buildVideoEl('nativeVideoPlayer');
  wireNativeVideoEvents(video);
  liveSyncState.isLive = isLive !== false;
  host.appendChild(video);

  try {
    dashPlayer = dashjs.MediaPlayer().create();
    dashPlayer.initialize(video, url, true);
    dashPlayer.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, function(){
      hideCurtain();
      video.play().catch(function(){});
    });
    dashPlayer.on(dashjs.MediaPlayer.events.ERROR, function(){
      showCurtain('error', 'Stream Error', 'Could not connect to the DASH stream.');
    });
  } catch(e){
    showCurtain('error', 'DASH error', e.message || '');
  }
  updateJumpLiveButton();
}

/* ── MPEG-TS ── */
function loadMpegTsPlayer(url, isLive){
  var host = getHost(); if (!host) return;
  if (!window.mpegts){
    showCurtain('error', 'Not supported', 'MPEG-TS library failed to load.');
    return;
  }
  showCurtain('loading', 'Connecting…', 'MPEG-TS stream');
  clearPlayerHost();

  var video = buildVideoEl('nativeVideoPlayer');
  wireNativeVideoEvents(video);
  liveSyncState.isLive = isLive !== false;
  host.appendChild(video);

  try {
    mpegtsPlayer = mpegts.createPlayer({
      type: 'mpegts',
      url: url,
      isLive: isLive !== false
    });
    mpegtsPlayer.attachMediaElement(video);
    mpegtsPlayer.load();
    mpegtsPlayer.play().then(function(){ hideCurtain(); }).catch(function(){ hideCurtain(); });
    mpegtsPlayer.on(mpegts.Events.ERROR, function(){
      showCurtain('error', 'Stream Error', 'Could not connect to the MPEG-TS stream.');
    });
  } catch(e){
    showCurtain('error', 'MPEG-TS error', e.message || '');
  }
  updateJumpLiveButton();
}

/* ── Direct video file ── */
function loadDirectVideoPlayer(url){
  var host = getHost(); if (!host) return;
  showCurtain('loading', 'Loading video…');

  var video = buildVideoEl('nativeVideoPlayer');

/* ── YouTube ── */
function loadYouTubePlayer(url){
  var host = getHost(); if (!host) return;
  clearPlayerHost();
  var vid = extractYouTubeId(url);
  if (!vid){
    showCurtain('error', 'Invalid URL', 'Could not extract a YouTube video ID.');
    return;
  }
  showCurtain('loading', 'Loading…', 'Connecting to YouTube');
  host.innerHTML = '<div id="ytPlayer"></div>';
  currentYtVideoId = vid;
  liveSyncState.isLive = (streamData.type !== 'movie' && streamData.type !== 'show');

  if (window.YT && window.YT.Player){
    createYTPlayer(vid);
  } else {
    window.onYouTubeIframeAPIReady = function(){ createYTPlayer(vid); };
  }

function createYTPlayer(videoId){
  ytPlayer = new YT.Player('ytPlayer', {
    videoId: videoId,
    playerVars: {
      autoplay: 1,
      mute: 1,
      rel: 0,
      playsinline: 1,
      iv_load_policy: 3,
      modestbranding: 1,
      controls: 0,
      disablekb: 1,
      origin: window.location.origin
    },
    events: {
      onReady: function(event){
        ytReady = true;
        hideCurtain();
        try { event.target.mute(); event.target.playVideo(); } catch(e){}

        if (liveSyncState.isLive){
          var seekAttempts = 0;
          var seekToLive = setInterval(function(){
            seekAttempts++;
            if (seekAttempts > 10){ clearInterval(seekToLive); return; }
            try {
              var dur = event.target.getDuration() || 0;
              var cur = event.target.getCurrentTime() || 0;
              if (dur > 0 && cur < dur - 10) event.target.seekTo(dur - 1, true);
              else if (dur > 0) clearInterval(seekToLive);
            } catch(e){}
          }, 800);
        }

        var attempts = 0;
        clearInterval(autoplayRetryTimer);
        autoplayRetryTimer = setInterval(function(){
          attempts++;
          if (attempts > 8){ clearInterval(autoplayRetryTimer); return; }
          try {
            var state = event.target.getPlayerState();
            if (state !== 1 && state !== 3) event.target.playVideo();
            else clearInterval(autoplayRetryTimer);
          } catch(e){}
        }, 1000);

        clearInterval(liveCheckTimer);
        liveCheckTimer = setInterval(function(){
          if (currentPhase === 'live'){
            updateJumpLiveButton();
            updateProgressFill();
          }
        }, 2000);
      },
      onStateChange: function(event){
        var pp = $('ctrlPlayPause');
        if (pp) pp.innerHTML = icon(event.data === 1 ? 'pause' : 'play');
        refreshIcons();

        if (event.data === 2 && currentPhase === 'live'){
          liveSyncState.lockToLiveEdge = false;
        }
        if (event.data === 0){
          if (adSettings.postrollEnabled
              && streamData.postrollEnabled !== false
              && !adState.firedPostroll
              && adPool.postroll.length){
            adState.firedPostroll = true;
            playAdBreak('postroll', function(){ handleSegmentEnd(); });
          } else {
            handleSegmentEnd();
          }
        }
        if (event.data === 1) updateJumpLiveButton();
      },
      onError: function(event){
        var msg = 'YouTube error. ';
        if (event.data === 2) msg += 'Invalid video ID.';
        else if (event.data === 5) msg += 'HTML5 player cannot play this video.';
        else if (event.data === 100) msg += 'Video not found or private.';
        else if (event.data === 101 || event.data === 150) msg += 'Video owner does not allow embedding.';
        else msg += 'Code: ' + event.data;
        toast(msg, 'error', 6000);
      }
    }
  });
}

/* ── Iframe (Twitch, Vimeo, Facebook, Kick, Rumble, etc.) ── */
function loadIframePlayer(url, platform){
  var host = getHost(); if (!host) return;
  showCurtain('loading', 'Loading…', 'Connecting to ' + platformLabel(platform));
  clearPlayerHost();

  var embed = '';
  if (platform === 'twitch'){
    var ch = extractTwitchChannel(url);
    if (!ch){
      showCurtain('error', 'Invalid Twitch URL', '');
      return;
    }
    var parent = location.hostname || 'localhost';
    embed = 'https://player.twitch.tv/?channel=' +
      encodeURIComponent(ch) + '&parent=' + parent + '&autoplay=true&muted=true';
  } else if (platform === 'vimeo'){
    var vId = extractVimeoId(url);
    if (!vId){
      showCurtain('error', 'Invalid Vimeo URL', '');
      return;
    }
    embed = 'https://player.vimeo.com/video/' + vId + '?autoplay=1&muted=1';
  } else if (platform === 'facebook'){
    embed = buildFacebookEmbed(url);
  } else {
    embed = normalizeEmbedUrl(url, platform);
  }

  var iframe = document.createElement('iframe');
  iframe.src = embed;
  iframe.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media; camera; microphone; clipboard-write';
  iframe.setAttribute('allowfullscreen', '');
  iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
  iframe.style.width = '100%';
  iframe.style.height = '100%';
  iframe.style.border = '0';
  iframe.style.position = 'absolute';
  iframe.style.inset = '0';

  var loaded = false;
  iframe.addEventListener('load', function(){
    if (!loaded){ loaded = true; hideCurtain(); }
  });
  setTimeout(function(){
    if (!loaded){ loaded = true; hideCurtain(); }
  }, 4000);

  host.appendChild(iframe);
}

/* ── Router ── */
function routeToPlayer(url, platform){
  if (!url){
    showCurtain('error', 'No source', 'This item has no playable URL.');
    return;
  }
  platform = platform || detectPlatformFromUrl(url);
  var isLive = (streamData.type === 'live' || streamData.type === 'highlight');

  if (platform === 'youtube') return loadYouTubePlayer(url);
  if (isIframePlatform(platform)) return loadIframePlayer(url, platform);
  if (platform === 'native-dash') return loadDashPlayer(url, isLive);
  if (platform === 'native-mpegts') return loadMpegTsPlayer(url, isLive);
  if (platform === 'video-file') return loadDirectVideoPlayer(url);
  return loadHlsPlayer(url, isLive);
}

/* ═══════════════════════════════════════════════════════════════
   DOUBLE-TAP SEEK
   ═══════════════════════════════════════════════════════════════ */
function wireDoubleTap(){
  var zoneL = $('tapZoneLeft');
  var zoneR = $('tapZoneRight');
  var rippleL = $('tapRippleLeft');
  var rippleR = $('tapRippleRight');
  if (!zoneL || !zoneR) return;

  function handleTap(side){
    var now = Date.now();
    var elapsed = now - tapState.lastTapTime;
    var sameSide = tapState.lastTapSide === side;

    if (elapsed < DOUBLE_TAP_WINDOW && sameSide){
      tapState.lastTapTime = 0;
      tapState.lastTapSide = null;
      if (side === 'left') doSeek(-SEEK_STEP_S, rippleL);
      else doSeek(SEEK_STEP_S, rippleR);
    } else {
      tapState.lastTapTime = now;
      tapState.lastTapSide = side;
    }
  }

  zoneL.addEventListener('click', function(e){ e.stopPropagation(); handleTap('left'); });
  zoneR.addEventListener('click', function(e){ e.stopPropagation(); handleTap('right'); });
}

function doSeek(delta, rippleEl){
  var player = getActivePlayer();
  if (!player) return;
  if (currentPhase === 'live') liveSyncState.lockToLiveEdge = false;

  if (player.type === 'youtube'){
    var cur = player.instance.getCurrentTime() || 0;
    var dur = player.instance.getDuration() || 0;
    var target = cur + delta;
    if (target < 0) target = 0;
    if (dur > 0 && target > dur - 0.5) target = dur - 0.5;
    player.instance.seekTo(target, true);
  } else {
    var v = player.instance;
    var newTime = v.currentTime + delta;
    if (newTime < 0) newTime = 0;
    if (isFinite(v.duration) && v.duration > 0 && newTime > v.duration - 0.5){
      newTime = v.duration - 0.5;
    }
    try { v.currentTime = newTime; } catch(e){}
  }

  if (rippleEl){
    rippleEl.classList.add('show');
    clearTimeout(rippleEl._t);
    rippleEl._t = setTimeout(function(){ rippleEl.classList.remove('show'); }, 500);
  }
  updateJumpLiveButton();
}

function getActivePlayer(){
  if (ytPlayer && ytReady) return { type: 'youtube', instance: ytPlayer };
  var nativeVid = document.getElementById('nativeVideoPlayer');
  if (nativeVid) return { type: 'native', instance: nativeVid };
  return null;
}

/* ═══════════════════════════════════════════════════════════════
   PROGRESS BAR
   ═══════════════════════════════════════════════════════════════ */
function wireProgressBar(){
  var bar = $('progressBar');
  var hover = $('progressHover');
  var pill = $('livePill');
  if (!bar) return;

  function getPercent(e){
    var rect = bar.getBoundingClientRect();
    var x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    return Math.max(0, Math.min(1, x / rect.width));
  }
  function showHoverAt(pct){
    if (!hover) return;
    var dur = getPlayerDuration();
    if (dur <= 0) return;
    hover.textContent = formatTime(pct * dur);
    hover.style.left = (pct * 100) + '%';
  }
  function seekTo(pct){
    var player = getActivePlayer();
    if (!player) return;
    var dur = getPlayerDuration();
    if (dur <= 0) return;
    if (liveSyncState.isLive && pct > 0.985){ seekToLiveEdge(); return; }
    if (currentPhase === 'live') liveSyncState.lockToLiveEdge = false;
    var targetTime = pct * dur;
    if (player.type === 'youtube') player.instance.seekTo(targetTime, true);
    else { try { player.instance.currentTime = targetTime; } catch(e){} }
  }

  var dragging = false;
  function onDown(e){ dragging = true; bar.classList.add('dragging'); var pct = getPercent(e); showHoverAt(pct); updateProgressPreview(pct); }
  function onMove(e){ var pct = getPercent(e); showHoverAt(pct); if (dragging){ e.preventDefault(); updateProgressPreview(pct); } }
  function onUp(e){ if (!dragging) return; dragging = false; bar.classList.remove('dragging'); seekTo(getPercent(e)); }

  bar.addEventListener('mousedown', onDown);
  bar.addEventListener('mousemove', onMove);
  bar.addEventListener('mouseleave', function(){ if (!dragging && hover) hover.style.opacity = 0; });
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  bar.addEventListener('touchstart', function(e){ e.preventDefault(); onDown(e); }, { passive: false });
  bar.addEventListener('touchmove', function(e){ e.preventDefault(); onMove(e); }, { passive: false });
  bar.addEventListener('touchend', function(e){ onUp(e); }, { passive: true });

  if (pill) pill.addEventListener('click', function(){
    if (!pill.disabled) seekToLiveEdge();
  });
}

function updateProgressPreview(pct){
  var played = $('progressPlayed');
  var handle = $('progressHandle');
  if (played) played.style.width = (pct * 100) + '%';
  if (handle) handle.style.left = (pct * 100) + '%';
}

function updateProgressFill(){
  var played = $('progressPlayed');
  var handle = $('progressHandle');
  var curEl = $('timeCurrent');
  var totEl = $('timeTotal');
  var pill = $('livePill');
  if (!played) return;

  var cur = getPlayerCurrentTime();
  var dur = getPlayerDuration();
  var player = getActivePlayer();
  var isNative = player && player.type === 'native';
  var v = isNative ? player.instance : null;

  if (v && v.seekable && v.seekable.length){
    liveSyncState.seekableStart = v.seekable.start(0);
    liveSyncState.seekableEnd = v.seekable.end(v.seekable.length - 1);
  }

  if (dur > 0){
    var pct = (cur / dur) * 100;
    played.style.width = Math.max(0, Math.min(100, pct)) + '%';
    if (handle) handle.style.left = Math.max(0, Math.min(100, pct)) + '%';
  }
  if (curEl) curEl.textContent = formatTime(cur);
  if (totEl) totEl.textContent = dur > 0 ? formatTime(dur) : 'LIVE';

  if (v && v.seekable && v.seekable.length){
    var behind = liveSyncState.seekableEnd - cur;
    liveSyncState.behindLive = behind;
    liveSyncState.isBehindLive = behind > 10;

    if (currentPhase === 'live'
        && liveSyncState.lockToLiveEdge
        && behind > 20
        && !v.paused){
      try {
        v.currentTime = Math.max(0, liveSyncState.seekableEnd - 0.5);
      } catch(e){}
    }
  }

  if (currentPhase === 'live'){
    if (liveSyncState.isBehindLive){
      played.classList.add('behind');
      if (pill){
        pill.className = 'nl-live-pill behind';
        pill.textContent = 'Go Live';
        pill.title = 'Jump back to the live edge';
      }
    } else {
      played.classList.remove('behind');
      if (pill){
        pill.className = 'nl-live-pill live';
        pill.textContent = 'Live';
        pill.title = 'You are at the live edge';
      }
    }
  } else {
    played.classList.remove('behind');
    if (pill) pill.style.display = 'none';
  }
}

function getPlayerCurrentTime(){
  var player = getActivePlayer();
  if (!player) return 0;
  if (player.type === 'youtube'){
    try { return player.instance.getCurrentTime() || 0; } catch(e){ return 0; }
  }
  return player.instance.currentTime || 0;
}

function getPlayerDuration(){
  var player = getActivePlayer();
  if (!player) return 0;
  if (player.type === 'youtube'){
    try { return player.instance.getDuration() || 0; } catch(e){ return 0; }
  }
  var v = player.instance;
  if (liveSyncState.isLive && v.seekable && v.seekable.length){
    return v.seekable.end(v.seekable.length - 1);
  }
  return isFinite(v.duration) ? v.duration : 0;
}

function seekToLiveEdge(){
  var player = getActivePlayer();
  if (!player) return;
  liveSyncState.lockToLiveEdge = true;

  if (player.type === 'youtube'){
    var dur = player.instance.getDuration() || 0;
    if (dur > 0) player.instance.seekTo(dur - 0.5, true);
  } else {
    var v = player.instance;
    if (v.seekable && v.seekable.length){
      var end = v.seekable.end(v.seekable.length - 1);
      try { v.currentTime = Math.max(0, end - 0.5); } catch(e){}
    } else if (isFinite(v.duration) && v.duration > 0){
      try { v.currentTime = v.duration - 0.5; } catch(e){}
    }
  }

  toast('Jumped to live', 'success', 1200);
  updateProgressFill();
  updateJumpLiveButton();
}

/* ═══════════════════════════════════════════════════════════════
   PLAYER CONTROLS
   ═══════════════════════════════════════════════════════════════ */
function wirePlayerControls(){
  var pp = $('ctrlPlayPause');
  var mute = $('ctrlMute');
  var fs = $('ctrlFullscreen');
  var back = $('ctrlSeekBack');
  var fwd = $('ctrlSeekForward');
  var jumpLive = $('ctrlJumpLive');

  if (pp) pp.addEventListener('click', function(){
    var player = getActivePlayer(); if (!player) return;
    if (player.type === 'youtube'){
      var st = player.instance.getPlayerState();

      else player.instance.playVideo();

      if (player.instance.paused) player.instance.play();
      else player.instance.pause();
    }
  });

  if (mute) mute.addEventListener('click', function(){
    var player = getActivePlayer(); if (!player) return;
    if (player.type === 'youtube'){
      if (player.instance.isMuted()){
        player.instance.unMute();
        mute.innerHTML = icon('volume-2');

        mute.innerHTML = icon('volume-x');
      }
    } else {
      player.instance.muted = !player.instance.muted;
      mute.innerHTML = icon(player.instance.muted ? 'volume-x' : 'volume-2');
    }
    refreshIcons();
  });

  if (fs) fs.addEventListener('click', function(){
    var wrap = $('nlPlayer'); if (!wrap) return;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (wrap.requestFullscreen) wrap.requestFullscreen();
    else if (wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
  });

  if (back) back.addEventListener('click', function(){ doSeek(-SEEK_STEP_S, $('tapRippleLeft')); });
  if (fwd) fwd.addEventListener('click', function(){ doSeek(SEEK_STEP_S, $('tapRippleRight')); });
  if (jumpLive) jumpLive.addEventListener('click', seekToLiveEdge);
}

function updateJumpLiveButton(){
  var btn = $('ctrlJumpLive');
  if (!btn) return;
  if (currentPhase !== 'live'){
    btn.classList.remove('show');

  if (!liveSyncState.isBehindLive){

/* ═══════════════════════════════════════════════════════════════
   ADS — loading, picking, playing
   ═══════════════════════════════════════════════════════════════ */
function loadAdsInBackground(){
  var settingsPromise = db.collection(SETTINGS).doc(SETTINGS_DOC).get()
    .then(function(snap){
      if (snap.exists){
        adSettings = Object.assign({}, AD_DEFAULTS, snap.data() || {});
      }
    })
    .catch(function(){});

  var poolPromise = db.collection(ADS).where('active', '==', true).limit(50).get()
    .then(function(snap){
      adPool = { preroll: [], midroll: [], postroll: [] };
      var now = Date.now();

      snap.forEach(function(doc){
        var d = doc.data() || {};
        d.id = doc.id;
        if (d.startDate){
          var s = new Date(d.startDate + 'T00:00').getTime();
          if (!isNaN(s) && now < s) return;
        }
        if (d.endDate){
          var e = new Date(d.endDate + 'T23:59:59').getTime();
          if (!isNaN(e) && now > e) return;
        }
        if (!d.mediaUrl) return;

        var t = d.type || 'any';
        if (t === 'preroll' || t === 'any') adPool.preroll.push(d);
        if (t === 'midroll' || t === 'any') adPool.midroll.push(d);
        if (t === 'postroll' || t === 'any') adPool.postroll.push(d);
      });
    })
    .catch(function(){});

  return Promise.all([settingsPromise, poolPromise]);
}

function getRecentAdIds(slot){
  try {
    var raw = sessionStorage.getItem('nl_recent_ads_' + slot);
    return raw ? JSON.parse(raw) : [];
  } catch(e){ return []; }
}

function setRecentAdIds(slot, arr){
  try {
    sessionStorage.setItem('nl_recent_ads_' + slot, JSON.stringify(arr.slice(-RECENT_ADS_MAX)));
  } catch(e){}
}

function pickAd(slot){
  var pool = adPool[slot] || [];
  if (!pool.length) return null;

  var recent = getRecentAdIds(slot);
  var cap = Math.max(1, pool.length - 1);
  if (recent.length > cap) recent = recent.slice(-cap);

  var fresh = pool.filter(function(ad){ return recent.indexOf(ad.id) === -1; });
  if (!fresh.length){ recent = []; fresh = pool; }

  var total = fresh.reduce(function(sum, ad){ return sum + (ad.weight || 1); }, 0);
  var r = Math.random() * total;
  var acc = 0;
  var picked = fresh[0];
  for (var i = 0; i < fresh.length; i++){
    acc += fresh[i].weight || 1;
    if (r <= acc){ picked = fresh[i]; break; }
  }

  recent.push(picked.id);
  if (recent.length > cap) recent = recent.slice(-cap);
  setRecentAdIds(slot, recent);

  return picked;
}

/* ── Build an ad queue for a given gap duration ── */
function buildAdQueue(slot, gapMs){
  var pool = (adPool[slot] || []).slice();
  if (!pool.length) return [];

  // Shuffle pool (Fisher-Yates)
  for (var i = pool.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }

  var remaining = gapMs;
  var queue = [];
  var usedIds = getRecentAdIds(slot);

  // Greedy fill: pick ads whose duration fits remaining
  var safety = 0;
  while (remaining > 5000 && safety < 30){
    safety++;
    var candidates = pool.filter(function(ad){
      var dur = (parseInt(ad.durationSeconds, 10) || 30) * 1000;
      return dur <= remaining && usedIds.indexOf(ad.id) === -1;
    });

    if (!candidates.length){
      // Allow reuse if nothing left
      candidates = pool.filter(function(ad){
        var dur = (parseInt(ad.durationSeconds, 10) || 30) * 1000;
        return dur <= remaining;
      });
      if (!candidates.length) break;
    }

    // Pick a random candidate
    var pick = candidates[Math.floor(Math.random() * candidates.length)];
    queue.push(pick);
    usedIds.push(pick.id);
    remaining -= (parseInt(pick.durationSeconds, 10) || 30) * 1000;
  }

  // Remember the picks
  usedIds = usedIds.slice(-RECENT_ADS_MAX);
  setRecentAdIds(slot, usedIds);

  // If no ads fit and theme fallback is enabled, we'll handle in caller
  return queue;
}

/* ── Track ad events ── */
function trackAdEvent(ad, type){
  if (!ad || !ad.id) return;
  try {
    var update = {};
    if (type === 'impression') update.impressions = firebase.firestore.FieldValue.increment(1);
    if (type === 'click') update.clicks = firebase.firestore.FieldValue.increment(1);
    db.collection(ADS).doc(ad.id).update(update).catch(function(){});
  } catch(e){}
}

/* ── Clear all ad-related timers ── */
function clearAdTimers(){
  clearInterval(adState.countdownTimerId);
  clearTimeout(adState.skipTimerId);
  clearTimeout(adState.adStartWatchdogId);
  clearTimeout(adState.adHardFallbackId);
  clearTimeout(adState.autoplayRetryId);
}

/* ── Play an ad queue in a gap. Last ad is skippable. ── */
function playAdBreak(slot, onComplete){
  var gapMs = 0;
  var queue = [];

  if (slot === 'gap' && adState.gapEndsAt){
    gapMs = Math.max(0, adState.gapEndsAt - Date.now());
    queue = buildAdQueue('midroll', gapMs);
  } else if (slot === 'preroll' || slot === 'postroll'){
    var single = pickAd(slot);
    queue = single ? [single] : [];
  } else if (slot === 'midroll'){
    var singleMid = pickAd('midroll');
    queue = singleMid ? [singleMid] : [];
  }

  // If nothing fit and we're filling a gap, use theme fallback
  if (!queue.length){
    if (slot === 'gap' && adSettings.themeFallbackEnabled){
      playThemeFallback(gapMs, onComplete);
      return;
    }
    // No ads and no gap — skip ad break entirely
    if (onComplete) onComplete();
    return;
  }

  adState.adQueue = queue;
  adState.currentAdIndex = 0;
  adState.onGapComplete = onComplete;
  playNextAdInQueue();
}

function playNextAdInQueue(){
  var queue = adState.adQueue;
  var idx = adState.currentAdIndex;

  if (idx >= queue.length){
    // Queue done
    if (adState.onGapComplete) adState.onGapComplete();
    return;
  }

  var ad = queue[idx];
  var isLast = (idx === queue.length - 1);

  showSingleAd(ad, isLast, function(){
    adState.currentAdIndex++;
    // Check if we still have time left in the gap
    if (adState.gapEndsAt && Date.now() < adState.gapEndsAt - 3000){
      // Build a new queue to fill remaining time
      var remaining = adState.gapEndsAt - Date.now();
      if (adSettings.themeFallbackEnabled && remaining > 5000){
        playThemeFallback(remaining, adState.onGapComplete);
        return;
      }
    }
    playNextAdInQueue();
  });
}

function showSingleAd(ad, isLastInQueue, onComplete){
  var overlay = $('adOverlay');
  var media = $('adMedia');
  var title = $('adTitle');
  var cta = $('adCta');
  var ctaLabel = $('adCtaLabel');
  var skipBtn = $('adSkip');
  var skipText = $('adSkipText');
  var countdown = $('adCountdown');
  var progressFill = $('adProgressFill');
  var tapOverlay = $('adTap');
  var fsBtn = $('adFullscreen');

  if (!overlay || !media){ if (onComplete) onComplete(); return; }

  var player = $('nlPlayer');
  if (player) player.classList.remove('hide-controls');
  clearAdTimers();
  if (tapOverlay) tapOverlay.classList.remove('show');

  overlay.classList.add('show');
  media.innerHTML = '';
  progressFill.style.width = '0%';

  var skipAfter = parseInt(adSettings.skipAfterSeconds, 10);
  if (isNaN(skipAfter)) skipAfter = 5;

  // Only the LAST ad in the queue is skippable.
  // Skip disabled for all others.
  var skippable = isLastInQueue;
  if (!skippable){
    skipBtn.style.display = 'none';
  } else {
    skipBtn.style.display = '';
  }

  if (fsBtn){
    fsBtn.onclick = function(){
      var wrap = $('nlPlayer'); if (!wrap) return;
      if (document.fullscreenElement) document.exitFullscreen();
      else if (wrap.requestFullscreen) wrap.requestFullscreen();
      else if (wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
    };
  }

  var skipStarted = false;

  function beginSkipCountdown(seconds){
    if (skipStarted) return;
    skipStarted = true;

    if (!skippable){
      skipBtn.style.display = 'none';
      return;
    }
    if (seconds <= 0){
      skipBtn.disabled = false;
      skipText.textContent = 'Skip ad';
      countdown.textContent = '';
      return;
    }
    var remaining = seconds;
    skipBtn.disabled = true;
    skipText.textContent = 'Skip in';
    countdown.textContent = remaining;
    clearInterval(adState.countdownTimerId);
    adState.countdownTimerId = setInterval(function(){
      remaining--;
      if (remaining <= 0){
        clearInterval(adState.countdownTimerId);
        skipBtn.disabled = false;
        skipText.textContent = 'Skip ad';
        countdown.textContent = '';
      } else {
        countdown.textContent = remaining;
      }
    }, 1000);
  }

  function fallbackToHouseAd(){
    media.innerHTML = '';
    media.appendChild(buildHouseAd());
    title.textContent = adSettings.houseAdTitle || 'Advertise on Starlane Stream';
    cta.href = 'mailto:' + (adSettings.houseAdUrl || 'ads@starlanestream.com').replace('mailto:', '');
    ctaLabel.textContent = adSettings.houseAdCtaLabel || 'Advertise here';
    beginSkipCountdown(skipAfter);
  }

  function attachRobustVideoPlayback(vid){
    vid.muted = false;
    var tryPlay = function(attempt){
      var p = vid.play();
      if (p && typeof p.then === 'function'){
        p.then(function(){
          if (vid.muted) vid.muted = false;
        }).catch(function(){
          if (attempt === 1){
            vid.muted = true;
            adState.autoplayRetryId = setTimeout(function(){ tryPlay(2); }, 200);
          } else {
            if (tapOverlay){
              tapOverlay.classList.add('show');
              tapOverlay.onclick = function(){
                tapOverlay.classList.remove('show');
                try { vid.muted = false; } catch(e){}
                try { vid.play().catch(function(){}); } catch(e){}
              };
            }
            beginSkipCountdown(0);
          }
        });
      }
    };
    tryPlay(1);
  }

  function bindGlobalUnmute(){
    if (_nlUnmuteBound) return;
    _nlUnmuteBound = true;
    document.addEventListener('click', function unmuteOnce(){
      var adVid = document.querySelector('#adMedia video');
      if (adVid && adVid.muted){
        try { adVid.muted = false; } catch(e){}
      }
      document.removeEventListener('click', unmuteOnce);
    }, { once: true });
  }

  title.textContent = ad.title || 'Advertisement';
  cta.href = ad.clickUrl || '#';
  ctaLabel.textContent = ad.ctaLabel || 'Learn more';

  var durationSec = parseInt(ad.durationSeconds, 10) || 0;

  if (ad.mediaType === 'video' && ad.mediaUrl){
    var vid = document.createElement('video');
    vid.src = ad.mediaUrl;
    vid.autoplay = true;
    vid.muted = false;
    vid.playsInline = true;
    vid.preload = 'auto';
    vid.setAttribute('playsinline', '');
    media.appendChild(vid);

    vid.addEventListener('timeupdate', function(){
      if (vid.duration){
        progressFill.style.width = ((vid.currentTime / vid.duration) * 100) + '%';
      }
    });
    vid.addEventListener('ended', function(){
      hideAd();
      if (onComplete) onComplete();
    });
    vid.addEventListener('error', function(){ fallbackToHouseAd(); });
    vid.addEventListener('playing', function(){ beginSkipCountdown(skipAfter); });

    adState.adStartWatchdogId = setTimeout(function(){
      if (!skipStarted){
        if (vid.readyState >= 2 && !vid.paused) beginSkipCountdown(skipAfter);
        else fallbackToHouseAd();
      }
    }, AD_START_TIMEOUT_MS);

    adState.adHardFallbackId = setTimeout(function(){
      if (!skipStarted){
        if (vid && !vid.paused && vid.readyState >= 2) beginSkipCountdown(skipAfter);
      }
    }, AD_HARD_FALLBACK_MS);

    attachRobustVideoPlayback(vid);
    bindGlobalUnmute();
  } else if (ad.mediaUrl){
    // Image ad
    var img = document.createElement('img');
    img.src = ad.mediaUrl;
    img.alt = ad.title || 'Ad';
    img.addEventListener('load', function(){ beginSkipCountdown(skipAfter); });
    img.addEventListener('error', function(){ fallbackToHouseAd(); });
    media.appendChild(img);

    // Auto-advance after duration
    if (durationSec > 0){
      setTimeout(function(){
        hideAd();
        if (onComplete) onComplete();
      }, durationSec * 1000);
    }
  } else {
    media.appendChild(buildHouseAd());
    beginSkipCountdown(skipAfter);
  }

  trackAdEvent(ad, 'impression');

  cta.onclick = function(){ trackAdEvent(ad, 'click'); };
  skipBtn.onclick = function(){
    if (skipBtn.disabled) return;
    hideAd();
    if (onComplete) onComplete();
  };
  refreshIcons();
}
