/* ═══════════════════════════════════════════════════════════════
   MIDROLL — for movies/shows, ad gaps fire at specific minutes
   ═══════════════════════════════════════════════════════════════ */
function setupMidrollTimer(){
  clearTimeout(adState.midrollTimerId);
  if (!adSettings.midrollEnabled) return;
  if (streamData.midrollEnabled === false) return;
  if (currentPhase !== 'live') return;

  // For movies/shows with adGaps array
  if ((streamData.type === 'movie' || streamData.type === 'show') && Array.isArray(streamData.adGaps)){
    var gaps = streamData.adGaps.slice().sort(function(a, b){ return a - b; });
    if (!gaps.length) return;

    // Track which gaps have fired
    if (!streamData._firedGaps) streamData._firedGaps = {};
    var currentTime = getPlayerCurrentTime() / 60; // in minutes

    for (var i = 0; i < gaps.length; i++){
      var gapMin = gaps[i];
      if (streamData._firedGaps[gapMin]) continue;
      if (currentTime >= gapMin - 0.5 && currentTime < gapMin + 2){
        streamData._firedGaps[gapMin] = true;
        fireMidrollGap();
        return;
      }
    }

    // Schedule next check
    adState.midrollTimerId = setTimeout(setupMidrollTimer, 2000);
    return;
  }

  // For live streams with midrollMinute
  var midMin = parseInt(streamData.midrollMinute, 10) || adSettings.midrollMinute || 30;
  var active = getActiveSegment();
  if (!active) return;

  if (adState.firedMidrollForSegment !== active.index){
    adState.firedMidroll = false;
    adState.firedMidrollForSegment = active.index;
  }
  if (adState.firedMidroll) return;

  var fireAt = active.seg.startMs + (midMin * 60000);
  var delay = Math.max(0, fireAt - Date.now());
  adState.midrollTimerId = setTimeout(function(){
    adState.firedMidroll = true;
    if (currentPhase === 'live') fireMidrollGap();
  }, delay);
}

function fireMidrollGap(){
  // Simple midroll: play a single midroll ad, then resume
  var player = getActivePlayer();
  var wasPaused = false;

  if (player){
    if (player.type === 'youtube'){
      try { player.instance.pauseVideo(); } catch(e){}
    } else {
      try { wasPaused = player.instance.paused; player.instance.pause(); } catch(e){}
    }
  }

  playAdBreak('midroll', function(){
    if (player && !wasPaused){
      if (player.type === 'youtube'){
        try { player.instance.playVideo(); } catch(e){}
      } else {
        try { player.instance.play().catch(function(){}); } catch(e){}
      }
    }
    // Re-schedule for next gap
    setTimeout(setupMidrollTimer, 1000);
  });
}

/* ═══════════════════════════════════════════════════════════════
   GAP ADS — when between scheduled segments, or between episodes
   ═══════════════════════════════════════════════════════════════ */
function startGapAdLoop(endMs){
  clearTimeout(gapAdTimer);
  clearTimeout(gapAdRetryTimer);
  if (isOffline) return;

  adState.gapEndsAt = endMs || Date.now() + 60000;

  var remaining = adState.gapEndsAt - Date.now();
  if (remaining <= 3000){
    stopGapAdLoop();
    return;
  }

  playAdBreak('gap', function(){
    // Queue done; check if still in gap
    if (Date.now() < adState.gapEndsAt - 3000){
      // Still time left, loop again
      gapAdTimer = setTimeout(function(){
        startGapAdLoop(adState.gapEndsAt);
      }, 500);
    } else {
      stopGapAdLoop();
      decideAndPlay();
    }
  });
}

function stopGapAdLoop(){
  clearTimeout(gapAdTimer);
  clearTimeout(gapAdRetryTimer);
  adState.gapAdActive = false;
  adState.gapEndsAt = 0;
}

/* ═══════════════════════════════════════════════════════════════
   SEGMENT END + UP NEXT
   ═══════════════════════════════════════════════════════════════ */
function handleSegmentEnd(){
  if (streamData.type === 'show'){
    handleEpisodeEnd();
    return;
  }

  var phase = computePhase();
  if (phase === 'gap'){ decideAndPlay(); return; }
  if (phase === 'ended'){ decideAndPlay(); return; }
  if (phase === 'live'){
    var segs = getSegments();
    var active = getActiveSegment();
    if (active && active.index < segs.length - 1){
      currentLoadedSegmentIndex = -1;
      decideAndPlay();
    }
  }
}

/* ── Show episode ending → auto-advance ── */
function handleEpisodeEnd(){
  if (!Array.isArray(streamData.episodes)) return;
  if (currentEpisodeIndex >= streamData.episodes.length - 1){
    // Last episode — show ended state
    showCurtain('ended', 'End of series', 'You\'ve finished the last available episode.');
    return;
  }

  var nextEp = streamData.episodes[currentEpisodeIndex + 1];
  showUpNextForEpisode(nextEp, currentEpisodeIndex + 1);
}

var upNextState = { targetIndex: null, targetStream: null, countdown: 5, timer: null };

function showUpNextForEpisode(ep, index){
  upNextState.targetIndex = index;
  upNextState.targetStream = null;
  upNextState.countdown = 5;

  var overlay = $('upNextOverlay');
  var titleEl = $('unTitle');
  var metaEl = $('unMeta');
  var countEl = $('unCount');
  if (!overlay) return;

  if (titleEl) titleEl.textContent = ep.title || ('Episode ' + (index + 1));
  if (metaEl){
    var s = parseInt(ep.seasonNumber, 10);
    var e = parseInt(ep.episodeNumber, 10);
    metaEl.textContent = (s ? 'S' + s + ' · ' : '') + 'Episode ' + (e || (index + 1));
  }
  if (countEl) countEl.textContent = String(upNextState.countdown);

  overlay.classList.add('show');
  clearInterval(upNextState.timer);
  upNextState.timer = setInterval(function(){
    upNextState.countdown--;
    if (countEl) countEl.textContent = String(Math.max(0, upNextState.countdown));
    if (upNextState.countdown <= 0){
      clearInterval(upNextState.timer);
      goToNextEpisode();
    }
  }, 1000);
  refreshIcons();
}

function goToNextEpisode(){
  hideUpNext();
  if (upNextState.targetIndex === null) return;
  currentEpisodeIndex = upNextState.targetIndex;
  currentLoadedSegmentIndex = -1;
  var segs = getSegments();
  if (segs[0]) loadSegment({ seg: segs[0], index: 0 });
  renderEpisodePanel();
  updateEpisodeHeader();
}

function hideUpNext(){
  var overlay = $('upNextOverlay');
  if (overlay) overlay.classList.remove('show');
  clearInterval(upNextState.timer);
}

function wireUpNextControls(){
  var skipNow = $('unSkipNow');
  var cancel = $('unCancel');
  if (skipNow) skipNow.addEventListener('click', goToNextEpisode);
  if (cancel) cancel.addEventListener('click', function(){
    hideUpNext();
    toast('Staying on current episode', 'info', 2200);
  });
}

/* ═══════════════════════════════════════════════════════════════
   LOAD A SEGMENT / EPISODE
   ═══════════════════════════════════════════════════════════════ */
function loadSegment(active){
  var url = (active && active.seg && active.seg.url) || '';
  if (!url){
    showCurtain('error', 'No source', 'This item has no playable URL.');
    return;
  }
  var platform = (active && active.seg && active.seg.platform) || detectPlatformFromUrl(url);
  routeToPlayer(url, platform);
}

/* ═══════════════════════════════════════════════════════════════
   DECIDE AND PLAY — main flow
   ═══════════════════════════════════════════════════════════════ */
function decideAndPlay(){
  var phase = computePhase();
  currentPhase = phase;

  // ── MOVIES / SHOWS: always playable now ──
  if (streamData.type === 'movie' || streamData.type === 'show'){
    mode = 'normal';
    hideCurtain();
    liveSyncState.lockToLiveEdge = false;
    liveSyncState.isLive = false;
    renderPhaseUI();

    // Preroll (movies/shows)
    if (adSettings.prerollEnabled
        && streamData.prerollEnabled !== false
        && !adState.firedPreroll
        && (adPool.preroll.length)){
      adState.firedPreroll = true;
      playAdBreak('preroll', function(){
        playCurrentItem();
      });
      return;
    }
    playCurrentItem();
    return;
  }

  // ── LIVE / HIGHLIGHT ──
  if (phase === 'upcoming'){
    hideUpNext();
    mode = 'gap-ads';
    showCountdownCurtain();
    renderPhaseUI();
    updateCountdownPill();
    updateQueueBanner();
    return;
  }

  if (phase === 'live'){
    hideUpNext();
    mode = 'normal';
    hideCurtain();
    updateQueueBanner();
    liveSyncState.lockToLiveEdge = true;

    var active = getActiveSegment();
    if (active){
      if (currentLoadedSegmentIndex !== active.index){
        currentLoadedSegmentIndex = active.index;
        loadSegment(active);
      }
    }
    renderPhaseUI();
    updateCountdownPill();

    if (adSettings.prerollEnabled
        && streamData.prerollEnabled !== false
        && !adState.firedPreroll
        && (adPool.preroll.length || adPool.midroll.length)){
      adState.firedPreroll = true;
      playAdBreak('preroll', function(){});
    }

    setupMidrollTimer();
    return;
  }

  if (phase === 'gap'){
    mode = 'gap-ads';
    clearPlayerHost();
    var nextSeg = getNextSegment();
    if (nextSeg){
      var gapEnd = nextSeg.seg.startMs;
      startGapAdLoop(gapEnd);
    }
    renderPhaseUI();
    updateCountdownPill();
    return;
  }

  if (phase === 'replay'){
    mode = 'normal';
    hideCurtain();
    hideQueueBanner();
    liveSyncState.lockToLiveEdge = false;
    liveSyncState.isLive = false;
    var segs = getSegments();
    var last = segs[segs.length - 1];
    if (last && currentLoadedSegmentIndex !== segs.length - 1){
      currentLoadedSegmentIndex = segs.length - 1;
      loadSegment({ seg: last, index: segs.length - 1 });
    }
    renderPhaseUI();
    updateCountdownPill();
    return;
  }

  if (phase === 'ended'){
    mode = 'idle';
    stopGapAdLoop();
    showIdleOverlay();
    return;
  }
}

function playCurrentItem(){
  var segs = getSegments();
  if (!segs.length){
    showCurtain('error', 'No source', 'Nothing to play.');
    return;
  }
  currentLoadedSegmentIndex = 0;
  loadSegment({ seg: segs[0], index: 0 });
}

/* ═══════════════════════════════════════════════════════════════
   IDLE OVERLAY
   ═══════════════════════════════════════════════════════════════ */
function showIdleOverlay(){
  var idle = $('idleOverlay');
  if (idle) idle.classList.add('show');
  hideCurtain();
  clearPlayerHost();
}

/* ═══════════════════════════════════════════════════════════════
   EPISODE PICKER (for shows)
   ═══════════════════════════════════════════════════════════════ */
function renderEpisodePanel(){
  if (streamData.type !== 'show') return;
  var panel = $('episodePanel');
  if (!panel) return;

  var episodes = Array.isArray(streamData.episodes) ? streamData.episodes : [];
  var seasonNums = [];
  episodes.forEach(function(ep){
    var s = parseInt(ep.seasonNumber, 10) || 1;
    if (seasonNums.indexOf(s) === -1) seasonNums.push(s);
  });
  seasonNums.sort(function(a, b){ return a - b; });

  // Season tabs
  var seasonTabsHTML = '';
  if (seasonNums.length > 1){
    seasonTabsHTML = '<div class="season-picker" id="seasonPicker">';
    seasonNums.forEach(function(s){
      var active = s === currentSeason ? ' active' : '';
      seasonTabsHTML += '<button class="season-btn'+active+'" data-season="'+s+'" type="button">Season '+s+'</button>';
    });
    seasonTabsHTML += '</div>';
  }

  // Episode list for current season
  var filtered = episodes.filter(function(ep){
    return (parseInt(ep.seasonNumber, 10) || 1) === currentSeason;
  });
  filtered.sort(function(a, b){
    return (parseInt(a.episodeNumber, 10) || 0) - (parseInt(b.episodeNumber, 10) || 0);
  });

  var listHTML = '';
  filtered.forEach(function(ep){
    var globalIdx = episodes.indexOf(ep);
    var isActive = globalIdx === currentEpisodeIndex;
    var title = ep.title || ('Episode ' + (ep.episodeNumber || (globalIdx + 1)));
    var dur = parseInt(ep.durationMinutes, 10) || 45;
    listHTML +=
      '<a href="#" class="episode-item' + (isActive ? ' active' : '') + '" data-episode-idx="' + globalIdx + '">' +
        '<div class="episode-num">' + (ep.episodeNumber || (globalIdx + 1)) + '</div>' +
        '<div class="episode-info">' +
          '<div class="episode-title">' + esc(title) + '</div>' +
          '<div class="episode-meta">' + dur + ' min' + (ep.platform ? ' · ' + esc(platformLabel(ep.platform)) : '') + '</div>' +
        '</div>' +
      '</a>';
  });

  panel.innerHTML =
    '<div class="episode-head">' +
      '<h3>' + icon('layers') + ' Episodes</h3>' +
      seasonTabsHTML +
    '</div>' +
    '<div class="episode-list">' + listHTML + '</div>';

  // Wire season tabs
  var seasonPicker = $('seasonPicker');
  if (seasonPicker){
    seasonPicker.querySelectorAll('.season-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        currentSeason = parseInt(btn.dataset.season, 10) || 1;
        renderEpisodePanel();
      });
    });
  }

  // Wire episode clicks
  panel.querySelectorAll('.episode-item').forEach(function(item){
    item.addEventListener('click', function(e){
      e.preventDefault();
      var idx = parseInt(item.dataset.episodeIdx, 10);
      if (isNaN(idx)) return;
      currentEpisodeIndex = idx;
      currentLoadedSegmentIndex = -1;
      var segs = getSegments();
      if (segs[0]) loadSegment({ seg: segs[0], index: 0 });
      renderEpisodePanel();
      updateEpisodeHeader();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  refreshIcons();
}

function updateEpisodeHeader(){
  if (streamData.type !== 'show') return;
  var ep = streamData.episodes[currentEpisodeIndex];
  if (!ep) return;
  var titleEl = document.querySelector('.pg-title');
  if (titleEl){
    var s = parseInt(ep.seasonNumber, 10) || 1;
    var e = parseInt(ep.episodeNumber, 10) || (currentEpisodeIndex + 1);
    titleEl.textContent = (streamData.title || 'Show') + ' · S' + s + 'E' + e;
  }
}

/* ═══════════════════════════════════════════════════════════════
   TICKERS
   ═══════════════════════════════════════════════════════════════ */
function startTickers(){
  clearInterval(countdownTimer);
  clearInterval(phaseTickTimer);
  clearInterval(progressTickTimer);
  clearInterval(idleCheckTimer);

  countdownTimer = setInterval(function(){
    updateCountdownPill();
    updateCurtainCountdown();
    if (mode === 'gap-ads' && adState.gapEndsAt){
      var qbTime = $('qbTime');
      if (qbTime){
        qbTime.textContent = formatDurationShort(adState.gapEndsAt - Date.now());
      }
    }
  }, 1000);

  progressTickTimer = setInterval(function(){
    updateProgressFill();
    if (streamData && (streamData.type === 'movie' || streamData.type === 'show')){
      setupMidrollTimer();
    }
  }, 1500);

  phaseTickTimer = setInterval(function(){
    if (streamData.type === 'movie' || streamData.type === 'show') return;
    var newPhase = computePhase();
    if (currentPhase === 'gap' && newPhase === 'live'){
      decideAndPlay();
      return;
    }
    if (newPhase === 'live'){
      var active = getActiveSegment();
      if (active && currentLoadedSegmentIndex !== active.index){
        decideAndPlay();
        return;
      }
    }
    if (newPhase !== currentPhase){
      currentPhase = newPhase;
      renderPhaseUI();
      updateCountdownPill();
      decideAndPlay();
    }
  }, 3000);
}

/* ═══════════════════════════════════════════════════════════════
   PHASE UI
   ═══════════════════════════════════════════════════════════════ */
function renderPhaseUI(){
  var liveTag = $('playerLiveTag');
  var crumbLive = $('crumbLivePill');
  if (currentPhase === 'live' && streamData.type !== 'movie' && streamData.type !== 'show'){
    if (liveTag) liveTag.style.display = 'inline-flex';
    if (crumbLive) crumbLive.style.display = 'inline-flex';
  } else {
    if (liveTag) liveTag.style.display = 'none';
    if (crumbLive) crumbLive.style.display = 'none';
  }
  updateJumpLiveButton();
}

function updateCountdownPill(){
  var pill = $('cdPill');
  var text = $('cdText');
  var lbl = $('cdLbl');
  if (!pill || !text) return;

  if (mode === 'gap-ads' && adState.gapEndsAt){
    var diff = Math.max(0, adState.gapEndsAt - Date.now());
    var s = Math.floor(diff / 1000);
    var d = Math.floor(s / 86400);
    var h = Math.floor((s % 86400) / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    var str = (d > 0 ? d + 'd ' : '') + String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
    if (lbl) lbl.textContent = 'Next in';
    text.textContent = str;
    pill.classList.add('show');
    return;
  }

  if (currentPhase === 'upcoming'){
    var t = getTiming();
    if (!t.valid) return;
    var diff3 = Math.max(0, t.startMs - Date.now());
    var s3 = Math.floor(diff3 / 1000);
    var d3 = Math.floor(s3 / 86400);
    var h3 = Math.floor((s3 % 86400) / 3600);
    var m3 = Math.floor((s3 % 3600) / 60);
    var sec3 = s3 % 60;
    var str3 = (d3 > 0 ? d3 + 'd ' : '') + String(h3).padStart(2,'0') + ':' + String(m3).padStart(2,'0') + ':' + String(sec3).padStart(2,'0');
    if (lbl) lbl.textContent = 'Live in';
    text.textContent = str3;
    pill.classList.add('show');
    return;
  }
  pill.classList.remove('show');
}

/* ═══════════════════════════════════════════════════════════════
   SIBLING ROW
   ═══════════════════════════════════════════════════════════════ */
function renderSiblings(){
  var row = $('siblingsRow');
  if (!row || !relatedContent.length) return;
  row.innerHTML = '';
  relatedContent.forEach(function(s){
    var card = document.createElement('div');
    card.className = 'sibling-card';
    var title = s.title || s.streamTitle || s.eventName || 'Untitled';
    var badge = 'upcoming', badgeLabel = 'Upcoming';
    var sType = s.type || 'live';

    if (sType === 'movie'){ badge = 'replay'; badgeLabel = 'Movie'; }
    else if (sType === 'show'){ badge = 'replay'; badgeLabel = 'Show'; }
    else if (s.startDate){
      var startMs = new Date(s.startDate + 'T' + (s.startTime || '00:00')).getTime();
      if (Date.now() < startMs){ badge = 'upcoming'; badgeLabel = 'Upcoming'; }
      else { badge = 'live'; badgeLabel = 'Live'; }
    }

    var thumbStyle = s.posterUrl || s.heroImage
      ? "background-image:url('" + esc(s.posterUrl || s.heroImage) + "');background-size:cover;background-position:center;"
      : '';

    card.innerHTML =
      '<div class="sibling-thumb" style="' + thumbStyle + '">' +
        '<span class="sibling-badge ' + badge + '">' + esc(badgeLabel) + '</span>' +
      '</div>' +
      '<div class="sibling-body">' +
        '<div class="sibling-title">' + esc(title) + '</div>' +
        '<div class="sibling-meta">' + icon('calendar') + '<span>' + esc(s.startDate ? formatDate(s.startDate, s.startTime) : (s.genre || 'On demand')) + '</span></div>' +
      '</div>';

    card.addEventListener('click', function(){
      window.location.href = 'watch-847291563.html?id=' + encodeURIComponent(s.id);
    });
    row.appendChild(card);
  });
  refreshIcons();
}

   OWNER CONTROLS
   ═══════════════════════════════════════════════════════════════ */
function renderOwnerControls(){
  var card = $('ownerCard');
  if (!card || !streamData) return;
  card.style.display = (isAdminUser) ? 'block' : 'none';
  if (!isAdminUser) return;

  var edit = $('editStreamBtn');
  if (edit){
    edit.setAttribute('href', 'admin-streams-582910374.html?id=' + encodeURIComponent(streamId));
  }

  var del = $('deleteStreamBtn');
  if (del && !del._bound){
    del._bound = true;
    del.addEventListener('click', function(){
      if (!confirm('Delete this content permanently?')) return;
      del.disabled = true;
      db.collection(STREAMS).doc(streamId).delete()
        .then(function(){
          toast('Deleted.', 'success');
          setTimeout(function(){ window.location.href = 'streams.html'; }, 800);
        })
        .catch(function(err){
          toast('Delete failed: ' + err.message, 'error', 5000);
          del.disabled = false;
        });
    });
  }
}

/* ═══════════════════════════════════════════════════════════════
   NETWORK
   ═══════════════════════════════════════════════════════════════ */
function wireNetworkListeners(){
  if (wireNetworkListeners._bound) return;
  wireNetworkListeners._bound = true;
  window.addEventListener('offline', function(){
    isOffline = true;
    var ov = $('offlineOverlay');
    if (ov) ov.classList.add('show');
    var player = getActivePlayer();
    if (player){
      if (player.type === 'youtube'){ try { player.instance.pauseVideo(); } catch(e){} }
      else { try { player.instance.pause(); } catch(e){} }
    }
  });
  window.addEventListener('online', function(){
    isOffline = false;
    var ov = $('offlineOverlay');
    if (ov) ov.classList.remove('show');
    toast('Back online', 'success', 2000);
    decideAndPlay();
  });
  if (!navigator.onLine){
    var ov = $('offlineOverlay');
    if (ov) ov.classList.add('show');
  }
}

/* ═══════════════════════════════════════════════════════════════
   LOAD FROM FIRESTORE
   ═══════════════════════════════════════════════════════════════ */
function loadStream(){
  streamId = getParam('id');
  if (!streamId){
    renderError('No content specified', 'This page needs a content ID.');
    return;
  }

  if (!firebaseReady || !db){
    renderError('Firebase not configured', 'Add your Starlane Firebase config.');
    return;
  }

  db.collection(STREAMS).doc(streamId).get()
    .then(function(doc){
      if (!doc.exists){
        renderError('Not found', 'This content may have been removed.');
        return;
      }
      streamData = doc.data() || {};
      streamData.id = doc.id;
      if (streamData._firedGaps){ /* reset local state each load */ }
      streamData._firedGaps = {};

      // Init show episode index
      if (streamData.type === 'show'){
        if (!Array.isArray(streamData.episodes) || !streamData.episodes.length){
          renderError('Show has no episodes', 'This series has no episodes yet.');
          return;
        }
        currentEpisodeIndex = 0;
        currentSeason = parseInt(streamData.episodes[0].seasonNumber, 10) || 1;
      }

      currentPhase = computePhase();

      // Load related content
      db.collection(STREAMS).limit(20).get().then(function(snap){
        relatedContent = [];
        snap.forEach(function(s){
          if (s.id !== streamId){
            var d = s.data() || {};
            d.id = s.id;
            relatedContent.push(d);
          }
        });
        // Shuffle and take 8
        for (var i = relatedContent.length - 1; i > 0; i--){
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = relatedContent[i]; relatedContent[i] = relatedContent[j]; relatedContent[j] = tmp;
        }
        relatedContent = relatedContent.slice(0, 8);
        renderPage();
      }).catch(function(){
        renderPage();
      });
    })
    .catch(function(err){
      console.error('[load stream]', err);
      renderError('Could not load', err.message || 'Please try again.');
    });
}

document.addEventListener('DOMContentLoaded', function(){
  refreshIcons();

  var signinBtn = $('signinBtn');
  if (signinBtn){
    signinBtn.addEventListener('click', function(){
      window.location.href = 'auth.html?redirect=' + encodeURIComponent(location.pathname + location.search);
    });
  }

  var userChip = $('userChip');
  if (userChip){
    userChip.addEventListener('click', function(){
      if (!currentUser) return;
      if (confirm('Sign out of ' + (currentUser.email || 'your account') + '?')){
        auth.signOut().then(function(){ toast('Signed out.', 'success'); });
      }
    });
  }

  if (!firebaseReady || !auth){
    renderError('Firebase not configured', 'Add your Starlane Firebase config.');
    return;
  }

  auth.onAuthStateChanged(function(user){
    applyAuth(user);
    if (!streamData){
      loadStream();
    }
  });
});

window.addEventListener('beforeunload', function(){
  if (countdownTimer) clearInterval(countdownTimer);
  if (phaseTickTimer) clearInterval(phaseTickTimer);
  if (progressTickTimer) clearInterval(progressTickTimer);
  if (autoplayRetryTimer) clearInterval(autoplayRetryTimer);
  if (liveCheckTimer) clearInterval(liveCheckTimer);
  if (controlsHideTimer) clearTimeout(controlsHideTimer);
  if (gapAdTimer) clearTimeout(gapAdTimer);
  if (gapAdRetryTimer) clearTimeout(gapAdRetryTimer);
  if (idleCheckTimer) clearInterval(idleCheckTimer);
  if (upNextState.timer) clearInterval(upNextState.timer);
  clearTimeout(adState.midrollTimerId);
  try { clearAdTimers(); } catch(e){}
});

})();
</script>
