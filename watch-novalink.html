<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Watch · Starlane Stream</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  :root{
    --red:#E50914; --red-hover:#FF3B4E;
    --bg:#050508; --text:#fff;
    --text-2:rgba(255,255,255,.75); --text-3:rgba(255,255,255,.5);
    --green:#10B981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(ellipse at 50% 0%, rgba(229,9,20,.08), transparent 55%), #050508;
    color: var(--text);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .hidden { display: none !important; }
  .stage { max-width: 1100px; width: 100%; text-align: center; }

  .spinner {
    width: 44px; height: 44px;
    border: 4px solid rgba(255,255,255,.1);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin .9s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-state h2 { font-size: 18px; font-weight: 700; color: var(--text-2); }

  .player-wrap {
    position: relative; background: #000;
    border-radius: 14px; overflow: hidden;
    aspect-ratio: 16/9;
    border: 1px solid rgba(255,255,255,.08);
  }
  .player-wrap video {
    width: 100%; height: 100%; display: block;
    object-fit: contain; background: #000;
  }
  .unmute-btn {
    position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.75);
    border: 1px solid rgba(255,255,255,.25);
    color: #fff; padding: 12px 22px;
    border-radius: 999px; font-size: 14px; font-weight: 800;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: background .2s, border-color .2s;
    z-index: 5;
  }
  .unmute-btn:hover { background: var(--red); border-color: var(--red); }
  .welcome-bar { margin-bottom: 14px; font-size: 13px; color: var(--text-3); font-weight: 600; }
  .welcome-bar strong { color: var(--green); }

  .paywall-icon {
    width: 72px; height: 72px; border-radius: 50%;
    background: rgba(229,9,20,.12);
    border: 2px solid rgba(229,9,20,.3);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px; font-size: 32px;
  }
  .paywall h1 { font-size: clamp(1.4rem, 4vw, 2rem); margin-bottom: 10px; }
  .paywall p {
    color: var(--text-3); font-size: 15px; line-height: 1.6;
    max-width: 480px; margin: 0 auto 24px;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 14px 26px; border-radius: 999px;
    font-size: 15px; font-weight: 900;
    text-decoration: none; border: none; cursor: pointer;
    font-family: inherit; transition: all .2s;
  }
  .btn.primary { background: var(--red); color: #fff; box-shadow: 0 10px 28px rgba(229,9,20,.4); }
  .btn.primary:hover { background: var(--red-hover); transform: translateY(-2px); }
  .btn.ghost {
    background: rgba(255,255,255,.06); color: #fff;
    border: 1px solid rgba(255,255,255,.14);
  }
  .btn.ghost:hover { background: rgba(255,255,255,.12); }
  .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>

<div class="stage">

  <div id="loading-state">
    <div class="spinner"></div>
    <h2>Verifying your ticket…</h2>
  </div>

  <div id="video-state" class="hidden">
    <div class="welcome-bar" id="welcome-bar"></div>
    <div class="player-wrap">
      <video id="live-stream" playsinline controls muted autoplay></video>
      <button id="unmute-btn" class="unmute-btn" type="button">🔊 Tap to unmute</button>
    </div>
  </div>

  <div id="paywall-state" class="paywall hidden">
    <div class="paywall-icon" id="paywall-icon">🔒</div>
    <h1 id="paywall-title">Access denied</h1>
    <p id="paywall-message">You need a valid Novalink ticket to watch this stream.</p>
    <div class="btn-row" id="paywall-actions"></div>
  </div>

</div>

<script>
(function(){
  'use strict';

  /* ══════════════════════════════════════════════════════════════
     CONFIG — the ONE thing you edit per event
     ══════════════════════════════════════════════════════════════
     Map the URL slug (the part after /live/) to the actual stream URL.

     Example:
       Buyer lands on /live/boksburg-jazz?ticketRef=NL-ABCD
       → slug is "boksburg-jazz"
       → streamUrl resolves to the HLS URL below
  */
  var STREAM_MAP = {
    'boksburg-jazz':  'https://your-cdn.com/boksburg-jazz.m3u8',
    'cape-town-comedy': 'https://your-cdn.com/cape-town-comedy.m3u8'
  };

  /* Fallback for the root path /?ticketRef= (single-event mode) */
  var DEFAULT_STREAM_URL = '';

  /* ══════════════════════════════════════════════════════════════ */

  var VERIFY_ENDPOINT = 'https://novalink-api-8vfg.onrender.com/api/verify-stream';
  var CACHE_PREFIX = 'starlane_verified_';
  var CACHE_TTL_MS = 6 * 60 * 60 * 1000; // 6 hours — covers any event

  var loadingState   = document.getElementById('loading-state');
  var videoState     = document.getElementById('video-state');
  var paywallState   = document.getElementById('paywall-state');
  var paywallTitle   = document.getElementById('paywall-title');
  var paywallIcon    = document.getElementById('paywall-icon');
  var paywallMessage = document.getElementById('paywall-message');
  var paywallActions = document.getElementById('paywall-actions');
  var welcomeBar     = document.getElementById('welcome-bar');
  var videoEl        = document.getElementById('live-stream');
  var unmuteBtn      = document.getElementById('unmute-btn');

  function show(el){ el.classList.remove('hidden'); }
  function hide(el){ el.classList.add('hidden'); }

  function escapeHtml(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  /* Resolve the stream URL from the current path. Handles:
       /live/boksburg-jazz  → look up "boksburg-jazz"
       /live/boksburg-jazz.html → same
       /                    → DEFAULT_STREAM_URL
  */
  function resolveStreamUrl(){
    var path = window.location.pathname || '/';
    var m = path.match(/^\/live\/([^\/]+?)(?:\.html)?\/?$/i);
    if (m && STREAM_MAP[m[1]]) return STREAM_MAP[m[1]];
    return DEFAULT_STREAM_URL;
  }

  function showError(title, message, opts){
    opts = opts || {};
    hide(loadingState); hide(videoState); show(paywallState);
    paywallIcon.textContent   = opts.icon || '🔒';
    paywallTitle.textContent  = title;
    paywallMessage.textContent = message;

    if (opts.showRetry){
      paywallActions.innerHTML =
        '<button type="button" class="btn primary" id="retry-btn">Try again</button>' +
        '<a href="https://novalink-tickets.onrender.com/events.html" class="btn ghost">Buy a ticket</a>';
      document.getElementById('retry-btn').addEventListener('click', boot);
    } else if (opts.showBuy){
      paywallActions.innerHTML =
        '<a href="https://novalink-tickets.onrender.com/events.html" class="btn primary">Buy a ticket on Novalink</a>';
    } else {
      paywallActions.innerHTML = '';
    }
  }

  function getCached(ticketRef){
    try {
      var raw = sessionStorage.getItem(CACHE_PREFIX + ticketRef);
      if (!raw) return null;
      var data = JSON.parse(raw);
      if (!data || !data.verifiedAt) return null;
      if (Date.now() - data.verifiedAt > CACHE_TTL_MS) return null;
      return data;
    } catch(e){ return null; }
  }

  function setCached(ticketRef, info){
    try {
      sessionStorage.setItem(CACHE_PREFIX + ticketRef, JSON.stringify({
        guestName: info.guestName || '',
        verifiedAt: Date.now()
      }));
    } catch(e){}
  }

  var hlsInstance = null;

  function attachStream(url){
    if (!url){
      showError('Stream not configured',
        'This event does not have a stream URL set on Starlane. Contact support.',
        { icon: '⚠️', showBuy: false });
      return;
    }
    if (hlsInstance){
      try { hlsInstance.destroy(); } catch(e){}
      hlsInstance = null;
    }
    var isHls = /\.m3u8(\?|#|$)/i.test(url);

    if (isHls && window.Hls && Hls.isSupported()){
      hlsInstance = new Hls({ liveDurationInfinity: true });
      hlsInstance.loadSource(url);
      hlsInstance.attachMedia(videoEl);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, tryPlay);
      hlsInstance.on(Hls.Events.ERROR, function(evt, data){
        if (!data || !data.fatal) return;
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hlsInstance.startLoad();
        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hlsInstance.recoverMediaError();
        else showError('Stream error',
          'Could not connect to the live stream. Try refreshing.',
          { icon: '📡', showRetry: true });
      });
    } else if (isHls && videoEl.canPlayType('application/vnd.apple.mpegurl')){
      videoEl.src = url;
      tryPlay();
    } else {
      videoEl.src = url;
      tryPlay();
    }
  }

  function tryPlay(){
    videoEl.muted = true;
    var p = videoEl.play();
    if (p && typeof p.then === 'function'){
      p.catch(function(){ unmuteBtn.textContent = '▶ Tap to play'; });
    }
  }

  unmuteBtn.addEventListener('click', function(){
    videoEl.muted = false;
    videoEl.volume = 1;
    if (videoEl.paused) videoEl.play().catch(function(){});
    unmuteBtn.classList.add('hidden');
  });

  videoEl.addEventListener('volumechange', function(){
    if (!videoEl.muted && videoEl.volume > 0) unmuteBtn.classList.add('hidden');
  });

  videoEl.addEventListener('pause', function(){
    if (!videoEl.ended && videoEl.currentTime > 0){
      unmuteBtn.textContent = '▶ Resume';
      unmuteBtn.classList.remove('hidden');
    }
  });

  var bootGuard = false;

  async function boot(){
    if (bootGuard) return;
    bootGuard = true;
    setTimeout(function(){ bootGuard = false; }, 1500);

    show(loadingState); hide(videoState); hide(paywallState);

    var ticketRef = new URLSearchParams(window.location.search).get('ticketRef');

    if (!ticketRef){
      showError('No ticket found',
        'This link is missing a ticket reference. Use the exact link sent to your email after purchase.',
        { icon: '🎫', showBuy: true });
      return;
    }

    // Cache hit → skip the API call entirely.
    // Protects against the server flipping status to checked-in on first call.
    var cached = getCached(ticketRef);
    if (cached){
      grantAccess(cached.guestName);
      return;
    }

    var response;
    try {
      response = await fetch(VERIFY_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ticketRef: ticketRef })
      });
    } catch (networkErr){
      showError('Could not reach server',
        'We could not verify your ticket right now. Check your connection and try again.',
        { icon: '📡', showRetry: true });
      return;
    }

    if (!response.ok){
      showError('Verification failed',
        'The server returned an error. If this keeps happening, contact support.',
        { icon: '⚠️', showRetry: true });
      return;
    }

    var data;
    try { data = await response.json(); }
    catch (parseErr){
      showError('Unexpected response',
        'The server sent something we could not read. Contact support.',
        { icon: '⚠️', showRetry: true });
      return;
    }

    if (data && data.valid){
      setCached(ticketRef, { guestName: data.guestName || '' });
      grantAccess(data.guestName);
      return;
    }

    showError('Ticket not valid',
      (data && (data.error || data.message)) || 'This ticket is not valid for streaming.',
      { icon: '🔒', showBuy: true });
  }

  function grantAccess(guestName){
    hide(loadingState); hide(paywallState); show(videoState);
    welcomeBar.innerHTML = guestName
      ? 'Welcome, <strong>' + escapeHtml(guestName) + '</strong>. Enjoy the stream.'
      : '';
    attachStream(resolveStreamUrl());
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

})();
</script>

</body>
  </html>
