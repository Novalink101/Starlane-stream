<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050508">
<meta name="robots" content="noindex, nofollow">
<title>Watch · Starlane Stream</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  :root{
    --red:#E50914; --red-hover:#FF3B4E;
    --bg:#050508; --text:#fff;
    --text-2:rgba(255,255,255,.75); --text-3:rgba(255,255,255,.5);
    --green:#10B981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(ellipse at 50% 0%, rgba(229,9,20,.08), transparent 55%),
      #050508;
    color: var(--text);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .hidden { display: none !important; }
  .stage { max-width: 1100px; width: 100%; text-align: center; }

  /* Loading */
  .spinner {
    width: 44px; height: 44px;
    border: 4px solid rgba(255,255,255,.1);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin .9s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-state h2 { font-size: 18px; font-weight: 700; color: var(--text-2); }

  /* Player */
  .player-wrap {
    position: relative; background: #000;
    border-radius: 14px; overflow: hidden;
    aspect-ratio: 16/9;
    border: 1px solid rgba(255,255,255,.08);
  }
  .player-wrap video {
    width: 100%; height: 100%; display: block;
    object-fit: contain; background: #000;
  }
  .unmute-btn {
    position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.78);
    border: 1px solid rgba(255,255,255,.25);
    color: #fff; padding: 12px 22px;
    border-radius: 999px; font-size: 14px; font-weight: 800;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: background .2s, border-color .2s;
    z-index: 5;
    font-family: inherit;
  }
  .unmute-btn:hover { background: var(--red); border-color: var(--red); }
  .welcome-bar { margin-bottom: 14px; font-size: 13px; color: var(--text-3); font-weight: 600; }
  .welcome-bar strong { color: var(--green); }

  /* Paywall / error */
  .paywall-icon {
    width: 72px; height: 72px; border-radius: 50%;
    background: rgba(229,9,20,.12);
    border: 2px solid rgba(229,9,20,.3);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px; font-size: 32px;
  }
  .paywall h1 { font-size: clamp(1.4rem, 4vw, 2rem); margin-bottom: 10px; }
  .paywall p {
    color: var(--text-3); font-size: 15px; line-height: 1.6;
    max-width: 480px; margin: 0 auto 24px;
  }
  .paywall .ref {
    display: inline-block; margin-top: 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px; color: var(--text-3);
    padding: 6px 12px; background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08); border-radius: 8px;
    user-select: all;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 14px 26px; border-radius: 999px;
    font-size: 15px; font-weight: 900;
    text-decoration: none; border: none; cursor: pointer;
    font-family: inherit; transition: all .2s;
  }
  .btn.primary { background: var(--red); color: #fff; box-shadow: 0 10px 28px rgba(229,9,20,.4); }
  .btn.primary:hover { background: var(--red-hover); transform: translateY(-2px); }
  .btn.ghost {
    background: rgba(255,255,255,.06); color: #fff;
    border: 1px solid rgba(255,255,255,.14);
  }
  .btn.ghost:hover { background: rgba(255,255,255,.12); }
  .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>

<div class="stage">

  <!-- LOADING -->
  <div id="loading-state">
    <div class="spinner"></div>
    <h2>Verifying your ticket…</h2>
  </div>

  <!-- PLAYER -->
  <div id="video-state" class="hidden">
    <div class="welcome-bar" id="welcome-bar"></div>
    <div class="player-wrap">
      <video id="live-stream" playsinline controls muted autoplay></video>
      <button id="unmute-btn" class="unmute-btn" type="button" hidden>🔊 Tap to unmute</button>
    </div>
  </div>

  <!-- PAYWALL / ERROR -->
  <div id="paywall-state" class="paywall hidden">
    <div class="paywall-icon" id="paywall-icon">🔒</div>
    <h1 id="paywall-title">Access denied</h1>
    <p id="paywall-message">You need a valid Novalink ticket to watch this stream.</p>
    <div id="paywall-ref"></div>
    <div class="btn-row" id="paywall-actions"></div>
  </div>

</div>

<script>
(function(){
  'use strict';

  /* ══════════════════════════════════════════════════════════════════
     CONFIG — the ONE thing you edit per event
     ══════════════════════════════════════════════════════════════════
     Each key is the URL slug the admin pastes into Event Studio.
     Each value is the HLS (.m3u8) URL of that event's live stream.

     Example:
       Admin pastes into Event Studio:
         https://starlane-stream.onrender.com/live/boksburg-jazz

       Novalink sends the buyer to:
         https://starlane-stream.onrender.com/live/boksburg-jazz?ticketRef=NL-...

       Watch page looks up slug "boksburg-jazz" in this map:
  */
  var STREAM_MAP = {
    // 'boksburg-jazz': 'https://your-cdn.com/boksburg-jazz.m3u8',
    // 'cape-town-comedy': 'https://your-cdn.com/cape-town-comedy.m3u8',
  };

  /* If you ever run a single-event Starlane (one URL for one stream),
     set DEFAULT_STREAM_URL and the slug is ignored. Otherwise leave blank. */
  var DEFAULT_STREAM_URL = '';

  /* ══════════════════════════════════════════════════════════════════ */

  var VERIFY_ENDPOINT = 'https://novalink-api-8vfg.onrender.com/api/verify-stream';
  var CACHE_PREFIX = 'starlane_verified_';
  var CACHE_TTL_MS = 6 * 60 * 60 * 1000; // 6 hours

  var loadingState   = document.getElementById('loading-state');
  var videoState     = document.getElementById('video-state');
  var paywallState   = document.getElementById('paywall-state');
  var paywallTitle   = document.getElementById('paywall-title');
  var paywallIcon    = document.getElementById('paywall-icon');
  var paywallMessage = document.getElementById('paywall-message');
  var paywallRef     = document.getElementById('paywall-ref');
  var paywallActions = document.getElementById('paywall-actions');
  var welcomeBar     = document.getElementById('welcome-bar');
  var videoEl        = document.getElementById('live-stream');
  var unmuteBtn      = document.getElementById('unmute-btn');

  /* ── helpers ─────────────────────────────────────────────────────── */

  function show(el){ el.classList.remove('hidden'); }
  function hide(el){ el.classList.add('hidden'); }

  function escapeHtml(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function getTicketRef(){
    return new URLSearchParams(window.location.search).get('ticketRef') || '';
  }

  /* Resolve stream URL from the current pathname /live/<slug> */
  function resolveStreamUrl(){
    var path = window.location.pathname || '/';
    var m = path.match(/^\/live\/([^\/]+?)(?:\.html)?\/?$/i);
    if (m && STREAM_MAP[m[1]]) return STREAM_MAP[m[1]];
    if (!m && DEFAULT_STREAM_URL) return DEFAULT_STREAM_URL;
    return '';
  }

  function renderRef(ref){
    if (!ref) { paywallRef.innerHTML = ''; return; }
    paywallRef.innerHTML = '<span class="ref">Ticket: ' + escapeHtml(ref) + '</span>';
  }

  function showPaywall(title, message, opts){
    opts = opts || {};
    hide(loadingState); hide(videoState); show(paywallState);
    paywallIcon.textContent    = opts.icon || '🔒';
    paywallTitle.textContent   = title;
    paywallMessage.textContent = message;
    renderRef(opts.showRef ? getTicketRef() : '');

    var html = '';
    if (opts.showRetry){
      html += '<button type="button" class="btn primary" id="retry-btn">Try again</button>';
    }
    if (opts.showBuy){
      html += '<a href="https://novalink-tickets.onrender.com/events.html" class="btn ' +
              (opts.showRetry ? 'ghost' : 'primary') + '">Buy a ticket on Novalink</a>';
    }
    paywallActions.innerHTML = html;

    var retry = document.getElementById('retry-btn');
    if (retry) retry.addEventListener('click', boot);
  }

  /* ── cache (protects against server flipping status on verify) ───── */

  function getCached(ref){
    try {
      var raw = sessionStorage.getItem(CACHE_PREFIX + ref);
      if (!raw) return null;
      var data = JSON.parse(raw);
      if (!data || !data.verifiedAt) return null;
      if (Date.now() - data.verifiedAt > CACHE_TTL_MS) return null;
      return data;
    } catch(e){ return null; }
  }

  function setCached(ref, guestName){
    try {
      sessionStorage.setItem(CACHE_PREFIX + ref, JSON.stringify({
        guestName: guestName || '',
        verifiedAt: Date.now()
      }));
    } catch(e){}
  }

  /* ── stream loader (HLS + native) ────────────────────────────────── */

  var hlsInstance = null;

  function attachStream(url){
    if (!url){
      showPaywall(
        'Stream not configured',
        'This event has no stream URL set on Starlane yet. If you just paid, contact support and quote your ticket number below.',
        { icon: '⚠️', showRef: true }
      );
      return;
    }

    if (hlsInstance){
      try { hlsInstance.destroy(); } catch(e){}
      hlsInstance = null;
    }

    var isHls = /\.m3u8(\?|#|$)/i.test(url);

    if (isHls && window.Hls && Hls.isSupported()){
      hlsInstance = new Hls({ liveDurationInfinity: true });
      hlsInstance.loadSource(url);
      hlsInstance.attachMedia(videoEl);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, tryPlay);
      hlsInstance.on(Hls.Events.ERROR, function(evt, data){
        if (!data || !data.fatal) return;
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR){
          hlsInstance.startLoad();
        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR){
          hlsInstance.recoverMediaError();
        } else {
          showPaywall(
            'Stream error',
            'We could not connect to the live stream. Try refreshing the page.',
            { icon: '📡', showRetry: true, showRef: true }
          );
        }
      });
    } else if (isHls && videoEl.canPlayType('application/vnd.apple.mpegurl')){
      videoEl.src = url;
      tryPlay();
    } else {
      videoEl.src = url;
      tryPlay();
    }
  }

  function tryPlay(){
    videoEl.muted = true;
    var p = videoEl.play();
    if (p && typeof p.then === 'function'){
      p.then(function(){
        unmuteBtn.hidden = false;
      }).catch(function(){
        unmuteBtn.textContent = '▶ Tap to play';
        unmuteBtn.hidden = false;
      });
    }
  }

  /* ── unmute / resume button ──────────────────────────────────────── */

  unmuteBtn.addEventListener('click', function(){
    videoEl.muted = false;
    videoEl.volume = 1;
    if (videoEl.paused) videoEl.play().catch(function(){});
    unmuteBtn.hidden = true;
  });

  videoEl.addEventListener('volumechange', function(){
    if (!videoEl.muted && videoEl.volume > 0) unmuteBtn.hidden = true;
  });

  /* ── main flow ───────────────────────────────────────────────────── */

  var bootGuard = false;

  async function boot(){
    if (bootGuard) return;
    bootGuard = true;
    setTimeout(function(){ bootGuard = false; }, 1500);

    show(loadingState); hide(videoState); hide(paywallState);

    var ticketRef = getTicketRef();

    if (!ticketRef){
      showPaywall(
        'No ticket found',
        'This link is missing a ticket reference. Use the exact link sent to your email after purchase, or buy a ticket below.',
        { icon: '🎫', showBuy: true }
      );
      return;
    }

    /* Cache hit — skip the API call entirely.
       This is what saves buyers when the server flips status→checked-in
       on first verify: refresh within the same tab still works. */
    var cached = getCached(ticketRef);
    if (cached){
      grantAccess(cached.guestName);
      return;
    }

    var response;
    try {
      response = await fetch(VERIFY_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ticketRef: ticketRef })
      });
    } catch (networkErr){
      showPaywall(
        'Could not reach server',
        'We could not verify your ticket right now. Check your connection and try again.',
        { icon: '📡', showRetry: true, showRef: true }
      );
      return;
    }

    if (!response.ok){
      showPaywall(
        'Verification failed',
        'The server returned an error. If this keeps happening, contact support.',
        { icon: '⚠️', showRetry: true, showRef: true }
      );
      return;
    }

    var data;
    try { data = await response.json(); }
    catch (parseErr){
      showPaywall(
        'Unexpected response',
        'The server sent something we could not read. Contact support and quote your ticket below.',
        { icon: '⚠️', showRetry: true, showRef: true }
      );
      return;
    }

    if (data && data.valid){
      setCached(ticketRef, data.guestName || '');
      grantAccess(data.guestName || '');
      return;
    }

    showPaywall(
      'Ticket not valid',
      (data && (data.error || data.message)) || 'This ticket is not valid for streaming.',
      { icon: '🔒', showBuy: true, showRef: true }
    );
  }

  function grantAccess(guestName){
    hide(loadingState); hide(paywallState); show(videoState);
    welcomeBar.innerHTML = guestName
      ? 'Welcome, <strong>' + escapeHtml(guestName) + '</strong>. Enjoy the stream.'
      : '';
    attachStream(resolveStreamUrl());
  }

  /* ── go ──────────────────────────────────────────────────────────── */

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

})();
</script>

</body>
</html>
