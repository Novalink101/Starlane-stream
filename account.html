<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="color-scheme" content="light" />
<title>My Account · Starlane Stream</title>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root { 
    --red: #E50914; 
    --red-hover: #FF3B4E;
    --bg: #ffffff; 
    --surface: #f9fafb; 
    --text: #111827; 
    --text-muted: #6b7280; 
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background: var(--bg); color: var(--text); 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    line-height: 1.5; -webkit-font-smoothing: antialiased; 
    min-height: 100vh; display: flex; flex-direction: column; position: relative;
  }
  a { text-decoration: none; color: inherit; }
  .hidden { display: none !important; }
  main { flex: 1; }

  /* Starfield */
  .starfield { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: #ffffff; overflow: hidden; }
  .stars-1 { position: absolute; inset: -50%; background-image: radial-gradient(1.5px 1.5px at 10% 20%, rgba(229,9,20,.15), transparent 100%), radial-gradient(1px 1px at 85% 15%, rgba(0,0,0,.08), transparent 100%); background-size: 200px 200px; animation: drift 40s linear infinite; }
  .stars-2 { position: absolute; inset: -50%; background-image: radial-gradient(1px 1px at 20% 30%, rgba(229,9,20,.3), transparent 100%), radial-gradient(2px 2px at 60% 10%, rgba(0,0,0,.15), transparent 100%); background-size: 300px 300px; animation: drift 20s linear infinite reverse; }
  @keyframes drift { 0% { transform: translateY(0) translateX(0); } 100% { transform: translateY(-200px) translateX(-100px); } }

  /* Navbar */
  .nav { border-bottom: 1px solid var(--border); padding: 16px 0; position: sticky; top: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); z-index: 50; }
  .nav-inner { max-width: 1000px; margin: 0 auto; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo svg { width: 28px; height: 34px; }
  .logo b { font-weight: 900; font-size: 20px; color: #111827; }
  .logo b span { color: var(--red); }
  .btn-nav { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 8px; font-weight: 700; font-size: 14px; background: var(--surface); border: 1px solid var(--border); transition: 0.2s; cursor: pointer; }
  .btn-nav:hover { background: #fff; border-color: var(--text); }

  /* Main Content */
  .container { max-width: 800px; margin: 60px auto; padding: 0 24px; }
  .page-title { font-size: 32px; font-weight: 900; letter-spacing: -1px; margin-bottom: 32px; }

  /* Profile Card */
  .profile-card { background: #fff; border: 1px solid var(--border); border-radius: 24px; padding: 40px; display: flex; align-items: center; gap: 24px; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05); margin-bottom: 40px; }
  .avatar { width: 80px; height: 80px; border-radius: 50%; background: #fee2e2; color: var(--red); display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 900; }
  .profile-info h2 { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
  .profile-info p { font-size: 15px; color: var(--text-muted); font-weight: 500; margin-bottom: 12px; }
  .btn-signout { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; background: #fee2e2; color: var(--red); font-weight: 700; font-size: 13px; border: 1px solid #fecaca; cursor: pointer; transition: 0.2s; }
  .btn-signout:hover { background: var(--red); color: #fff; border-color: var(--red); }

  /* Event List */
  .section-title { font-size: 20px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  .section-title i { color: var(--red); }
  
  .event-list { display: flex; flex-direction: column; gap: 16px; }
  .event-item { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
  .event-item:hover { border-color: var(--red); box-shadow: 0 4px 12px rgba(229,9,20,0.05); }
  .event-info h4 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .event-info p { font-size: 14px; color: var(--text-muted); font-weight: 500; }
  
  .btn-watch { padding: 10px 20px; border-radius: 10px; background: var(--red); color: #fff; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
  .btn-watch:hover { background: var(--red-hover); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(229,9,20,0.3); }

  .empty-state { text-align: center; padding: 60px 20px; background: #fff; border: 1px dashed var(--border); border-radius: 20px; color: var(--text-muted); }
  .empty-state i { width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.5; }
  .empty-state h3 { font-size: 18px; font-weight: 800; color: var(--text); margin-bottom: 8px; }
  
  .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin .8s linear infinite; margin: 40px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="starfield"><div class="stars-1"></div><div class="stars-2"></div></div>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 60 74" aria-hidden="true">
        <defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E50914"/><stop offset="100%" stop-color="#FF5566"/></linearGradient></defs>
        <path d="M10 60 Q 22 32 44 20" stroke="url(#sg)" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M16 62 Q 26 40 46 26" stroke="url(#sg)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>
        <circle cx="46" cy="18" r="5" fill="#fff"/><circle cx="46" cy="18" r="2.5" fill="#E50914"/>
      </svg>
      <b>STAR<span>LANE</span></b>
    </a>
    <a href="index.html" class="btn-nav"><i data-lucide="home" size="16"></i> Back to Home</a>
  </div>
</nav>

<main class="container">
  <div id="loading" class="spinner"></div>

  <div id="content" class="hidden">
    <h1 class="page-title">My Account</h1>

    <!-- Profile Info -->
    <div class="profile-card">
      <div class="avatar" id="avatar-initials">?</div>
      <div class="profile-info" style="flex: 1;">
        <h2 id="user-name">Loading...</h2>
        <p id="user-email">Loading...</p>
        <button class="btn-signout" id="btn-signout">
          <i data-lucide="log-out" size="14"></i> Sign Out
        </button>
      </div>
    </div>

    <!-- My Streams -->
    <div>
      <h2 class="section-title"><i data-lucide="play-circle"></i> My Unlocked Streams</h2>
      <div id="my-streams" class="event-list">
        <!-- Streams injected here -->
      </div>
    </div>
  </div>

  <div id="not-logged-in" class="hidden empty-state">
    <i data-lucide="lock"></i>
    <h3>You are not signed in</h3>
    <p style="margin-bottom: 24px;">Please sign in to view your account and unlocked streams.</p>
    <a href="auth.html?redirect=account.html" class="btn-watch">Sign In Now <i data-lucide="arrow-right" size="16"></i></a>
  </div>
</main>

<script>
(function(){
  var firebaseConfig = {
    apiKey: "AIzaSyAxki2vcYmVeZav7N1WybofdvN3n6Aa0rk",
    authDomain: "starlane-stream.firebaseapp.com",
    projectId: "starlane-stream",
    storageBucket: "starlane-stream.firebasestorage.app",
    messagingSenderId: "115625325145",
    appId: "1:115625325145:web:b14025df503bbe2b7d7748"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();
  var auth = firebase.auth();

  document.addEventListener('DOMContentLoaded', function() {
    if (window.lucide) lucide.createIcons();

    auth.onAuthStateChanged(function(user) {
      document.getElementById('loading').classList.add('hidden');

      if (!user) {
        document.getElementById('not-logged-in').classList.remove('hidden');
        if (window.lucide) lucide.createIcons();
        return;
      }

      // Populate User Info
      document.getElementById('content').classList.remove('hidden');
      var name = user.displayName || user.email.split('@')[0];
      document.getElementById('user-name').textContent = name;
      document.getElementById('user-email').textContent = user.email;
      
      // Generate Initials
      var initials = name.split(' ').map(function(n){ return n[0]; }).join('').substring(0, 2).toUpperCase();
      document.getElementById('avatar-initials').textContent = initials;

      // Load unlocked passes from Firestore
      db.collection('users').doc(user.uid).collection('passes').get().then(function(snap) {
        var streamContainer = document.getElementById('my-streams');
        streamContainer.innerHTML = '';

        if (snap.empty) {
          streamContainer.innerHTML = `
            <div class="empty-state">
              <i data-lucide="ticket"></i>
              <h3>No unlocked streams</h3>
              <p>You haven't purchased any Pay-Per-View passes yet.</p>
              <a href="index.html" class="btn-watch" style="margin-top: 16px;">Browse Events <i data-lucide="arrow-right" size="16"></i></a>
            </div>
          `;
          if (window.lucide) lucide.createIcons();
          return;
        }

        // If they have passes, fetch the event details for each pass
        var promises = [];
        snap.forEach(function(doc) {
          promises.push(db.collection('streams').doc(doc.id).get());
        });

        Promise.all(promises).then(function(eventDocs) {
          streamContainer.innerHTML = '';
          eventDocs.forEach(function(eventDoc) {
            if (eventDoc.exists) {
              var data = eventDoc.data();
              var id = eventDoc.id;
              
              var div = document.createElement('div');
              div.className = 'event-item';
              div.innerHTML = `
                <div class="event-info">
                  <h4>${data.title || 'Untitled Event'}</h4>
                  <p>${data.startDate || ''} · ${data.startTime || ''}</p>
                </div>
                <a href="watch.html?id=${id}" class="btn-watch">Watch Now <i data-lucide="play" size="14"></i></a>
              `;
              streamContainer.appendChild(div);
            }
          });
          
          if (streamContainer.innerHTML === '') {
             streamContainer.innerHTML = '<p style="color: var(--text-muted);">Your unlocked events are no longer available.</p>';
          }
          if (window.lucide) lucide.createIcons();
        });
      });

    });

    // Sign out action
    document.getElementById('btn-signout').addEventListener('click', function() {
      auth.signOut().then(function() {
        window.location.href = 'index.html';
      });
    });
  });
})();
</script>
</body>
</html>
