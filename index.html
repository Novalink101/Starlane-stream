<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>Starlane Stream · Live Events</title>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root { 
    --red: #E50914; 
    --red-hover: #FF3B4E;
    --bg: #ffffff; 
    --surface: #f9fafb; 
    --text: #111827; 
    --text-muted: #6b7280; 
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background: var(--bg); 
    color: var(--text); 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    position: relative;
    min-height: 100vh;
  }
  a { text-decoration: none; color: inherit; }
  .hidden { display: none !important; }
  
  /* ── MOVING STARFIELD BACKGROUND (WHITE THEME) ── */
  .starfield {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: #ffffff;
    overflow: hidden;
  }
  /* Slow moving faint stars */
  .stars-1 {
    position: absolute; inset: -50%;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 20%, rgba(229,9,20,.15), transparent 100%),
      radial-gradient(1px 1px at 85% 15%, rgba(0,0,0,.08), transparent 100%),
      radial-gradient(2px 2px at 45% 35%, rgba(229,9,20,.1), transparent 100%),
      radial-gradient(1.5px 1.5px at 75% 75%, rgba(229,9,20,.15), transparent 100%),
      radial-gradient(1px 1px at 25% 85%, rgba(0,0,0,.05), transparent 100%),
      radial-gradient(1.5px 1.5px at 90% 60%, rgba(229,9,20,.12), transparent 100%);
    background-size: 200px 200px;
    animation: drift 40s linear infinite;
  }
  /* Fast moving bright stars */
  .stars-2 {
    position: absolute; inset: -50%;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(229,9,20,.3), transparent 100%),
      radial-gradient(2px 2px at 60% 10%, rgba(0,0,0,.15), transparent 100%),
      radial-gradient(1.5px 1.5px at 80% 50%, rgba(229,9,20,.2), transparent 100%),
      radial-gradient(1px 1px at 30% 70%, rgba(229,9,20,.4), transparent 100%);
    background-size: 300px 300px;
    animation: drift 20s linear infinite reverse;
  }
  @keyframes drift {
    0% { transform: translateY(0) translateX(0); }
    100% { transform: translateY(-200px) translateX(-100px); }
  }

  /* The Comet */
  .comet {
    position: absolute; top: -10%; left: -10%;
    width: 150px; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(229,9,20,0.4), #E50914);
    border-radius: 2px;
    box-shadow: 0 0 10px rgba(229,9,20,0.4);
    animation: cometFly 12s linear infinite;
    opacity: 0;
  }
  .comet::after {
    content: ''; position: absolute; right: -2px; top: -2px;
    width: 6px; height: 6px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 10px #E50914;
  }
  @keyframes cometFly {
    0% { top: 0%; left: -20%; opacity: 0; transform: rotate(25deg); }
    10% { opacity: 1; }
    40% { opacity: 1; }
    50% { top: 80%; left: 120%; opacity: 0; transform: rotate(25deg); }
    100% { top: 80%; left: 120%; opacity: 0; }
  }

  /* Navbar */
  .nav { 
    border-bottom: 1px solid var(--border); 
    padding: 16px 0; 
    position: sticky; top: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); z-index: 50;
  }
  .nav-inner { 
    max-width: 1200px; margin: 0 auto; padding: 0 24px; 
    display: flex; justify-content: space-between; align-items: center; 
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo svg { width: 32px; height: 38px; display: block; filter: drop-shadow(0 4px 6px rgba(229,9,20,0.2)); }
  .logo b { font-weight: 900; font-size: 22px; letter-spacing: -0.5px; color: #111827; }
  .logo b span { color: var(--red); }

  .nav-actions { display: flex; gap: 12px; align-items: center; }
  .btn-auth { 
    font-weight: 700; font-size: 14px; padding: 10px 20px; border-radius: 8px; transition: all 0.2s; cursor: pointer; border: none;
  }
  .btn-auth.ghost { background: transparent; color: var(--text); }
  .btn-auth.ghost:hover { background: var(--surface); }
  .btn-auth.primary { background: var(--red); color: #fff; box-shadow: 0 4px 12px rgba(229,9,20,0.2); }
  .btn-auth.primary:hover { background: var(--red-hover); transform: translateY(-1px); }

  /* Hero */
  .hero { max-width: 1200px; margin: 0 auto; padding: 90px 24px 70px; text-align: center; }
  .hero h1 { font-size: clamp(2.8rem, 6vw, 4.5rem); font-weight: 900; letter-spacing: -1.5px; line-height: 1.1; margin-bottom: 24px; color: #111827; }
  .hero h1 .accent {
    background: linear-gradient(135deg, var(--red) 0%, #FF5566 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 12px rgba(229,9,20,0.2));
  }
  .hero p { font-size: 18px; color: var(--text-muted); max-width: 600px; margin: 0 auto; font-weight: 500; line-height: 1.6; }

  /* Event Grid */
  .events-section { max-width: 1200px; margin: 0 auto; padding: 20px 24px 100px; }
  .section-title { font-size: 24px; font-weight: 800; margin-bottom: 32px; display: flex; align-items: center; gap: 10px; color: #111827; }
  .section-title i { color: var(--red); }
  
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 32px; }
  
  .card { 
    background: var(--bg); border: 1px solid var(--border); border-radius: 20px; overflow: hidden;
    transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s; display: flex; flex-direction: column;
  }
  .card:hover { transform: translateY(-6px); box-shadow: 0 24px 48px -12px rgba(229,9,20,0.15); border-color: rgba(229,9,20,0.2); }
  
  .card-img { width: 100%; aspect-ratio: 16/9; background: var(--surface); object-fit: cover; border-bottom: 1px solid var(--border); }
  .card-content { padding: 24px; flex: 1; display: flex; flex-direction: column; }
  
  .badge { 
    display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; 
    background: #fee2e2; color: var(--red); margin-bottom: 16px; align-self: flex-start;
  }
  .badge.free { background: #dcfce7; color: #16a34a; }
  
  .card-title { font-size: 20px; font-weight: 800; margin-bottom: 8px; line-height: 1.3; color: #111827; }
  .card-date { font-size: 14px; color: var(--text-muted); font-weight: 500; display: flex; align-items: center; gap: 6px; margin-bottom: 24px; }
  
  .card-footer { margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
  .price { font-size: 20px; font-weight: 900; color: #111827; }
  .price span { font-size: 14px; color: var(--text-muted); font-weight: 500; }
  
  .btn-watch { 
    display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 10px; 
    background: var(--surface); color: var(--text); font-weight: 700; font-size: 14px; border: 1px solid var(--border);
    transition: all 0.2s;
  }
  .btn-watch:hover { background: var(--text); color: #fff; border-color: var(--text); }
  .btn-buy { background: var(--red); color: #fff; border-color: var(--red); box-shadow: 0 4px 12px rgba(229,9,20,0.2); }
  .btn-buy:hover { background: var(--red-hover); border-color: var(--red-hover); color: #fff; transform: translateY(-2px); box-shadow: 0 8px 16px rgba(229,9,20,0.3); }

  /* Spinner & Empty State */
  .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin .8s linear infinite; margin: 40px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty i { width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.5; }
  .empty h3 { font-size: 20px; font-weight: 800; color: var(--text); margin-bottom: 8px; }

  @media (max-width: 768px) {
    .hero { padding: 60px 24px 40px; }
    .btn-auth.ghost { display: none; }
  }
</style>
</head>
<body>

<!-- Flashy White Background -->
<div class="starfield">
  <div class="stars-1"></div>
  <div class="stars-2"></div>
  <div class="comet"></div>
</div>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 60 74" aria-hidden="true">
        <defs>
          <linearGradient id="starGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#E50914"/>
            <stop offset="100%" stop-color="#FF5566"/>
          </linearGradient>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <path d="M10 60 Q 22 32 44 20" stroke="url(#starGrad)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9"/>
        <path d="M16 62 Q 26 40 46 26" stroke="url(#starGrad)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>
        <circle cx="46" cy="18" r="5" fill="#fff" filter="url(#glow)"/>
        <circle cx="46" cy="18" r="2.5" fill="#E50914"/>
      </svg>
      <b>STAR<span>LANE</span></b>
    </a>
    
    <!-- DYNAMIC NAVIGATION ACTIONS -->
    <div class="nav-actions">
      <div id="nav-logged-out" class="nav-actions">
        <a href="auth.html" class="btn-auth ghost">Sign In</a>
        <a href="auth.html?tab=signup" class="btn-auth primary">Sign Up</a>
      </div>
      
      <div id="nav-user" class="nav-actions hidden">
        <a href="account.html" class="btn-auth ghost">My Account</a>
      </div>

      <div id="nav-admin" class="nav-actions hidden">
        <a href="account.html" class="btn-auth ghost">My Account</a>
        <a href="admin.html" class="btn-auth primary">Admin Dashboard</a>
      </div>
    </div>
  </div>
</nav>

<header class="hero">
  <h1>Experience the event,<br>from <span class="accent">anywhere.</span></h1>
  <p>Watch live events in crystal clear HD. If you have a ticket, you're already in.</p>
</header>

<section class="events-section">
  <h2 class="section-title"><i data-lucide="calendar"></i> Upcoming Streams</h2>
  <div id="loading" class="spinner"></div>
  <div id="event-grid" class="grid hidden"></div>
  <div id="empty-state" class="empty hidden">
    <i data-lucide="video-off"></i>
    <h3>No events found</h3>
    <p>Check back later for new live streams.</p>
  </div>
</section>

<script>
(function(){
  var firebaseConfig = {
    apiKey: "AIzaSyAxki2vcYmVeZav7N1WybofdvN3n6Aa0rk",
    authDomain: "starlane-stream.firebaseapp.com",
    projectId: "starlane-stream",
    storageBucket: "starlane-stream.firebasestorage.app",
    messagingSenderId: "115625325145",
    appId: "1:115625325145:web:b14025df503bbe2b7d7748"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();
  var auth = firebase.auth();

  var ADMIN_EMAILS = ['nylnathan340@gmail.com', 'customerservicesnovalink@gmail.com'];

  function formatDate(dateStr, timeStr) {
    if (!dateStr) return 'Date TBA';
    try {
      var d = new Date(dateStr + 'T' + (timeStr || '00:00'));
      return d.toLocaleDateString('en-ZA', { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    } catch(e) { return dateStr; }
  }

  document.addEventListener('DOMContentLoaded', function() {
    if (window.lucide) lucide.createIcons();

    // 1. HANDLE USER ROLE IN NAVBAR
    auth.onAuthStateChanged(function(user) {
      var elLoggedOut = document.getElementById('nav-logged-out');
      var elUser = document.getElementById('nav-user');
      var elAdmin = document.getElementById('nav-admin');

      if (user) {
        elLoggedOut.classList.add('hidden');
        
        var isAdmin = ADMIN_EMAILS.includes(user.email.toLowerCase());
        if (isAdmin) {
          elAdmin.classList.remove('hidden');
          elUser.classList.add('hidden');
        } else {
          elUser.classList.remove('hidden');
          elAdmin.classList.add('hidden');
        }
      } else {
        elLoggedOut.classList.remove('hidden');
        elUser.classList.add('hidden');
        elAdmin.classList.add('hidden');
      }
    });

    // 2. LOAD EVENTS
    db.collection('streams').where('active', '==', true).get()
      .then(function(snap) {
        document.getElementById('loading').classList.add('hidden');
        
        if (snap.empty) {
          document.getElementById('empty-state').classList.remove('hidden');
          if (window.lucide) lucide.createIcons();
          return;
        }

        var grid = document.getElementById('event-grid');
        grid.classList.remove('hidden');

        snap.forEach(function(doc) {
          var data = doc.data();
          var id = doc.id;
          
          var title = data.title || 'Untitled Event';
          var dateStr = formatDate(data.startDate, data.startTime);
          var poster = data.posterUrl || 'https://images.unsplash.com/photo-1540039155732-684736882207?q=80&w=800&auto=format&fit=crop';
          
          // Determine if it's paid or free
          var isPPV = data.requiresTicket || data.ppvPrice;
          
          var priceHTML = '';
          var actionBtn = '';

          if (isPPV) {
            priceHTML = '<div class="price">R' + (data.ppvPrice || 150) + '</div>';
            actionBtn = '<a href="watch.html?id=' + id + '" class="btn-watch btn-buy">Get Access <i data-lucide="ticket"></i></a>';
          } else {
            priceHTML = '<div class="price">Free <span>with ticket</span></div>';
            actionBtn = '<a href="watch.html?id=' + id + '" class="btn-watch">Watch Now <i data-lucide="play"></i></a>';
          }

          var card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <img src="${poster}" alt="${title}" class="card-img" onerror="this.src='https://images.unsplash.com/photo-1540039155732-684736882207?q=80&w=800&auto=format&fit=crop'">
            <div class="card-content">
              <span class="badge ${isPPV ? '' : 'free'}">${isPPV ? 'Ticketed Event' : 'Free Stream'}</span>
              <h3 class="card-title">${title}</h3>
              <div class="card-date"><i data-lucide="clock" size="16"></i> ${dateStr}</div>
              <div class="card-footer">
                ${priceHTML}
                ${actionBtn}
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
        
        if (window.lucide) lucide.createIcons();
      })
      .catch(function(err) {
        console.error(err);
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('empty-state').classList.remove('hidden');
        document.getElementById('empty-state').innerHTML = '<p>Error loading events: ' + err.message + '</p>';
      });
  });
})();
</script>
</body>
</html>
