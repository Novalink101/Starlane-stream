<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>Starlane Stream · Live Events</title>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root { 
    --red: #E50914; 
    --bg: #ffffff; 
    --surface: #f9fafb; 
    --text: #111827; 
    --text-muted: #6b7280; 
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background: var(--bg); 
    color: var(--text); 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { text-decoration: none; color: inherit; }
  
  /* Navbar */
  .nav { 
    border-bottom: 1px solid var(--border); 
    padding: 20px 0; 
    position: sticky; top: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); z-index: 50;
  }
  .nav-inner { 
    max-width: 1200px; margin: 0 auto; padding: 0 24px; 
    display: flex; justify-content: space-between; align-items: center; 
  }
  .logo { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
  .logo-icon { color: var(--red); }
  .nav-links { display: flex; gap: 24px; align-items: center; }
  .nav-links a { font-weight: 600; font-size: 14px; color: var(--text-muted); transition: color 0.2s; }
  .nav-links a:hover { color: var(--text); }
  .btn-nav { background: var(--text); color: #fff; padding: 10px 20px; border-radius: 8px; font-weight: 600; transition: background 0.2s; }
  .btn-nav:hover { background: #000; }

  /* Hero */
  .hero { max-width: 1200px; margin: 0 auto; padding: 80px 24px 60px; text-align: center; }
  .hero h1 { font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 900; letter-spacing: -1.5px; line-height: 1.1; margin-bottom: 20px; }
  .hero p { font-size: 18px; color: var(--text-muted); max-width: 600px; margin: 0 auto; font-weight: 500; }

  /* Event Grid */
  .events-section { max-width: 1200px; margin: 0 auto; padding: 20px 24px 100px; }
  .section-title { font-size: 24px; font-weight: 800; margin-bottom: 32px; display: flex; align-items: center; gap: 10px; }
  
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 32px; }
  
  .card { 
    background: var(--bg); border: 1px solid var(--border); border-radius: 20px; overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1); }
  
  .card-img { width: 100%; aspect-ratio: 16/9; background: var(--surface); object-fit: cover; border-bottom: 1px solid var(--border); }
  .card-content { padding: 24px; flex: 1; display: flex; flex-direction: column; }
  
  .badge { 
    display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; 
    background: #fee2e2; color: var(--red); margin-bottom: 16px; align-self: flex-start;
  }
  .badge.free { background: #dcfce7; color: #16a34a; }
  
  .card-title { font-size: 20px; font-weight: 800; margin-bottom: 8px; line-height: 1.3; }
  .card-date { font-size: 14px; color: var(--text-muted); font-weight: 500; display: flex; align-items: center; gap: 6px; margin-bottom: 24px; }
  
  .card-footer { margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
  .price { font-size: 20px; font-weight: 900; }
  .price span { font-size: 14px; color: var(--text-muted); font-weight: 500; }
  
  .btn-watch { 
    display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 10px; 
    background: var(--surface); color: var(--text); font-weight: 700; font-size: 14px; border: 1px solid var(--border);
    transition: all 0.2s;
  }
  .btn-watch:hover { background: var(--text); color: #fff; border-color: var(--text); }
  .btn-buy { background: var(--red); color: #fff; border-color: var(--red); }
  .btn-buy:hover { background: #cc0812; border-color: #cc0812; color: #fff; }

  /* Spinner */
  .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin .8s linear infinite; margin: 40px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty i { width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.5; }

  @media (max-width: 768px) {
    .hero { padding: 60px 24px 40px; }
    .nav-links { display: none; }
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="logo">
      <i data-lucide="star" class="logo-icon" fill="currentColor"></i> Starlane
    </a>
    <div class="nav-links">
      <a href="index.html">Events</a>
      <a href="admin.html">Admin Login</a>
      <a href="https://novalink-tickets.onrender.com" class="btn-nav">Buy Tickets</a>
    </div>
  </div>
</nav>

<header class="hero">
  <h1>Experience the event,<br>from anywhere.</h1>
  <p>Watch live events in crystal clear HD. If you have a ticket, you're already in.</p>
</header>

<section class="events-section">
  <h2 class="section-title"><i data-lucide="calendar"></i> Upcoming Streams</h2>
  <div id="loading" class="spinner"></div>
  <div id="event-grid" class="grid hidden"></div>
  <div id="empty-state" class="empty hidden">
    <i data-lucide="video-off"></i>
    <h3>No events found</h3>
    <p>Check back later for new live streams.</p>
  </div>
</section>

<script>
(function(){
  var firebaseConfig = {
    apiKey: "AIzaSyAxki2vcYmVeZav7N1WybofdvN3n6Aa0rk",
    authDomain: "starlane-stream.firebaseapp.com",
    projectId: "starlane-stream",
    storageBucket: "starlane-stream.firebasestorage.app",
    messagingSenderId: "115625325145",
    appId: "1:115625325145:web:b14025df503bbe2b7d7748"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();

  function formatDate(dateStr, timeStr) {
    if (!dateStr) return 'Date TBA';
    try {
      var d = new Date(dateStr + 'T' + (timeStr || '00:00'));
      return d.toLocaleDateString('en-ZA', { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    } catch(e) { return dateStr; }
  }

  document.addEventListener('DOMContentLoaded', function() {
    if (window.lucide) lucide.createIcons();

    db.collection('streams').where('active', '==', true).get()
      .then(function(snap) {
        document.getElementById('loading').classList.add('hidden');
        
        if (snap.empty) {
          document.getElementById('empty-state').classList.remove('hidden');
          if (window.lucide) lucide.createIcons();
          return;
        }

        var grid = document.getElementById('event-grid');
        grid.classList.remove('hidden');

        snap.forEach(function(doc) {
          var data = doc.data();
          var id = doc.id;
          
          var title = data.title || 'Untitled Event';
          var dateStr = formatDate(data.startDate, data.startTime);
          var poster = data.posterUrl || 'https://images.unsplash.com/photo-1540039155732-684736882207?q=80&w=800&auto=format&fit=crop';
          var isPPV = data.requiresTicket || data.ppvPrice;
          
          var priceHTML = '';
          var actionBtn = '';

          if (isPPV) {
            priceHTML = '<div class="price">R' + (data.ppvPrice || 150) + '</div>';
            actionBtn = '<a href="https://novalink-tickets.onrender.com" class="btn-watch btn-buy">Get Ticket <i data-lucide="ticket"></i></a>';
          } else {
            priceHTML = '<div class="price">Free <span>with ticket</span></div>';
            actionBtn = '<a href="watch.html?id=' + id + '" class="btn-watch">Watch Now <i data-lucide="play"></i></a>';
          }

          var card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <img src="${poster}" alt="${title}" class="card-img" onerror="this.src='https://images.unsplash.com/photo-1540039155732-684736882207?q=80&w=800&auto=format&fit=crop'">
            <div class="card-content">
              <span class="badge ${isPPV ? '' : 'free'}">${isPPV ? 'Ticketed Event' : 'Live Stream'}</span>
              <h3 class="card-title">${title}</h3>
              <div class="card-date"><i data-lucide="clock" size="16"></i> ${dateStr}</div>
              <div class="card-footer">
                ${priceHTML}
                ${actionBtn}
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
        
        if (window.lucide) lucide.createIcons();
      })
      .catch(function(err) {
        console.error(err);
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('empty-state').classList.remove('hidden');
        document.getElementById('empty-state').innerHTML = '<p>Error loading events: ' + err.message + '</p>';
      });
  });
})();
</script>
</body>
</html>
